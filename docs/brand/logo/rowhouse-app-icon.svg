<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">Rowhouse</title>
  <desc id="d">A gabled roof above three horizontal bars, like rows in a table. The middle bar is picked out in a contrasting color, standing for the row currently being edited.</desc>
  <rect width="64" height="64" rx="14" fill="#0F5C45"/>
  <g transform="translate(10.5 10.5) scale(1.344)">
    <path fill="#FCFBF8" d="M2 11.5 L16 3.5 L30 11.5 Z"/>
    <rect x="2" y="14" width="28" height="4" rx="1" fill="#FCFBF8"/>
    <rect x="2" y="20" width="28" height="4" rx="1" fill="#8FC4AE"/>
    <rect x="2" y="26" width="28" height="4" rx="1" fill="#FCFBF8"/>
  </g>
</svg>
