<?xml version="1.0" encoding="UTF-8"?>
<!-- Rowhouse — animated: loading
     Same geometry as the static mark; nothing is redrawn to animate it.
     Two rules this file keeps:
       1. It RESTS in the correct static logo. A renderer that ignores
          animation (PDF, thumbnail, old browser) still shows the real mark.
       2. It honours prefers-reduced-motion and stops entirely.
     Self-contained: internal CSS only, so it animates as <img>, as a CSS
     background, inline, or in an <object>.
     (c) Kugamon LLC. The mark is a trademark; the software is MPL-2.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t d">
  <title id="t">Rowhouse</title>
  <desc id="d">The Rowhouse mark with its three rows fading in sequence, as an indeterminate loading indicator.</desc>
  <style>
    .bar { animation: breathe 1.7s ease-in-out infinite both }
    .b1 { animation-delay: 0s }
    .b2 { animation-delay: .16s }
    .b3 { animation-delay: .32s }

    /* Opacity only. Geometry never moves, so the mark cannot look distorted
       in a frame grab. */
    @keyframes breathe {
      0%, 100% { opacity: 1 }
      50%      { opacity: .32 }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none }
    }
  </style>
  <path fill="#0F5C45" d="M2 11.5 L16 3.5 L30 11.5 Z"/>
  <rect class="bar b1" x="2" y="14" width="28" height="4" rx="1" fill="#0F5C45"/>
  <rect class="bar b2" x="2" y="20" width="28" height="4" rx="1" fill="#B3431F"/>
  <rect class="bar b3" x="2" y="26" width="28" height="4" rx="1" fill="#0F5C45"/>
</svg>
