<?xml version="1.0" encoding="UTF-8"?>
<!-- Rowhouse — animated: loading, reversed
     For dark grounds: pine, ink, or a photograph.
     RESTS in the real static mark, and stops entirely on
     prefers-reduced-motion.
     (c) Kugamon LLC. The mark is a trademark; the software is MPL-2.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t d">
  <title id="t">Rowhouse</title>
  <desc id="d">The Rowhouse mark with its three rows fading in sequence, as an indeterminate loading indicator.</desc>
  <style>
    .bar { animation: breathe 1.7s ease-in-out infinite both }
    .b1 { animation-delay: 0s }
    .b2 { animation-delay: .16s }
    .b3 { animation-delay: .32s }

    /* Opacity only. The geometry never moves, so a frame grab can never catch
       a distorted mark. The floor is .42 on a dark ground, higher than the .32 used on
       light, so the rows fade rather than sink into the background. */
    @keyframes breathe {
      0%, 100% { opacity: 1 }
      50%      { opacity: .42 }
    }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none } }
  </style>
  <path fill="#FCFBF8" d="M2 11.5 L16 3.5 L30 11.5 Z"/>
  <rect class="bar b1" x="2" y="14" width="28" height="4" rx="1" fill="#FCFBF8"/>
  <rect class="bar b2" x="2" y="20" width="28" height="4" rx="1" fill="#8FC4AE"/>
  <rect class="bar b3" x="2" y="26" width="28" height="4" rx="1" fill="#FCFBF8"/>
</svg>
