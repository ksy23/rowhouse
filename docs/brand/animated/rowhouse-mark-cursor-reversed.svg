<?xml version="1.0" encoding="UTF-8"?>
<!-- Rowhouse — animated: cursor, reversed
     For dark grounds: pine, ink, or a photograph.
     RESTS in the real static mark, and stops entirely on
     prefers-reduced-motion.
     (c) Kugamon LLC. The mark is a trademark; the software is Apache-2.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t d">
  <title id="t">Rowhouse</title>
  <desc id="d">The Rowhouse mark with the highlighted row stepping between the three rows and back, the way a cursor moves down a table.</desc>
  <style>
    .row { animation-duration: 5s; animation-iteration-count: infinite }
    .r1  { animation-name: live-top }
    .r2  { animation-name: live-mid }
    .r3  { animation-name: live-bot }

    /* fill animates; no geometry moves, so there is nothing to composite */
    @keyframes live-top { 0%,52% { fill: #FCFBF8 } 60%,70% { fill: #8FC4AE } 78%,100% { fill: #FCFBF8 } }
    @keyframes live-mid { 0%,10% { fill: #8FC4AE } 18%,32% { fill: #FCFBF8 }
                           40%,50% { fill: #8FC4AE } 58%,72% { fill: #FCFBF8 } 80%,100% { fill: #8FC4AE } }
    @keyframes live-bot { 0%,12% { fill: #FCFBF8 } 20%,30% { fill: #8FC4AE } 38%,100% { fill: #FCFBF8 } }

    @media (prefers-reduced-motion: reduce) { .row { animation: none } }
  </style>
  <path fill="#FCFBF8" d="M2 11.5 L16 3.5 L30 11.5 Z"/>
  <rect class="row r1" x="2" y="14" width="28" height="4" rx="1" fill="#FCFBF8"/>
  <rect class="row r2" x="2" y="20" width="28" height="4" rx="1" fill="#8FC4AE"/>
  <rect class="row r3" x="2" y="26" width="28" height="4" rx="1" fill="#FCFBF8"/>
</svg>
