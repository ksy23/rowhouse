<template>
    <template lwc:if={isEdit}>
        <!-- The box, the cell's width, says what is chosen so far; the lists hang
             below it, too wide for a narrow cell. -->
        <div class="rh-multi-picklist" onkeydown={handleKeyDown}>
            <div
                class="slds-input slds-truncate rh-multi-summary"
                title={summary}
                aria-hidden="true"
                onmousedown={handleSummaryMouseDown}
            >
                {summary}
            </div>
            <div class={panelClass}>
                <lightning-dual-listbox
                    label={label}
                    variant="label-hidden"
                    source-label="Available"
                    selected-label="Chosen"
                    options={listOptions}
                    value={selected}
                    required={required}
                    size="5"
                    onchange={handleChange}
                ></lightning-dual-listbox>
                <template lwc:if={error}>
                    <p class="slds-form-element__help slds-text-color_error rh-editor-error" role="alert">{error}</p>
                </template>
                <div class="slds-m-top_x-small slds-text-align_right">
                    <button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
                    <button class="slds-button slds-button_brand" data-done onclick={handleDone}>Done</button>
                </div>
            </div>
        </div>
    </template>
    <template lwc:else>
        <span class="slds-truncate" title={text}>{text}</span>
    </template>
</template>
