        <section id="goal" data-anchor="goal">

          <div class="rh-call"><span class="rh-k">You need</span><p>The Rowhouse Grid User permission set, permission to customize the application and to edit the Home page, and some cases. Our org has a few dozen, a dozen of them open.</p></div>
          <div class="rh-call"><span class="rh-k">Skip the build</span><p>To go straight to using the grid, click the button below, then <b>Build</b> in the dialog: it builds <b>Service Triage</b> as steps 1 to 4 leave it, in a few seconds, while a spinner says which grid it is on. Then go on to <a href="#page" data-anchor-link="page">step 5</a>, which puts it on the Home page. The build steps are still the way to learn how a grid is made.</p><c-guide-build-grid tutorial="tutorial-service"></c-guide-build-grid></div>

        <section id="config" data-anchor="config">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. The Grid Configuration</h2>
          <p class="rh-sec-sub">This grid shares the Home page with other components, so it gets a fixed Height.</p></div>
          <ol class="rh-tut">
            <li><b>Open the records.</b> In Setup, open <span class="rh-ui">Custom Metadata Types</span>, and beside <span class="rh-ui">Grid Configuration</span> click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Fill in:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Label</td><td><span class="rh-v">Service Triage</span><button class="rh-copy" data-copy="Service Triage" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Service_Triage</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Case</span><button class="rh-copy" data-copy="Case" type="button">Copy</button></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">CreatedDate</span><button class="rh-copy" data-copy="CreatedDate" type="button">Copy</button></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Descending</span> <span class="rh-note">newest first</span></td></tr>
                <tr><td>Height (px)</td><td><span class="rh-v">480</span></td></tr>
              </tbody></table></li>
            <li><b>Save.</b></li>
          </ol>
        </section>

        <section id="columns" data-anchor="columns">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. Eight columns</h2></div>
          <ol class="rh-tut">
            <li><b>Create these Grid Column records</b>, each with <span class="rh-v">Service Triage</span> in <span class="rh-ui">Grid Configuration</span> (Custom Metadata Types › Grid Column › Manage Records › New; <span class="rh-ui">Save &amp; New</span> between them):
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref">
                <thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th><th>More</th></tr></thead>
                <tbody>
                  <tr><td>Triage Number<br><span class="rh-d">Triage_Number</span></td><td class="rh-d">CaseNumber</td><td>Case</td><td class="rh-d">10</td><td>—</td><td></td></tr>
                  <tr><td>Triage Subject<br><span class="rh-d">Triage_Subject</span></td><td class="rh-d">Subject</td><td></td><td class="rh-d">20</td><td class="rh-tick">✓</td><td>Wrap Text <span class="rh-tick">✓</span></td></tr>
                  <tr><td>Triage Account<br><span class="rh-d">Triage_Account</span></td><td class="rh-d">AccountId</td><td>Account</td><td class="rh-d">30</td><td>—</td><td></td></tr>
                  <tr><td>Triage Status<br><span class="rh-d">Triage_Status</span></td><td class="rh-d">Status</td><td></td><td class="rh-d">40</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td>Triage Priority<br><span class="rh-d">Triage_Priority</span></td><td class="rh-d">Priority</td><td></td><td class="rh-d">50</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td>Triage Origin<br><span class="rh-d">Triage_Origin</span></td><td class="rh-d">Origin</td><td>Origin</td><td class="rh-d">60</td><td>—</td><td></td></tr>
                  <tr><td>Triage Owner<br><span class="rh-d">Triage_Owner</span></td><td class="rh-d">OwnerId</td><td>Owner</td><td class="rh-d">70</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td>Triage Opened<br><span class="rh-d">Triage_Opened</span></td><td class="rh-d">CreatedDate</td><td>Opened</td><td class="rh-d">80</td><td>—</td><td></td></tr>
                </tbody></table></div></li>
          </ol>
        </section>

        <section id="rules" data-anchor="rules">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. Three display rules</h2></div>
          <ol class="rh-tut">
            <li><b>Create these Grid Display Rule records</b> (Custom Metadata Types › Grid Display Rule › Manage Records › New). In each, type the Label, then replace the <span class="rh-ui">Grid Display Rule Name</span> that fills in with the name in the table. Type <span class="rh-v">Service Triage</span> in <span class="rh-ui">Grid Configuration</span> and leave <span class="rh-ui">Inactive</span> deselected:
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref">
                <thead><tr><th>Label · Name</th><th>Field API Name</th><th>Operator</th><th>Value</th><th>Style</th><th>Apply To</th><th>Sort Order</th></tr></thead>
                <tbody>
                  <tr><td>High priority<br><span class="rh-d">Triage_High</span></td><td class="rh-d">Priority</td><td>Equals</td><td class="rh-d">High</td><td><span style="background:var(--rh-f-red);padding:1px 5px;border-radius:3px;color:#181818">Red fill</span></td><td>Cell</td><td class="rh-d">10</td></tr>
                  <tr><td>Needs triage<br><span class="rh-d">Triage_New</span></td><td class="rh-d">Status</td><td>Equals</td><td class="rh-d">New</td><td><span style="box-shadow:inset 4px 0 0 var(--rh-b-amber);padding:1px 5px 1px 9px">Amber fill</span></td><td>Row</td><td class="rh-d">20</td></tr>
                  <tr><td>Escalated<br><span class="rh-d">Triage_Escalated</span></td><td class="rh-d">IsEscalated</td><td>Equals</td><td class="rh-d">true</td><td><b>Bold</b></td><td>Row</td><td class="rh-d">30</td></tr>
                </tbody></table></div></li>
          </ol>
          <div class="rh-check rh-why">Escalated is not a column, and does not need to be: a Row rule can test any field the user can read. The grid reads it with the rows but never shows it.</div>
        </section>

        <section id="action" data-anchor="action">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. A Log a call action</h2>
          <p class="rh-sec-sub">Log a Call is a global quick action that every org has. From a case's row it opens Salesforce's Log a Call window, and the call it saves goes on that case's activity timeline, marked completed.</p></div>
          <ol class="rh-tut">
            <li><b>Open Grid Action records.</b> In <span class="rh-ui">Custom Metadata Types</span>, beside <span class="rh-ui">Grid Action</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Fill in:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Label</td><td><span class="rh-v">Log a call</span><button class="rh-copy" data-copy="Log a call" type="button">Copy</button> <span class="rh-note">what the menu says</span></td></tr>
                <tr><td>Grid Action Name</td><td><span class="rh-v">Triage_Log_Call</span><button class="rh-copy" data-copy="Triage_Log_Call" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration</td><td><span class="rh-v">Service Triage</span></td></tr>
                <tr><td>Action Type</td><td><span class="rh-v">Quick action</span></td></tr>
                <tr><td>Action Name</td><td><span class="rh-v">LogACall</span><button class="rh-copy" data-copy="LogACall" type="button">Copy</button></td></tr>
                <tr><td>Show In</td><td><span class="rh-v">Row menu</span></td></tr>
                <tr><td>Sort Order</td><td><span class="rh-v">10</span></td></tr>
              </tbody></table></li>
            <li><b>Save.</b></li>
          </ol>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>5. Put it on the Home page</h2></div>
          <ol class="rh-tut">
            <li><b>Edit the Home page.</b> Open the <span class="rh-ui">Home</span> tab, click the gear icon at the top right, and choose <span class="rh-ui">Edit Page</span>.</li>
            <li><b>Add the grid at the top.</b> Drag <span class="rh-ui">Rowhouse Grid</span> from the <span class="rh-ui">Custom - Managed</span> components to the top of the page's main region, and enter <span class="rh-v">Service_Triage</span><button class="rh-copy" data-copy="Service_Triage" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.</li>
            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>. If you are asked to activate the page, click <span class="rh-ui">Activate</span>, choose <span class="rh-ui">Org Default</span>, and follow the prompts to assign it for desktop; then click <span class="rh-ui">Back</span> (the arrow at the top left) to leave the builder.</li>
          </ol>
          <div class="rh-call rh-w"><span class="rh-k">Changing the Home page changes it for everyone</span><p>The org default Home page is what everyone sees, unless an app or profile has its own. In a production org, consider assigning the page to the support team's app or profile instead.</p></div>
        </section>

        <section id="triage" data-anchor="triage">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Kevin</span><h2>6. Triage the queue</h2></div>
          <ol class="rh-tut">
            <li><b>Open Home.</b>
              <div class="rh-check">The Service Triage grid at the top, 480 pixels tall, newest cases first, with the rest of the Home page below it. New cases are tinted amber, with an amber bar at their left edge, High priorities are red, and escalated cases are bold.</div></li>
            <li><b>See the queue by status.</b> Open the ▾ menu on the <span class="rh-ui">Status</span> header and choose <span class="rh-ui">Group by Status</span>. Each status becomes a group with its count.
              <div class="rh-check">The groups follow the order of the Status picklist, as in a Salesforce report: <span class="rh-ui">Status: New</span> at the top, then Working, Escalated and Closed.</div></li>
            <li><b>Take three new cases.</b> In the <span class="rh-ui">New</span> group, select the checkbox at the start of three cases. A bar floats over the top of the grid: "3 selected", with <span class="rh-ui">Update field</span> and <span class="rh-ui">Clear</span>.</li>
            <li><b>Move them to Working.</b> Click <span class="rh-ui">Update field</span>. Choose <span class="rh-ui">Status</span>, choose <span class="rh-ui">Working</span>, and click <span class="rh-ui">Apply</span>.
              <div class="rh-check">The Status cells of the selected cases turn yellow with "Working", their amber tint and bar go (rules follow your unsaved values), and the Save bar says "3 unsaved changes". Nothing is saved yet.</div></li>
            <li><b>Raise one priority.</b> Click the Priority of one of those cases, press <kbd>Enter</kbd>, choose <span class="rh-ui">High</span> and press <kbd>Enter</kbd>.</li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> on the Save bar.
              <div class="rh-check">The cases move to the Working group, and the raised priority turns red. The selection stays ("3 selected"), in case you want to do more to the same cases.</div></li>
            <li><b>Clear up.</b> Click <span class="rh-ui">Clear</span> in the selection bar, then open the <span class="rh-ui">Status</span> menu again and choose <span class="rh-ui">Stop grouping by Status</span>.</li>
          </ol>
        </section>

        <section id="call" data-anchor="call">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Kevin</span><h2>7. Log a call from the row</h2></div>
          <ol class="rh-tut">
            <li><b>Run the action.</b> On any case, click the ▾ at the right end of its row and choose <span class="rh-ui">Log a call</span>.
              <div class="rh-check">Salesforce's <i>Log a Call</i> window opens over the grid, with the case in <span class="rh-ui">Related To</span>.</div></li>
            <li><b>Save it.</b> Click <span class="rh-ui">Save</span>.
              <div class="rh-check">The window closes and you are back on Home.</div></li>
            <li><b>Check it.</b> Click the case's number to open the case (<kbd>Cmd</kbd>-click or <kbd>Ctrl</kbd>-click opens it in a new browser tab). The call is on its activity timeline, marked completed.</li>
          </ol>
        </section>

        <section id="new" data-anchor="new">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Kevin</span><h2>8. Add a case of his own</h2>
          <p class="rh-sec-sub">Three of the overnight cases are the same fault. Kevin opens one case to track it, without leaving Home.</p></div>
          <ol class="rh-tut">
            <li><b>Add a row.</b> Click <span class="rh-ui">New</span> above the grid, beside <span class="rh-ui">Export</span>.
              <div class="rh-check">A row at the top of the grid, with <b>New</b> where a row number goes and the amber tint and bar of a new case. Salesforce's defaults for a new case are filled in: Status <b>New</b>, Priority <b>Medium</b>, and you as Owner. The Save bar says <i>1 new record</i>.</div></li>
            <li><b>Describe it.</b> Click the new row's <span class="rh-ui">Subject</span> cell, type <span class="rh-v">Generators trip on start-up after the September update</span><button class="rh-copy" data-copy="Generators trip on start-up after the September update" type="button">Copy</button> and press <kbd>Enter</kbd>.</li>
            <li><b>Make it urgent.</b> Click the new row's <span class="rh-ui">Priority</span>, press <kbd>Enter</kbd>, choose <span class="rh-ui">High</span> and press <kbd>Enter</kbd>.</li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> on the Save bar.
              <div class="rh-check">The case gets its number and opens the list, as the newest case should: red for High priority, with the amber tint and bar of a new case, opened a moment ago. The title counts one more item.</div></li>
          </ol>
        </section>

        <section id="learned" data-anchor="learned">

            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1.1.3-2.2 1.5-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></div><h4>Row rules</h4><p>A tinted row with a bar, or bold across it, from a field that is not even a column.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h4>Update field</h4><p>One value onto many records, reviewed as unsaved edits before Save.</p></div>
            <div class="rh-tile rh-rose"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div><h4>Actions</h4><p>A quick action in every row's menu, with no code.</p></div>
            <div class="rh-tile rh-teal"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div><h4>New</h4><p>A new record typed straight into the grid, saved with any other changes.</p></div>
