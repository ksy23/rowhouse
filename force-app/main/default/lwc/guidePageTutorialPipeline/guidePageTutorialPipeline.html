        <section id="config" data-anchor="config">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. The Grid Configuration</h2></div>
          <ol class="rh-tut">
            <li><b>Open the records.</b> In Setup, type <span class="rh-v rh-plain">Custom Metadata Types</span> in the Quick Find box and click <span class="rh-ui">Custom Metadata Types</span>. Beside <span class="rh-ui">Grid Configuration</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Fill in these fields</b> and leave the others as they are:
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Label</td><td><span class="rh-v">Pipeline Review</span><button class="rh-copy" data-copy="Pipeline Review" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Pipeline_Review</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Opportunity</span><button class="rh-copy" data-copy="Opportunity" type="button">Copy</button></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">CloseDate</span><button class="rh-copy" data-copy="CloseDate" type="button">Copy</button></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Ascending</span></td></tr>
                <tr><td>Frozen Columns</td><td><span class="rh-v">1</span> <span class="rh-note">the opportunity name stays put as you scroll sideways</span></td></tr>
              </tbody></table>
            </li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>.</li>
          </ol>
        </section>

        <section id="columns" data-anchor="columns">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. Eight columns</h2>
          <p class="rh-sec-sub">Stage gets a Group Level, so the grid opens grouped by it. Amount, Probability and Close Date get subtotals, shown on every stage and in a Total row.</p></div>
          <ol class="rh-tut">
            <li><b>Open Grid Column records.</b> Back in <span class="rh-ui">Custom Metadata Types</span>, beside <span class="rh-ui">Grid Column</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Create one record per row below.</b> The Grid Column Name fills in from the Label. In every record, type <span class="rh-v">Pipeline Review</span> in <span class="rh-ui">Grid Configuration</span>. Leave empty what the table leaves empty, and leave <span class="rh-ui">Sortable</span> selected. Click <span class="rh-ui">Save &amp; New</span> between records, and <span class="rh-ui">Save</span> after the last.
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref">
                <thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th><th>More</th></tr></thead>
                <tbody>
                  <tr><td>Pipeline Name<br><span class="rh-d">Pipeline_Name</span></td><td class="rh-d">Name</td><td>Opportunity</td><td class="rh-d">10</td><td>—</td><td></td></tr>
                  <tr><td>Pipeline Account<br><span class="rh-d">Pipeline_Account</span></td><td class="rh-d">AccountId</td><td>Account</td><td class="rh-d">20</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td>Pipeline Stage<br><span class="rh-d">Pipeline_Stage</span></td><td class="rh-d">StageName</td><td></td><td class="rh-d">30</td><td class="rh-tick">✓</td><td>Group Level <span class="rh-v rh-plain">1</span></td></tr>
                  <tr><td>Pipeline Amount<br><span class="rh-d">Pipeline_Amount</span></td><td class="rh-d">Amount</td><td></td><td class="rh-d">40</td><td class="rh-tick">✓</td><td>Subtotal <span class="rh-v rh-plain">Sum</span></td></tr>
                  <tr><td>Pipeline Probability<br><span class="rh-d">Pipeline_Probability</span></td><td class="rh-d">Probability</td><td>Probability</td><td class="rh-d">50</td><td>—</td><td>Subtotal <span class="rh-v rh-plain">Average</span></td></tr>
                  <tr><td>Pipeline Close Date<br><span class="rh-d">Pipeline_Close_Date</span></td><td class="rh-d">CloseDate</td><td></td><td class="rh-d">60</td><td class="rh-tick">✓</td><td>Subtotal <span class="rh-v rh-plain">Min</span></td></tr>
                  <tr><td>Pipeline Next Step<br><span class="rh-d">Pipeline_Next_Step</span></td><td class="rh-d">NextStep</td><td></td><td class="rh-d">70</td><td class="rh-tick">✓</td><td>Wrap Text <span class="rh-tick">✓</span></td></tr>
                  <tr><td>Pipeline Owner<br><span class="rh-d">Pipeline_Owner</span></td><td class="rh-d">OwnerId</td><td>Owner</td><td class="rh-d">80</td><td class="rh-tick">✓</td><td></td></tr>
                </tbody></table></div>
            </li>
          </ol>
          <div class="rh-check rh-why">Column Label replaces a field's own label in the header. Salesforce labels the name field just "Name", so it gets a friendlier one; lookups would be headed "Account" and "Owner" anyway, and are labeled here so the record says so. Opportunity Name is left read-only so a click on it opens the record.</div>
        </section>

        <section id="rules" data-anchor="rules">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. Three display rules</h2></div>
          <ol class="rh-tut">
            <li><b>Open Grid Display Rule records.</b> In <span class="rh-ui">Custom Metadata Types</span>, beside <span class="rh-ui">Grid Display Rule</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Create these three.</b> In each, type the Label, then replace the <span class="rh-ui">Grid Display Rule Name</span> that fills in with the name in the table. Type <span class="rh-v">Pipeline Review</span> in <span class="rh-ui">Grid Configuration</span> and leave <span class="rh-ui">Inactive</span> deselected:
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref">
                <thead><tr><th>Label · Name</th><th>Field API Name</th><th>Operator</th><th>Value</th><th>Style</th><th>Apply To</th><th>Sort Order</th></tr></thead>
                <tbody>
                  <tr><td>Overdue<br><span class="rh-d">Pipeline_Overdue</span></td><td class="rh-d">CloseDate</td><td>Less than</td><td class="rh-d">TODAY</td><td><span class="rh-t-red">Red text</span></td><td>Cell</td><td class="rh-d">10</td></tr>
                  <tr><td>Big deal<br><span class="rh-d">Pipeline_Big_Deal</span></td><td class="rh-d">Amount</td><td>Greater than or equal to</td><td class="rh-d">250000</td><td><span style="background:var(--rh-f-green);padding:1px 5px;border-radius:3px;color:#181818">Green fill</span></td><td>Cell</td><td class="rh-d">20</td></tr>
                  <tr><td>In negotiation<br><span class="rh-d">Pipeline_Negotiating</span></td><td class="rh-d">StageName</td><td>Equals</td><td class="rh-d">Negotiation/Review</td><td><span style="box-shadow:inset 4px 0 0 var(--rh-b-purple);padding:1px 5px 1px 9px">Purple fill</span></td><td>Row</td><td class="rh-d">30</td></tr>
                </tbody></table></div>
            </li>
          </ol>
          <div class="rh-check rh-why">The Label is what the grid's Display Key shows, so write it for users. The Name only has to be unique across all grids. Write numbers without a currency symbol or commas: <span class="rh-v rh-plain">250000</span>, not $250,000. <span class="rh-v rh-plain">TODAY</span> is today in each user's time zone. A Row rule's fill tints the whole row lightly and draws a bar at its left edge; the tint is lighter than a cell's fill, so it never hides a cell's own color.</div>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. The page</h2></div>
          <ol class="rh-tut">
            <li><b>Create an App page.</b> In Setup, type <span class="rh-v rh-plain">Lightning App Builder</span> in the Quick Find box and click <span class="rh-ui">Lightning App Builder</span>. Click <span class="rh-ui">New</span>, choose <span class="rh-ui">App Page</span>, click <span class="rh-ui">Next</span>, enter the Label <span class="rh-v">Pipeline Review</span>, click <span class="rh-ui">Next</span>, choose <span class="rh-ui">One Region</span>, and click <span class="rh-ui">Done</span>.</li>
            <li><b>Add the grid.</b> Drag <span class="rh-ui">Rowhouse Grid</span> from the <span class="rh-ui">Custom - Managed</span> components onto the page, and enter <span class="rh-v">Pipeline_Review</span><button class="rh-copy" data-copy="Pipeline_Review" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.</li>
            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>, then <span class="rh-ui">Activate</span>. On the <span class="rh-ui">Lightning Experience</span> tab, choose <span class="rh-ui">Sales</span>, click <span class="rh-ui">Add page to app</span>, then <span class="rh-ui">Save</span>.</li>
          </ol>
        </section>

        <section id="review" data-anchor="review">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Abigail</span><h2>5. Read the pipeline</h2></div>
          <ol class="rh-tut">
            <li><b>Open the grid.</b> Open the <span class="rh-ui">Sales</span> app and click <span class="rh-ui">Pipeline Review</span> in the navigation bar (or under <span class="rh-ui">More</span>).
              <div class="rh-check">"Grouped by Stage" above the grid, a row for each stage with its count, the sum of its amounts, the average probability and the earliest close date, and a Total row at the bottom.</div></li>
            <li><b>Put the closed deals away.</b> Groups follow the order of the Stage picklist, as they do in a Salesforce report: <span class="rh-ui">Stage: Prospecting</span> first and <span class="rh-ui">Stage: Closed Won</span> last. Scroll down the grid to <span class="rh-ui">Stage: Closed Won</span> and click the arrow on its row. Its deals fold away; the Total row still counts them.</li>
            <li><b>Find the late ones.</b> Red dates in the open stages are overdue. Click <span class="rh-ui">Display Key</span>, the swatch icon beside Charts above the grid, to see what each color means, then click it again to close it.</li>
          </ol>
          <div class="rh-call rh-w"><span class="rh-k">Closed deals have past dates too</span><p>The Overdue rule tests only Close Date, so closed deals with past close dates are red as well. (A formula rule could test the stage too, as the lead queue tutorial's does.) That is why the grid is grouped by stage: closed deals sit in their own groups, which Abigail keeps folded.</p></div>
        </section>

        <section id="fix" data-anchor="fix">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Abigail</span><h2>6. Fix deals as the managers call them out</h2></div>
          <ol class="rh-tut">
            <li><b>Change an amount.</b> Click the Amount of an open deal (we use <i>University of AZ Installations</i>, $100,000.00), type <span class="rh-v">250000</span> and press <kbd>Enter</kbd>.
              <div class="rh-check">The cell turns yellow and shows $250,000.00. A Save bar appears at the bottom of the grid: "1 unsaved change".</div></li>
            <li><b>Move a deal to another stage.</b> Click the Stage of another open deal (we use <i>Edge Emergency Generator</i>), press <kbd>Enter</kbd> to edit it, choose <span class="rh-ui">Negotiation/Review</span> in the list (or type its first letters), and press <kbd>Enter</kbd>.
              <div class="rh-check">The deal turns purple at once (a light tint and a bar at its left edge), but stays in its group until you save. The Save bar now says "2 unsaved changes".</div></li>
            <li><b>Give three deals the same next step.</b> Scroll the grid sideways to Next Step (the Opportunity column stays put). Click the Next Step of the first deal in a stage with three or more deals (in our org, Id. Decision Makers), type <span class="rh-v">Send revised quote</span> and press <kbd>Enter</kbd>. Press <kbd>Shift</kbd>+<kbd>↓</kbd> twice to stretch the selection over the two deals below, then press <kbd>Ctrl</kbd>+<kbd>D</kbd> (<kbd>Cmd</kbd>+<kbd>D</kbd> on a Mac) to fill down.
              <div class="rh-check">All three Next Step cells say "Send revised quote", and the Save bar counts the new changes.</div></li>
            <li><b>Change your mind, then change it back.</b> Press <kbd>Ctrl</kbd>+<kbd>Z</kbd> (<kbd>Cmd</kbd>+<kbd>Z</kbd>): the fill down is undone in one step. Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> (<kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>) to redo it. The Save bar's <span class="rh-ui">Undo</span> and <span class="rh-ui">Redo</span> buttons do the same.</li>
            <li><b>Push out an overdue date.</b> Double-click a red Close Date in an open stage. A calendar opens under the cell (above it, if the cell is near the bottom of the grid). Click a day after today, using the right arrow beside the month name to reach a later month if you need to.
              <div class="rh-check">The date is no longer red: it shows the day you picked, in yellow, as an unsaved change.</div></li>
          </ol>
        </section>

        <section id="save" data-anchor="save">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Abigail</span><h2>7. Save and check</h2></div>
          <ol class="rh-tut">
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> on the Save bar.
              <div class="rh-check">The yellow goes. University of AZ Installations' $250,000.00 turns green (Big deal). Edge Emergency Generator moves to the Negotiation/Review group tinted purple with a purple bar at its left edge, and the group sums change to match. The new date is no longer red.</div></li>
            <li><b>Check a record.</b> Click a deal's name: the opportunity opens, with the values you saved. Press your browser's Back button to return to the grid. (<kbd>Cmd</kbd>-click or <kbd>Ctrl</kbd>-click opens it in a new browser tab instead.)</li>
          </ol>
        </section>

        <section id="view" data-anchor="view">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Abigail</span><h2>8. A view for the managers</h2>
          <p class="rh-sec-sub">The managers only want the deals that could close soon: those in the two late stages. Abigail saves that as a view of the grid, shares it with everyone, and pins it, so the grid opens on it for her.</p></div>
          <ol class="rh-tut">
            <li><b>Start a view.</b> Click <span class="rh-ui">View Controls</span>, the gear with ▾ after the search box, and choose <span class="rh-ui">New</span>. Enter the View Name <span class="rh-v">Late-stage deals</span><button class="rh-copy" data-copy="Late-stage deals" type="button">Copy</button>, choose <span class="rh-ui">All users can see this view</span>, and click <span class="rh-ui">Save</span>.
              <div class="rh-check">The title reads "Pipeline Review › Late-stage deals", and the Filters panel opens beside the list.</div>
              Without Manage Public List Views, only <span class="rh-ui">Only I can see this view</span> is offered: choose it, and the view is yours alone.</li>
            <li><b>Add the two late stages.</b> In the Filters panel, click <span class="rh-ui">Add Filter</span>, choose <span class="rh-ui">Stage</span> in <span class="rh-ui">Field</span>, leave the Condition at <span class="rh-ui">Equals</span>, choose <span class="rh-ui">Proposal/Price Quote</span> as the Value, and click <span class="rh-ui">Done</span>. Do the same again for <span class="rh-ui">Negotiation/Review</span>.
              <div class="rh-check">Two numbered filters in the panel: 1, Stage equals Proposal/Price Quote, and 2, Stage equals Negotiation/Review.</div></li>
            <li><b>Join them with OR.</b> A deal is in one stage or the other, never both, so the filters must be joined with OR. Click <span class="rh-ui">Add Filter Logic</span>, replace <span class="rh-v rh-plain">1 AND 2</span> with <span class="rh-v">1 OR 2</span>, and click <span class="rh-ui">Apply</span>.
              <div class="rh-check">Only the Proposal/Price Quote and Negotiation/Review groups are left. Under the title, after "Filtered by": "1. Stage equals Proposal/Price Quote", "2. Stage equals Negotiation/Review" and "Filter Logic: 1 OR 2". A bar above the grid says "You changed this view: the filters."</div></li>
            <li><b>Save the view.</b> Click <span class="rh-ui">Save</span> on that bar.
              <div class="rh-check">The bar goes. Everyone now finds Late-stage deals in the list under the grid's title. It is read-only to them: they can use it, or save a copy with Save As.</div></li>
            <li><b>Pin it.</b> Click the pin beside the title.
              <div class="rh-check">The pin stands upright, and pointing at it says "This view is pinned." From now on, Pipeline Review opens on Late-stage deals for you, with its two filters.</div></li>
            <li><b>Go back to the whole pipeline.</b> Click the grid's title, then <span class="rh-ui">Pipeline Review</span> in the list.
              <div class="rh-check">Every stage is back, with no filters of yours, as the grid was before this step. Late-stage deals stays pinned: the list under the title shows it as "Late-stage deals (Pinned view)".</div></li>
          </ol>
        </section>
