            <a class="rh-tile rh-clay" href="/lightning/n/Rowhouse_Guide?c__page=features&amp;c__section=audit" data-page="features" data-section="audit"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></div><h4>Audit trail</h4><p>Optionally log every change: who, when, which field, the value before and after.</p></a>
            <a class="rh-tile" href="/lightning/n/Rowhouse_Guide?c__page=features&amp;c__section=security" data-page="features" data-section="security"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h4>Salesforce security, always</h4><p>Users see and change only what their profile, permission sets and sharing allow.</p></a>
            <a class="rh-tile rh-sky" href="/lightning/n/Rowhouse_Guide?c__page=using&amp;c__section=phone" data-page="using" data-section="phone"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div><h4>Phones and narrow spaces</h4><p>Below 480 pixels wide the grid becomes a list of record cards, tap to edit.</p></a>
          </div>
        </section>

        <section id="life" data-anchor="life">
          <div class="rh-sec-head rh-rv">
            <span class="rh-sec-num">The life of an edit</span>
            <h2>Nothing is saved until you say so</h2>
            <p class="rh-sec-sub">Every change waits as an unsaved edit, shaded yellow, until Save. Then it is checked twice, saved in batches, and read back so formulas and automation show their real results.</p>
          </div>
          <div class="rh-frame rh-rv">
            <svg class="rh-dia" viewBox="0 0 960 190" role="img" aria-labelledby="lifeT lifeD">
              <title id="lifeT" data-anchor="lifeT">The life of an edit</title>
              <desc id="lifeD" data-anchor="lifeD">Six stages: you type, the change waits unsaved; you click Save; your browser checks required fields; the server checks object, field and sharing access and that the column may be edited; records are saved in batches of 200, each in its own transaction, with your triggers, flows and validation rules running; the saved rows are read back.</desc>
              <path class="rh-wire rh-solid" d="M60,62 H900" style="stroke:var(--rh-line);stroke-width:3"/>
              <path class="rh-wire" d="M60,62 H900" style="stroke-width:3"/>
              <g class="rh-gate"><circle cx="60" cy="62" r="22" fill="var(--rh-m-edit)" stroke="#d8c94a"/><text x="60" y="67" text-anchor="middle" class="rh-b">1</text></g>
              <g class="rh-gate"><circle cx="228" cy="62" r="22" fill="var(--rh-sky-soft)" stroke="var(--rh-sky-mid)"/><text x="228" y="67" text-anchor="middle" class="rh-b">2</text></g>
              <g class="rh-gate"><circle cx="396" cy="62" r="22" fill="var(--rh-plum-soft)" stroke="var(--rh-plum-mid)"/><text x="396" y="67" text-anchor="middle" class="rh-b">3</text></g>
              <g class="rh-gate"><circle cx="564" cy="62" r="22" fill="var(--rh-gold-soft)" stroke="var(--rh-gold-mid)"/><text x="564" y="67" text-anchor="middle" class="rh-b">4</text></g>
              <g class="rh-gate"><circle cx="732" cy="62" r="22" fill="var(--rh-accent-soft)" stroke="var(--rh-accent-mid)"/><text x="732" y="67" text-anchor="middle" class="rh-b">5</text></g>
              <circle cx="900" cy="62" r="22" fill="var(--rh-teal-soft)" stroke="var(--rh-teal-mid)"/><text x="900" y="67" text-anchor="middle" class="rh-b">6</text>
              <circle r="7" class="rh-dot rh-clay"><animateMotion dur="6s" repeatCount="indefinite" path="M60,62 H900"/></circle>
              <text x="60" y="112" text-anchor="middle" class="rh-b">Type</text><text x="60" y="130" text-anchor="middle" class="rh-s">the cell turns</text><text x="60" y="146" text-anchor="middle" class="rh-s">yellow: unsaved</text>
              <text x="228" y="112" text-anchor="middle" class="rh-b">Save</text><text x="228" y="130" text-anchor="middle" class="rh-s">on the Save bar,</text><text x="228" y="146" text-anchor="middle" class="rh-s">or Cancel it all</text>
              <text x="396" y="112" text-anchor="middle" class="rh-b">Browser check</text><text x="396" y="130" text-anchor="middle" class="rh-s">required fields,</text><text x="396" y="146" text-anchor="middle" class="rh-s">valid values</text>
              <text x="564" y="112" text-anchor="middle" class="rh-b">Server check</text><text x="564" y="130" text-anchor="middle" class="rh-s">object, field, sharing,</text><text x="564" y="146" text-anchor="middle" class="rh-s">editable columns only</text>
              <text x="732" y="112" text-anchor="middle" class="rh-b">Saved in batches</text><text x="732" y="130" text-anchor="middle" class="rh-s">200 records each; your</text><text x="732" y="146" text-anchor="middle" class="rh-s">automation runs</text>
              <text x="900" y="112" text-anchor="middle" class="rh-b">Read back</text><text x="900" y="130" text-anchor="middle" class="rh-s">formulas and triggers'</text><text x="900" y="146" text-anchor="middle" class="rh-s">results show</text>
            </svg>
          </div>
        </section>

        <section id="tutorials" data-anchor="tutorials">
          <div class="rh-sec-head rh-rv">
            <span class="rh-sec-num">Tutorials</span>
            <h2>Five real jobs, built from scratch</h2>
            <p class="rh-sec-sub">Each tutorial follows one person through one job: the admin builds the grid, then the user works in it. Every step was followed word for word in a Salesforce org before it was published.</p>
          </div>
          <div class="rh-paths rh-rv-stagger">
            <a class="rh-path" href="/lightning/n/Rowhouse_Guide?c__page=tutorial-pipeline" data-page="tutorial-pipeline"><span class="rh-aud rh-both">Sales operations</span><h3>The weekly pipeline review</h3><p>Opportunities grouped by stage with a sum of amounts, overdue close dates in red and big deals in green. Fix ten deals in one sitting.</p><span class="rh-go">Start →</span></a>
            <a class="rh-path rh-u" href="/lightning/n/Rowhouse_Guide?c__page=tutorial-service" data-page="tutorial-service"><span class="rh-aud rh-both">Customer service</span><h3>The morning triage</h3><p>New cases flagged on the row, high priority in red, a Log a Call action, and the whole queue moved to Working in two clicks.</p><span class="rh-go">Start →</span></a>
            <a class="rh-path rh-t" href="/lightning/n/Rowhouse_Guide?c__page=tutorial-accounts" data-page="tutorial-accounts"><span class="rh-aud rh-both">Account management</span><h3>Key accounts, with their people and deals</h3><p>Open any account to see its contacts and opportunities in tabs, and edit them in place.</p><span class="rh-go">Start →</span></a>
            <a class="rh-path rh-u" href="/lightning/n/Rowhouse_Guide?c__page=tutorial-contacts" data-page="tutorial-contacts"><span class="rh-aud rh-both">Account management</span><h3>Contacts on an account page</h3><p>A grid of each account's contacts on its record page, with a formula column, an icon on the decision makers, a filter, and a layout each user keeps.</p><span class="rh-go">Start →</span></a>
            <a class="rh-path" href="/lightning/n/Rowhouse_Guide?c__page=tutorial-cleanup" data-page="tutorial-cleanup" style="--rh-glow:var(--rh-plum-soft);--rh-edge:var(--rh-plum-mid)"><span class="rh-aud rh-both">Data stewardship</span><h3>The contact clean-up, with an audit trail</h3><p>Export, fix in a spreadsheet, import with a preview, and keep a log of every value that changed.</p><span class="rh-go" style="color:var(--rh-plum)">Start →</span></a>
          </div>
        </section>

        <section id="here" data-anchor="here">
          <div class="rh-call rh-rv">
            <span class="rh-k">Where to find this guide</span>
            <p>This is the <b>Grid Guide</b> tab. Everyone with the Rowhouse Grid User permission set can open it: in the <b>Rowhouse</b> app, which opens on it (click the App Launcher, type <span class="rh-v rh-plain">Rowhouse</span>, and click Rowhouse under Apps), from the App Launcher's search (<span class="rh-v rh-plain">Grid Guide</span>, under Items), or from the <b>?</b> button on any grid, which opens the <a href="/lightning/n/Rowhouse_Guide?c__page=using" data-page="using">User guide</a> in a new browser tab. People who build grids also have the Grid Admin and Grid Edit Logs tabs in the app. On the Grid Admin tab, the <b>Grid Guide</b> button opens Get started, and while a grid is open the guide's part about the open tab sits beside it, with <b>Open ↗</b> for the whole of it. The pages for admins (Get started, Configure and Features) show only to the Rowhouse Grid Admin permission set.</p>
          </div>
        </section>
