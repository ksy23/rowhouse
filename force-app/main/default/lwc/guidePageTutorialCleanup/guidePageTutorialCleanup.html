            <span class="rh-aud rh-both">Data stewardship · about 25 minutes</span>
            <h1 style="margin-top:14px">The contact clean-up, with an audit trail</h1>
            <p class="rh-dek">Before every campaign, Caleb tidies the contact data: titles typed in lower case, missing lead sources, and a trade show's attendee list to add. Compliance wants to know who changed what, so this grid logs every change it makes.</p>

        <section id="goal" data-anchor="goal">
          <div class="rh-persona"><span class="rh-avatar rh-d">CT</span><div><b>Caleb Thayer, Marketing Operations</b><span>Owns contact data quality. Needs fast bulk fixes, a safe way to load lists, and a record of every change for the compliance team.</span></div></div>
          <div class="rh-sec-head"><span class="rh-sec-num">The goal</span><h2>What you will build</h2></div>
          <div class="rh-frame rh-rv">

          <div class="rh-call"><span class="rh-k">Skip the build</span><p>To go straight to using the grid, the button below builds <b>Contact Cleanup</b> as steps 1 and 2 leave it, in a few seconds. Then go on to <a href="#page" data-anchor-link="page">step 3</a>, which puts it on a page. The build steps are still the way to learn how a grid is made.</p><c-guide-build-grid tutorial="tutorial-cleanup"></c-guide-build-grid></div>

        <section id="config" data-anchor="config">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. A grid that logs</h2></div>
          <ol class="rh-tut">
            <li><b>Create the Grid Configuration.</b> In Setup, type <span class="rh-v rh-plain">Custom Metadata Types</span> in the Quick Find box and click <span class="rh-ui">Custom Metadata Types</span>. Beside <span class="rh-ui">Grid Configuration</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>, and fill in:
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Label</td><td><span class="rh-v">Contact Cleanup</span><button class="rh-copy" data-copy="Contact Cleanup" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Contact_Cleanup</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Contact</span></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">LastName</span></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Ascending</span></td></tr>
                <tr><td>Allow New Records</td><td><span class="rh-tick">✓</span> <span class="rh-note">already selected; leave it, import needs it</span></td></tr>
                <tr><td>Allow Import</td><td><span class="rh-tick">✓</span> select it</td></tr>
                <tr><td>Log Changes</td><td><span class="rh-tick">✓</span> select it</td></tr>
              </tbody></table></li>
            <li><b>Save.</b></li>
          </ol>
          <div class="rh-check rh-why">With Log Changes selected, a change that cannot be logged is not made either, so the log never has gaps. Everyone who uses this grid needs the Rowhouse Grid User permission set, which lets them write log entries but never edit or delete them.</div>
        </section>

        <section id="columns" data-anchor="columns">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. Nine columns</h2></div>
          <ol class="rh-tut">
            <li><b>Create these Grid Column records</b>, each with <span class="rh-v">Contact Cleanup</span> in <span class="rh-ui">Grid Configuration</span>. All of them are editable: an import writes only editable columns.
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref"><thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th></tr></thead><tbody>
                <tr><td>Cleanup First Name<br><span class="rh-d">Cleanup_First_Name</span></td><td class="rh-d">FirstName</td><td></td><td class="rh-d">10</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Last Name<br><span class="rh-d">Cleanup_Last_Name</span></td><td class="rh-d">LastName</td><td></td><td class="rh-d">20</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Account<br><span class="rh-d">Cleanup_Account</span></td><td class="rh-d">AccountId</td><td>Account</td><td class="rh-d">30</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Title<br><span class="rh-d">Cleanup_Title</span></td><td class="rh-d">Title</td><td></td><td class="rh-d">40</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Email<br><span class="rh-d">Cleanup_Email</span></td><td class="rh-d">Email</td><td></td><td class="rh-d">50</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Phone<br><span class="rh-d">Cleanup_Phone</span></td><td class="rh-d">Phone</td><td>Phone</td><td class="rh-d">60</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Department<br><span class="rh-d">Cleanup_Department</span></td><td class="rh-d">Department</td><td></td><td class="rh-d">70</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Lead Source<br><span class="rh-d">Cleanup_Lead_Source</span></td><td class="rh-d">LeadSource</td><td></td><td class="rh-d">80</td><td class="rh-tick">✓</td></tr>
                <tr><td>Cleanup Account Industry<br><span class="rh-d">Cleanup_Account_Industry</span></td><td class="rh-d">Account.Industry</td><td></td><td class="rh-d">90</td><td class="rh-tick">✓</td></tr>
              </tbody></table></div></li>
          </ol>
          <div class="rh-check rh-why">The ninth column is a field of each contact's account: <span class="rh-v rh-plain">Account.Industry</span>, written the way a report or a formula writes it. With no Column Label it is headed <b>Account: Industry</b>. Changing it changes the account, so an import, which changes contacts only, leaves it out.</div>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. The page</h2></div>
          <ol class="rh-tut">
            <li><b>Create an App page</b> in Lightning App Builder with the Label <span class="rh-v">Contact Cleanup</span> and <span class="rh-ui">One Region</span>.</li>
            <li><b>Add Rowhouse Grid</b> with <span class="rh-v">Contact_Cleanup</span><button class="rh-copy" data-copy="Contact_Cleanup" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.</li>
            <li><b>Save and activate</b>, adding the page to the <span class="rh-ui">Sales</span> app.</li>
          </ol>
        </section>

        <section id="tab" data-anchor="tab">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. Where the log is</h2>
          <p class="rh-sec-sub">Rowhouse comes with a tab for the log, <b>Grid Edit Logs</b>, in its own <b>Rowhouse</b> app. The Rowhouse Grid Admin permission set shows that tab; users of the grid see only the app's Grid Guide.</p></div>
          <ol class="rh-tut">
            <li><b>Find the app.</b> Click the App Launcher (the nine dots at the top left) and type <span class="rh-v rh-plain">Rowhouse</span>. The <span class="rh-ui">Rowhouse</span> app is listed under <span class="rh-ui">Apps</span>, with the Rowhouse logo.
              <div class="rh-check">Its navigation bar has three tabs: <b>Grid Guide</b>, <b>Grid Admin</b> and <b>Grid Edit Logs</b>. Nothing to set up; you come back here in step 8.</div></li>
          </ol>
          <div class="rh-call rh-w"><span class="rh-k">For your compliance team</span><p>Users read their own log entries; anyone else reads one only as your org's sharing allows. To let an auditor read everyone's, create a permission set of your own with <b>View All</b> on Grid Edit Log, and the <b>Grid Edit Logs</b> tab set to Visible, and assign it to them. Rowhouse does not ship one, so reading the whole log is always a deliberate grant. Whoever reads an entry sees its old and new values, even of a field hidden from them, so keep the readers few (<a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=features&amp;rowhouse__section=audit-readers" data-page="features" data-section="audit-readers">Features › Audit trail</a>).</p></div>
        </section>

        <section id="tidy" data-anchor="tidy">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Caleb</span><h2>5. Tidy in place</h2></div>
          <ol class="rh-tut">
            <li><b>Open the grid.</b> In the Sales app, click <span class="rh-ui">Contact Cleanup</span> (under <span class="rh-ui">More</span> if it is not in the bar).</li>
            <li><b>Find the messy titles.</b> Click the <span class="rh-ui">Title</span> header to sort by title, then look down the column for titles typed in lower case. (Sorting ignores case, so they sit among the others.)</li>
            <li><b>Fix one by typing.</b> Click a lower-case title (we use <i>vp sales</i>, Molly Fitzgerald's) and just start typing <span class="rh-v">VP, Sales</span>. Your first letter replaces the old value. Press <kbd>Enter</kbd>.</li>
            <li><b>Fix another.</b> Do the same for a second one (we change <i>head of it</i> to <span class="rh-v">Head of IT</span>).</li>
            <li><b>Fix an account's industry.</b> Edge Communications is in telecoms, but its industry says Electronics. On any of its contacts' rows (we use Rose Gonzalez's), click <span class="rh-ui">Account: Industry</span>, press <kbd>Enter</kbd>, choose <span class="rh-ui">Telecommunications</span> and press <kbd>Enter</kbd>.
              <div class="rh-check"><b>Telecommunications</b>, in yellow, on every Edge Communications row, Margaret Doucette's and Sean Forbes's too: it is the account's industry, so it changed once for all of them. The Save bar counts it as one change.</div></li>
          </ol>
        </section>

        <section id="many" data-anchor="many">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Caleb</span><h2>6. Update many at once</h2></div>
          <ol class="rh-tut">
            <li><b>Select the contacts from the partner event.</b> Select the checkboxes of the contacts with no Lead Source that came from a partner (we select Molly Fitzgerald, Ethan Hale and Walter Chandler).</li>
            <li><b>Set their lead source.</b> In the bar over the grid, click <span class="rh-ui">Update field</span>. Choose <span class="rh-ui">Lead Source</span>, choose <span class="rh-ui">Partner Referral</span>, and click <span class="rh-ui">Apply</span>.</li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> on the Save bar, then <span class="rh-ui">Clear</span> in the selection bar.
              <div class="rh-check">The changes are saved, and each changed value now has a log entry with its value before and after.</div></li>
          </ol>
        </section>

        <section id="import" data-anchor="import">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Caleb</span><h2>7. Import the trade show's attendees</h2>
          <p class="rh-sec-sub">The attendee list comes as a spreadsheet. Its headers match the grid's columns, and its rows have no record Id, so each one creates a new contact.</p></div>
          <ol class="rh-tut">
            <li><b>Get the file.</b> Download <a href={tutorialAttendeesUrl} download="event-attendees.csv">event-attendees.csv</a> (three attendees), or use your own list with the same headers.</li>
            <li><b>Start the import.</b> Click <span class="rh-ui">Import</span> above the grid (it is grayed out while you have unsaved changes) and drop the file onto the dialog, or click <span class="rh-ui">Choose file</span>.</li>
            <li><b>Check the rows.</b>
              <div class="rh-check"><i>Step 2 of 4: check the rows. Nothing has been written yet.</i> Three boxes: <b>0 updates</b>, <b>3 new records</b>, <b>0 rows with problems</b>; under <b>Columns</b>, each of the file's columns with the grid column it is imported as; and the three rows as they will be written. The Account column found each account by name.</div></li>
            <li><b>Import.</b> Click <span class="rh-ui">Import 3 rows</span>. When the dialog says "The import created 3 records.", click <span class="rh-ui">Close</span>. The grid reloads with the three new contacts. (Before closing, <span class="rh-ui">Undo import</span> would have deleted them again.)</li>
          </ol>
          <div class="rh-call rh-s"><span class="rh-k">How the Account column matched</span><p>A lookup in a file can be a record Id or a record's name. Edge Communications, GenePoint and Express Logistics and Transport each already have contacts in this grid, so the grid knew their names; a name it does not show is looked up in Salesforce. A name that matches no record, or two of them, is held back with the reason.</p></div>
        </section>

        <section id="log" data-anchor="log">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Caleb</span><h2>8. Read the log</h2></div>
          <ol class="rh-tut">
            <li><b>Open it.</b> Click the App Launcher (the nine dots), type <span class="rh-v rh-plain">Rowhouse</span>, click <span class="rh-ui">Rowhouse</span>, then the <span class="rh-ui">Grid Edit Logs</span> tab. Choose the <span class="rh-ui">All</span> list view.</li>
            <li><b>Read the columns.</b> The <span class="rh-ui">All</span> view shows each entry's <span class="rh-ui">Created Date</span>, <span class="rh-ui">Created By</span>, <span class="rh-ui">Operation</span>, <span class="rh-ui">Record Name</span>, <span class="rh-ui">Field Label</span>, <span class="rh-ui">Old Value</span>, <span class="rh-ui">New Value</span> and <span class="rh-ui">Save Id</span>.
              <div class="rh-check">Six <b>Update</b> entries from your one save, sharing one Save Id: two for the titles you fixed, with the old and new value; one for the industry, named <b>Edge Communications</b> because it is the account that changed, from Electronics to Telecommunications; and three for Lead Source. Then three <b>Create</b> entries for the imported attendees, named after them, sharing the import's Save Id.</div></li>
          </ol>
        </section>

        <section id="learned" data-anchor="learned">
          <div class="rh-sec-head"><span class="rh-sec-num">Wrap-up</span><h2>What you learned</h2></div>

            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div><h4>Import</h4><p>A preview before anything is written, lookups matched by name, every row accounted for.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></div><h4>Type to replace</h4><p>Start typing on a cell to replace its value, as in a spreadsheet.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div><h4>Fields of related records</h4><p>The account's industry beside each contact, fixed once for every contact of that account.</p></div>
