<template>
    <article class="slds-card rh-guide">
        <header class="slds-card__header rh-guide-header">
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                <img class="rh-guide-logo" src={logoUrl} alt="Rowhouse" width="177" height="32" />
                <div class="slds-col slds-m-left_medium rh-guide-title">
                    <h1 class="slds-text-heading_medium rh-guide-heading" tabindex="-1">Grid Guide</h1>
                    <p class="slds-text-body_small slds-text-color_weak">
                        How to set up Rowhouse grids, and how to work in them.
                    </p>
                </div>
            </div>
            <nav class="rh-guide-nav" aria-label="Grid Guide">
                <ul class="rh-guide-nav-list">
                    <template for:each={navItems} for:item="item">
                        <li key={item.id} class={item.className}>
                            <a
                                class="rh-guide-nav-link"
                                href={item.url}
                                aria-current={item.current}
                                data-page={item.id}
                                onclick={handleNav}
                                >{item.label}</a
                            >
                        </li>
                    </template>
                </ul>
            </nav>
        </header>

        <div class="rh-guide-body">
            <template lwc:if={showPage}>
                <c-guide-content page={page} section={section}></c-guide-content>
            </template>
            <template lwc:else>
                <div class="slds-p-around_large rh-guide-admin-only">
                    <h2 class="slds-text-heading_small">This page is for grid admins</h2>
                    <p class="slds-m-top_x-small">{adminOnlyText}</p>
                    <p class="slds-m-top_small">
                        <a href={usingUrl} data-page="using" onclick={handleNav}>Read the User guide</a>
                    </p>
                </div>
            </template>
            <!-- Back to top: floats at the bottom right once the header has scrolled away. -->
            <div class="rh-guide-top-dock">
                <span class={topClass}>
                    <lightning-button-icon icon-name="utility:arrowup" variant="border-filled" alternative-text="Back to top" title="Back to top" onclick={handleTop}></lightning-button-icon>
                </span>
            </div>
        </div>

        <footer class="slds-card__footer rh-guide-footer">
            <p>
                Rowhouse by Kugamon is free and open source, under the Mozilla Public License 2.0. It is an independent project,
                not affiliated with, endorsed by or sponsored by Salesforce, Inc. Salesforce, Lightning and AppExchange are
                trademarks of Salesforce, Inc. “Rowhouse” and the Rowhouse logo are trademarks of Kugamon LLC.
            </p>
        </footer>
    </article>
</template>
