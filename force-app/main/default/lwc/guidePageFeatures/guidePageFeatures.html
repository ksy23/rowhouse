        <section id="save" data-anchor="save">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Editing and saving</h2>
          <p class="rh-sec-sub">Edits wait in the browser as unsaved changes until the user clicks Save. Then Rowhouse checks them, saves them in batches, and reads the rows back.</p></div>

          <h3>Who can edit a cell</h3>
          <div class="rh-frame rh-rv">
            <svg class="rh-dia" viewBox="0 0 900 120" role="img" aria-labelledby="edT"><title id="edT" data-anchor="edT">Four conditions for an editable cell: the configuration allows inline edit, the column is marked Editable, the user can edit the object and the field, and the field can be edited at all.</title>
              <path class="rh-wire" d="M40,60 H860" style="stroke-width:2.5"/>
              <g class="rh-gate"><rect x="20" y="22" width="190" height="76" rx="10" fill="var(--rh-accent-soft)" stroke="var(--rh-accent-mid)"/><text x="115" y="54" text-anchor="middle" class="rh-b">Allow Inline Edit</text><text x="115" y="74" text-anchor="middle" class="rh-s">on the configuration</text></g>
              <g class="rh-gate"><rect x="240" y="22" width="190" height="76" rx="10" fill="var(--rh-sky-soft)" stroke="var(--rh-sky-mid)"/><text x="335" y="54" text-anchor="middle" class="rh-b">Editable</text><text x="335" y="74" text-anchor="middle" class="rh-s">on the column</text></g>
              <g class="rh-gate"><rect x="460" y="22" width="190" height="76" rx="10" fill="var(--rh-plum-soft)" stroke="var(--rh-plum-mid)"/><text x="555" y="54" text-anchor="middle" class="rh-b">User may edit</text><text x="555" y="74" text-anchor="middle" class="rh-s">object and field</text></g>
              <g class="rh-gate"><rect x="680" y="22" width="200" height="76" rx="10" fill="var(--rh-gold-soft)" stroke="var(--rh-gold-mid)"/><text x="780" y="54" text-anchor="middle" class="rh-b">Field can be edited</text><text x="780" y="74" text-anchor="middle" class="rh-s">not a formula or system field</text></g>
              <circle r="6" class="rh-dot rh-clay"><animateMotion dur="4.8s" repeatCount="indefinite" path="M20,60 H880"/></circle>
            </svg>
          </div>
          <p class="rh-note" style="margin-top:10px">A cell that passes all four shows a blue pencil when hovered or focused. One that does not shows a light gray lock, as a list view does.</p>
          <p id="record-types" data-anchor="record-types"><b>Picklists follow record types.</b> When the object has record types, a picklist cell offers the values the row's record type allows, as Salesforce's record page does, and a new row follows the user's default record type. <b>Update field</b> offers the values every selected row allows; a pasted or filled-down value the row's record type does not offer is refused on its cell. An import checks each value against the field, not the record type.</p>

          <h3>What Save does</h3>
          <div class="rh-split">
            <div>
              <ol class="rh-steps">
                <li><b>Checks in the browser.</b> Required fields left blank are refused in the editor with Salesforce's own words, "Complete this field.". Numbers are rounded to the field's decimal places as they are typed, so what the cell shows is exactly what is saved.</li>
                <li><b>Checks on the server.</b> The user's access to the object, each field and each record; and that every field sent is an editable column of this grid. Anything else is refused, whatever the browser sent.</li>
                <li><b>Saves in batches of 200 records,</b> each in its own transaction. Your validation rules, triggers and flows run as they do for any save. If one batch fails, for example a trigger hits a limit, only that batch fails; the others are saved.</li>
                <li><b>Reads the rows back,</b> so formula fields, rounding and anything your automation changed show their real values.</li>
              </ol>
            </div>
            <div class="rh-frame rh-rv" aria-hidden="true">
              <p class="rh-chart-title">1,000 edited records, saved</p>
              <p class="rh-chart-note" style="margin:0 0 12px;padding:0 6px">five batches of 200, one after another; one fails alone</p>
              <div class="rh-batches">
                <div class="rh-bt rh-ok" style="--rh-d:0s"><b>1–200</b><span>saved</span></div>
                <div class="rh-bt rh-ok" style="--rh-d:.7s"><b>201–400</b><span>saved</span></div>
                <div class="rh-bt rh-bad" style="--rh-d:1.4s"><b>401–600</b><span>validation rule</span></div>
                <div class="rh-bt rh-ok" style="--rh-d:2.1s"><b>601–800</b><span>saved</span></div>
                <div class="rh-bt rh-ok" style="--rh-d:2.8s"><b>801–1,000</b><span>saved</span></div>
              </div>
              <p class="rh-chart-note">The grid shows "Saving… 3 of 5 batches done." while it works.</p>
            </div>
          </div>
          <div class="rh-call rh-w"><span class="rh-k">When a save is refused</span><p>A record that fails keeps its edits, and the failing cells show Salesforce's message (for example a validation rule's error). A field the user may not change is refused alone: the record's other fields still save, the refused value stays as an unsaved edit, and the cell says why. Nothing the user typed disappears without a reason.</p></div>
          <ul class="rh-tick">
            <li><b>Up to 10,000 records</b> in one save. In a grid that logs every change, fewer when many fields change at once: each batch writes at most 5,000 log entries, so a batch takes fewer records.</li>
            <li><b>Undo history is cleared</b> by Save and by Cancel: saved values are the record's now.</li>
            <li><b>Last save wins.</b> Like a list view's inline edit, Rowhouse does not lock records while they are being edited.</li>
          </ul>

          <h3 id="new-records" data-anchor="new-records">Adding records</h3>
          <p>With <b>Allow New Records</b> selected (on the Grid Admin tab, <b>Create records with New</b>; a new grid starts with it selected), users who may create the object's records get a <b>New</b> button above the grid, where a list view has its own. In a child table, or where the grid is narrow, New is in the menu beside the search.</p>
          <ul class="rh-tick">
            <li><b>A row in the grid, when it can be one.</b> New adds a row at the top with Salesforce's defaults for a new record, and, in a child table or on a record page, the link to that record already set. The user fills in the columns they may set on a new record and clicks Save: new records are created first, then the other changes are saved. The server checks a new row as it checks any save: only the grid's editable columns are written, field-level security removes what the user may not set, and a required field left blank is refused.</li>
            <li><b>Salesforce's New form, when it cannot.</b> When Allow Inline Edit is off, the object offers the user more than one record type, or a field every new record needs is not an editable column, New opens Salesforce's own New form for the object, laid out as its page layout says. The record saved there is added at the top of the grid.</li>
            <li><b>Logged.</b> In a grid that logs its changes, each record created writes a Create entry.</li>
          </ul>

          <h3 id="related-fields" data-anchor="related-fields">Fields of a related record</h3>
          <p>A column's <b>Field API Name</b> can reach through lookups, as a report or a formula does: <span class="rh-v rh-plain">Account.Industry</span> on a Contact grid, or <span class="rh-v rh-plain">Account.Owner.Email</span>, up to five lookups away. On the Grid Admin tab, choose the lookup (<b>Account &gt;</b>) in the column's Field list, then the field in the list that opens under it. Without a Column Label the column is headed as a report heads it, <span class="rh-v rh-plain">Account: Industry</span>.</p>
          <ul class="rh-tick">
            <li><b>Sorted, searched, filtered and grouped</b> like any column, and subtotaled; a display rule or a Grid Filter can test it too.</li>
            <li><b>Edited on the related record.</b> A change shows at once on every row with the same related record and is saved to that record once, through the user's access to it and to the field. A row whose lookup is blank cannot change it, and shows a lock. Two rows that give the same record different values are both refused, and nothing is written to that field.</li>
            <li><b>Not offered:</b> a lookup that can point to more than one kind of record, such as a task's Related To or an owner that can be a queue. A new row cannot set a related record's field, and an import writes the grid's own records only, so it leaves such columns out and says so.</li>
            <li><b>Hidden stays hidden.</b> A user who cannot read every lookup on the way and the field at the end does not get the column.</li>
          </ul>
        </section>

        <section id="formula" data-anchor="formula">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Formula columns</h2>
          <p class="rh-sec-sub">A column the grid works out for each row, in the syntax of a formula field: a weighted amount, a full name, days on file. It needs no new field on the object, so there is no field to create or field-level security to set.</p></div>
          <ul class="rh-tick">
            <li><b>Add one</b> on the Grid Admin tab's Columns tab with <b>Add formula column</b>: the formula, what it returns (Text, Number, Currency, Percent, Date, Date/Time or Checkbox), its decimal places and a header. The formula is checked as you type, with Salesforce's own message when it does not work. In Setup, it is a Grid Column with Formula and Formula Type filled in instead of Field API Name.</li>
            <li><b>Worked out on the server</b> as the rows are read, so the values are the saved record's; after a save, the rows read back show the new results.</li>
            <li><b>Read only.</b> A formula column cannot be edited, sorted, grouped, filtered, searched or subtotaled. It is exported with the other columns.</li>
            <li><b>Up to 10 formulas a grid</b>, formula columns and formula display rules together, each up to 3,900 characters.</li>
            <li><b>Hidden stays hidden.</b> A user who cannot read a field the formula uses does not get the column. A formula can also read $User, $Organization and custom settings ($Setup), which no field check covers: put nothing in a grid formula its users should not see.</li>
            <li><b>A row it cannot work out</b> (a division by zero, say) shows a blank cell. Examples and the rules for lookups and percents are in the <a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=configure&amp;rowhouse__section=formulas" data-page="configure" data-section="formulas">configuration reference</a>.</li>
          </ul>
        </section>

        <section id="recordpage" data-anchor="recordpage">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>On a record page</h2>
          <p class="rh-sec-sub">With a <b>Record Page Field</b> on its configuration, a grid on a record page shows only that record's related rows, like a related list you can edit in place.</p></div>
          <ul class="rh-tick">
            <li><b>Lightning tells the grid which record</b> its page shows; there is nothing to set on the page. The configuration names the field that links the rows to it, such as AccountId for Contacts on Account pages.</li>
            <li><b>An import there</b> fills the field in on every new record, so a record added belongs to the page's record.</li>
            <li><b>On another object's page</b> the grid says it does not fit the page, instead of showing unrelated rows. On App and Home pages it shows its whole list.</li>
          </ul>
        </section>

        <section id="layout" data-anchor="layout">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Each user's layout</h2>
          <p class="rh-sec-sub">Columns, widths, frozen columns, Wrap or Clip, sort, grouping and open rows are kept for each user and grid in a private record, so the grid opens as they left it, on any computer.</p></div>
          <ul class="rh-tick">
            <li><b>Their own columns.</b> Users hide, show and reorder the columns you set up, nothing more: from <b>Choose columns</b> beside Refresh, <b>Hide column</b> in a column's menu, or by dragging a header. Select <b>Always shown</b> on a column (Always Shown in Setup) to keep it on screen; it can still be moved. Hidden columns are still read: search, sorts, filters and grouping on them still work, and Export writes what the user sees.</li>
            <li><b>Their own frozen columns.</b> Frozen Columns sets how many a grid starts with; a user can freeze up to five from a column's menu (<b>Freeze up to this column</b>) or unfreeze them all.</li>
            <li><b>Child tables too.</b> A tab of related records keeps each user's layout for that tab, the same under every row.</li>
            <li><b>Grid User Layout</b> records are private: each belongs to its user, who alone can read it. Rowhouse Grid User gives access to one's own.</li>
            <li><b>Kept quietly</b>, two seconds after the last change. If it cannot be kept, the grid works as before and says nothing (people with Rowhouse Grid Diagnostics see why in the browser console).</li>
            <li><b>Reset layout</b> beside Refresh deletes the record, and the grid goes back to the admin's settings. Filters are never kept.</li>
          </ul>
        </section>

        <section id="numbers" data-anchor="numbers">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Row numbers</h2>
          <p class="rh-sec-sub">Rows are numbered down the grid's left edge, 1, 2, 3 in the order shown, as a list view's are. They are on unless you deselect <b>Show row numbers</b> on the Grid tab (Show Row Numbers in Setup), for example for a narrow grid on a record page.</p></div>
          <ul class="rh-tick">
            <li><b>Places, not records.</b> A number says where a row sits in the list, so a new sort, a search or a filter numbers the rows from 1 again.</li>
            <li><b>Grouped,</b> the numbers run straight through the groups. A collapsed group keeps its rows' numbers, so the rows after it keep theirs.</li>
            <li><b>A row with errors</b> after a save shows its error icon just before its number, as a list view does; the icon's text names the row by its number.</li>
            <li><b>Child tables</b> number their own rows from 1, by their own grid's setting. Cards, on a narrow screen, have no numbers.</li>
          </ul>
        </section>

        <section id="group" data-anchor="group">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Grouping and subtotals</h2>
          <p class="rh-sec-sub">A grid can open grouped by up to three columns, with a count and subtotals on every group and a Total row underneath. Users can change the grouping from a groupable column's menu, and the grid keeps their choice in their layout.</p></div>
          <figure class="rh-rv">
              <div class="rh-screen"><div class="rh-stage"><div class="rh-card-m rh-grp-demo">
                <div class="rh-m-chips" style="padding-top:12px">Grouped by <span class="rh-m-chip">Stage <span class="rh-x">✕</span></span> <span class="rh-m-link">Stop grouping</span></div>

            </figure>
          <div class="rh-split" style="margin-top:20px">
            <div>
              <h4 class="rh-mt0">Setting it up</h4>
              <ul class="rh-tick">
                <li><b>Group Level</b> 1, 2 or 3 on a column opens the grid grouped by it; 1 is the outermost.</li>
                <li><b>Group Date Unit</b> for a date column: day, week, month, quarter, year, fiscal quarter or fiscal year (month if blank). Weeks start on the user's first day of the week; fiscal periods follow your org's fiscal year, custom fiscal years included.</li>
                <li><b>Allow Grouping</b> (<i>Users can group</i> on the Grid Admin tab) offers Group by on a text, email, phone or web address column, which the grid does not offer it on by itself.</li>
                <li><b>Subtotal</b> by the column's type: Sum and Average for numbers, currency and percent; Min and Max for those and dates; Count for most fields (see the <a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=configure&amp;rowhouse__section=grouping" data-page="configure" data-section="grouping">table</a>).</li>
              </ul>
            </div>
            <div>
              <h4 class="rh-mt0">What users get</h4>
              <ul class="rh-tick">
                <li><b>Group by</b> any picklist, checkbox, lookup, owner, date or date/time column from its menu, or by dragging its header onto the Group column; text columns only when you gave them a Group Level or Allow Grouping.</li>
                <li><b>Counts and subtotals of every matching record</b>, not just the rows loaded, worked out on the server. An unsaved edit already shows in the subtotals, marked yellow; the row moves to another group only after Save.</li>
                <li><b>Order and share:</b> the Group column's menu orders the groups by name, by record count or by a subtotal, and can show each group's percent of the total.</li>
                <li><b>A Total row</b> whenever a column has a Subtotal, grouped or not.</li>
              </ul>
              <p class="rh-note">Up to 5,000 groups. Beyond that, group a date by month or year, or search to narrow the list.</p>
            </div>
          </div>
        </section>

        <section id="currency" data-anchor="currency">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>More than one currency</h2>
          <p class="rh-sec-sub">In an org that uses more than one currency, each record has a currency of its own, and the grid shows its amounts the way Salesforce does. Nothing needs setting up.</p></div>
          <ul class="rh-tick">
            <li><b>Each amount in its record's currency,</b> by its code: <span class="rh-v rh-plain">USD 78,250.00</span> on one row, <span class="rh-v rh-plain">CAD 1,000.00</span> on the next. A field from a parent record, such as the account's Annual Revenue, is in the parent's currency. A new row is in your own currency until it is saved, as Salesforce creates it.</li>
            <li><b>The Total row, subtotals and child totals</b> are in your org's corporate currency, each record's amount converted at your org's exchange rates, and say so: <span class="rh-v rh-plain">Sum USD 80,113.86</span>, read out as "every amount converted to USD, the corporate currency".</li>
            <li><b>An unsaved change in another currency</b> is not added into a subtotal until it is saved, because the grid does not have the exchange rates; the figure keeps its saved value and is marked as changed. A change in the corporate currency shows straight away.</li>
            <li><b>Sorting by an amount</b> orders the rows by the amount converted to the corporate currency, as Salesforce sorts them, so the grid asks Salesforce for the rows in that order.</li>
            <li><b>Filters and display rules</b> compare the number as it is stored, in each record's own currency: <span class="rh-v rh-plain">Greater than 50000</span> matches 50,001 dollars and 50,001 yen alike.</li>
          </ul>
        </section>

        <section id="child" data-anchor="child">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Child tables: related records under each row</h2>
          <p class="rh-sec-sub">A row opens a panel of tabs, one per Grid Child Table, each a full grid of related records. Accounts can show their Contacts and Opportunities; those Opportunities can show their own children.</p></div>
          <figure class="rh-rv">
            <div class="rh-screen"><div class="rh-stage"><div class="rh-card-m">

          <ul class="rh-tick">
            <li><b>Counts first.</b> Each row's toggle shows how many related records it has, and a row with none has no toggle. Each tab shows its count, and the panel opens on the first tab with records.</li>
            <li><b>Security per tab.</b> A tab appears only for users who can read the child object and its relationship field.</li>
            <li><b>Import into a tab</b> fills in the parent on every record it creates.</li>
            <li><b>Open rows</b> are kept in each user's layout and open again next time. The button in the toggle column's header opens every row at once (up to 200) and closes them again.</li>
            <li><b>Height:</b> a Grid Child Table's Height is the most its panel grows to; leave it empty to fit the records.</li>
            <li><b>Totals on the parent row.</b> A Grid Column can show a child table's count, sum, average, lowest or highest value on each row, such as each account's number of contacts. Read only; up to five per grid.</li>
          </ul>
        </section>

        <section id="actions" data-anchor="actions">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Actions: flows, Apex and quick actions</h2>
          <p class="rh-sec-sub">Each Grid Action adds an item to every row's menu, a button to the bar that appears when rows are selected, or both. Use them for the work an edit cannot do: escalate, send, log a call, recalculate.</p></div>
          <div class="rh-tiles rh-rv-stagger">
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg></div><h4>Screen flow</h4><p>Opens on a page of its own, then comes back to the grid. One row: its Id in <code>recordId</code>. Selected rows: a text collection named <code>ids</code>, as list views pass them.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div><h4>Autolaunched flow</h4><p>Runs on the server, one interview per record, with the record's Id in <code>recordId</code>.</p></div>
            <div class="rh-tile rh-plum"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></div><h4>Invocable Apex</h4><p>Runs on the server with each record's Id. If one record throws, the others are run again one by one, while Salesforce's limits leave room, so they can still succeed; a record not run again keeps the error.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h4>Quick action</h4><p>A global action such as LogACall, or one of the grid's object as Object.ActionName. It must suit the grid's object.</p></div>
          </div>
          <div class="rh-split" style="margin-top:22px">
            <ul class="rh-tick">
              <li id="row-menu" data-anchor="row-menu"><b>Before your actions</b>, every row's menu has Edit, Delete and Change Owner, as a list view's does. <b>Edit</b> and <b>Change Owner</b> are there in a grid that edits cells (<b>Allow Inline Edit</b>), for users who may edit the object; Change Owner only on an object with owners. <b>Delete</b> is there where <b>Allow Mass Delete</b> is on, for users who may delete. Edit opens Salesforce's own edit form; Change Owner saves at once, and a grid that logs logs it.</li>
              <li><b>Asking first.</b> An action on selected rows always asks, naming the first five rows. An action on one row runs at once unless you wrote a Confirmation, or the row has unsaved changes. A screen flow never asks: its own page opens, unless the grid has unsaved changes, which you save or cancel first.</li>
              <li><b>Afterwards</b> the rows are read again, with counts and subtotals. A record the action could not run on shows the reason on its row; a message says how many succeeded and failed. The selection stays, ready for the next action.</li>
            </ul>
            <ul class="rh-tick">
              <li><b>Buttons, or one menu.</b> With up to three selection actions, each is a button; with four or more, they are all in one Actions menu.</li>
              <li><b>Limit who can run it</b> with a Required Permission. Rowhouse checks that the user can read the object and the records; it does not check access to the flow or class itself.</li>
              <li><b>Large selections</b> run 50 records per call, one call after another.</li>
            </ul>
          </div>
        </section>

        <section id="import" data-anchor="import">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Import from CSV or Excel</h2>
          <p class="rh-sec-sub">Select <b>Allow Import</b> (<i>Import from a CSV or Excel file</i> on the Grid Admin tab) and users get an Import button. A row with a record Id updates that record; a row without one creates a new record, so import also needs <b>Allow New Records</b> (<i>Create records with New</i>): with it off, the grid offers no import. Nothing is written until the user has seen a preview.</p></div>
          <div class="rh-stepper rh-rv" aria-hidden="true">
            <div class="rh-sp" style="--rh-d:0s"><b>1</b><span>Choose a file</span><small>CSV (or tab-separated .txt or .tsv) or .xlsx, up to 20 MB and 10,000 rows</small></div>
            <div class="rh-sp" style="--rh-d:1s"><b>2</b><span>Check the rows</span><small>updates, new records and problems, row by row</small></div>
            <div class="rh-sp" style="--rh-d:2s"><b>3</b><span>Import</span><small>in batches of 200, with a progress bar</small></div>
            <div class="rh-sp" style="--rh-d:3s"><b>4</b><span>Done</span><small>updated, created, and why any row failed</small></div>
          </div>
          <div class="rh-split" style="margin-top:20px">
            <ul class="rh-tick">
              <li><b>Columns are matched by header</b>: a column's label or field API name, in any case. <span class="rh-v rh-plain">Id</span> or <span class="rh-v rh-plain">Record ID</span> is the record Id. The grid's Export puts the Id first, so an exported file comes back in as updates. Any file column can be mapped by hand to another column, to the record Id, or left out.</li>
              <li><b>Only editable columns are written.</b> Headers that match nothing, read-only columns and repeated columns are shown as not imported, with the reason.</li>
              <li><b>Matching by an External Id.</b> With a column of an External Id field in the file, records can be matched by it instead of the record Id: each row updates the record with that value, or creates one.</li>
              <li><b>An empty cell clears the field; a missing column leaves it alone.</b> To leave a field as it is, leave its column out of the file.</li>
            </ul>
            <ul class="rh-tick">
              <li><b>Rows with a problem are held back</b>, not a reason to stop: a value that cannot be read, a required column left empty, an Id of another object or repeated. The user can download them to fix and import again.</li>
              <li><b>Excel:</b> a workbook with several sheets offers a choice of sheet, starting with the first one whose headers name a column of the grid. An old .xls file is refused with a message saying how to save it as .xlsx or CSV. A workbook too big to read safely in the browser, one whose sheet unpacks to more than 100 MB, is refused with <span class="rh-v rh-plain">This workbook is too large to read. Split it, or import fewer columns.</span></li>
              <li><b>Undo import</b>, before the dialog closes, puts the records it updated back as they were and deletes the records it created.</li>
              <li><b>Import waits for unsaved edits</b> to be saved or canceled first.</li>
            </ul>
          </div>
        </section>

        <section id="mass" data-anchor="mass">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Update and delete many records</h2></div>
          <div class="rh-split">
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></div><h4>Update field</h4><p>With rows selected, <b>Update field</b> sets one editable column to one value on all of them. The dialog says what the rows hold now ("Currently: New (5), Working (2)"). The changes become unsaved edits, so the user sees every one before clicking Save, and one Undo takes them all back. Needs at least one editable column.</p></div>
            <div class="rh-tile rh-rose"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h4>Delete</h4><p>Off unless you select <b>Allow Mass Delete</b> (<i>Delete selected rows</i> on the Grid Admin tab), and only for users who may delete the object. The dialog names the rows, says they go to the Recycle Bin, and starts on Cancel. Deletes run in batches of 200; a record that cannot be deleted stays, with the reason on its row. Afterwards <b>Undo</b>, under the grid's header, puts the deleted records back.</p></div>
          </div>
          <p class="rh-note" style="margin-top:12px">One selection holds up to 10,000 rows. Select all takes the first 10,000 in the current order, including rows in collapsed groups. When more records match than are loaded, and no more than 50,000 do, <b>Select all N matching records</b> lets Delete delete every record the search and filters match. While it is chosen, Update field and actions wait: they work on loaded rows. Salesforce's Recycle Bin holds a limited number of records, and once it is full it removes the oldest that have been there two hours or more: a delete that big can push out what others deleted earlier.</p>
        </section>

        <section id="audit" data-anchor="audit">
          <div class="rh-sec-head"><span class="rh-sec-num">Feature</span><h2>Audit trail</h2>
          <p class="rh-sec-sub">Select <b>Log Changes</b> on a Grid Configuration (<i>Log every change in Grid Edit Log</i> on the Grid Admin tab) and every change that grid makes is written to <b>Grid Edit Log</b>: one entry per field changed, per record created, deleted or put back by Undo, and per record an action ran on.</p></div>
          <div class="rh-split">
            <figure class="rh-mt0 rh-rv">
              <div class="rh-logstack" aria-hidden="true">
                <div class="rh-le" style="--rh-d:0s"><span class="rh-op rh-u">Update</span><b>Stage</b> Proposal/Price Quote → Negotiation/Review<small>LOG-0000412 · Abigail Whitcomb · today 9:14</small></div>
                <div class="rh-le" style="--rh-d:.5s"><span class="rh-op rh-u">Update</span><b>Amount</b> 180000 → 250000<small>LOG-0000413 · same Save Id</small></div>
                <div class="rh-le" style="--rh-d:1s"><span class="rh-op rh-c">Create</span><b>Contact</b> Margaret Doucette<small>LOG-0000414 · import</small></div>
                <div class="rh-le" style="--rh-d:1.5s"><span class="rh-op rh-a">Action</span><b>Log a call</b> on 00001042<small>LOG-0000415</small></div>
                <div class="rh-le" style="--rh-d:2s"><span class="rh-op rh-d">Delete</span><b>Contact</b> Margret Doucette, a duplicate<small>LOG-0000416</small></div>
              </div>
              <figcaption>Entries written together share a Save Id, so one save's changes can be read as one.</figcaption>
            </figure>
            <div>
              <ul class="rh-tick">
                <li><b>Who and when</b> are the entry's Created By and Created Date, which Salesforce sets, not the grid.</li>
                <li><b>Values as text</b>: dates as 2026-09-30, date/times in UTC, numbers in full, lookups as record Ids. An encrypted field, with Shield Platform Encryption or a Classic encrypted text field, is logged without its values, marked Values Not Recorded; the Grid Admin tab says so when such a column can be edited in a grid that logs.</li>
                <li><b>All or nothing.</b> If an entry cannot be written, the change is not made either, and the user is told why. A grid that logs never changes something silently.</li>
                <li><b>Users read their own entries</b> and can never edit or delete one. The log is private, so anyone else reads an entry only as your org's sharing allows (a manager above its author in the role hierarchy, for example). To let an auditor read everyone's, give them View All on Grid Edit Log, and the Grid Edit Logs tab, in a permission set of your own.</li>
                <li id="audit-readers" data-anchor="audit-readers"><b>Whoever reads an entry reads its values</b>, old and new, even of a field hidden from them by field-level security: the log holds its own copy. So keep the readers few. In <span class="rh-ui">Sharing Settings</span>, edit the organization-wide defaults and clear <span class="rh-ui">Grant Access Using Hierarchies</span> for Grid Edit Log, so managers do not read their team's entries; give View All on it only to auditors; and install Rowhouse for admins only, then give people the Rowhouse permission sets, rather than for all users.</li>
                <li><b>Change Owner</b>, in a row's menu, is logged as an Update of Owner, with the old and new owner's record Ids.</li>
                <li><b>Not logged:</b> screen flows (they run in the browser), a row's <b>Edit</b> (it saves in Salesforce's own edit form, as the record's page does), and changes made outside the grid.</li>
              </ul>
            </div>
          </div>
          <h3>Reading the log</h3>
          <p>The log has its own tab, <b>Grid Edit Logs</b>, in the <b>Rowhouse</b> app, which the Rowhouse Grid Admin permission set shows. Users of grids never see it.</p>
          <ol class="rh-tut">
            <li><b>Open it.</b> Click the App Launcher, type <span class="rh-v rh-plain">Rowhouse</span>, click <span class="rh-ui">Rowhouse</span>, then the <span class="rh-ui">Grid Edit Logs</span> tab. Choose the <span class="rh-ui">All</span> list view.</li>
            <li><b>Read it.</b> The <span class="rh-ui">All</span> view shows when, who, the operation, the record, the field, the old and new value and the Save Id. Add other fields with the list view's <span class="rh-ui">Select Fields to Display</span>.</li>
          </ol>
          <h3 id="audit-retention" data-anchor="audit-retention">How long entries are kept</h3>
          <p>Each entry takes about 2 KB of data storage. Rowhouse keeps every entry until you choose a period; then a clean-up each night deletes the entries older than it.</p>
          <ol class="rh-tut">
            <li><b>Open the Settings page.</b> In the <b>Rowhouse</b> app, click <span class="rh-ui">Grid Admin</span>, then <span class="rh-ui">Settings</span> in its header. Its <b>Grid Edit Log Retention</b> section has three cards; the first says <i>Forever</i>: <i>Entries are kept forever. Nothing deletes them.</i></li>
            <li><b>Choose a period.</b> In <span class="rh-ui">Keep entries for</span>, choose <span class="rh-v rh-plain">90 days</span>, <span class="rh-v rh-plain">1 year</span>, <span class="rh-v rh-plain">2 years</span> or <span class="rh-v rh-plain">7 years</span>.</li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>. After a few seconds a message says <i>The edit log keeps its entries for 1 year.</i> The first card then says <i>1 year</i>. The second gives the time of the next clean-up, 2:00 AM where you are, and under it the date and your name: <i>The nightly clean-up, next on</i> the date<i>, runs as</i> you. The third counts the grids that log every change and names them.</li>
          </ol>
          <ul class="rh-tick">
            <li><b>Deleted for good.</b> The clean-up empties what it deletes from the Recycle Bin, so old entries cannot be restored. After a night that removed any, the section shows <i>Last clean-up</i> under the cards, with when and how many; the same note is an entry of its own in the log, operation <b>Cleanup</b>.</li>
            <li><b>It runs as you.</b> At 2 AM in your time zone, with your access, so it deletes only the entries you may delete. A System Administrator may delete them all. Saving a period needs Customize Application and the right to delete Grid Edit Log entries; without that the section says to ask a System Administrator. When the clean-up runs as another admin, the second card says so, and <b>Save</b> moves it to you, for when that person leaves. If the admin it runs as no longer has Rowhouse Grid Admin, it deletes nothing, and its note in the log says <i>Clean-up skipped</i> and why.</li>
            <li><b>To stop it,</b> choose <span class="rh-v rh-plain">Forever</span> and click <span class="rh-ui">Save</span>. Nothing is deleted from then on.</li>
            <li><b>Updates still deploy.</b> While the clean-up is on, a newer Rowhouse deploys as usual. Salesforce refuses to change a class while a job is scheduled for it, and every class that class names; Rowhouse keeps that class to a few lines that name no other and never change.</li>
          </ul>
        </section>

        <section id="settings" data-anchor="settings">

          <p class="rh-sec-sub">For the people who build grids: the <b>Grid Admin</b> tab lists every grid and builds new ones, and a gear on each grid opens that grid's settings where it is.</p></div>

          <div class="rh-split">
            <div>
              <h4 class="rh-mt0">The Grid Admin tab</h4>
              <ul class="rh-tick">
                <li>A tab of the <b>Rowhouse</b> app, which the App Launcher shows with the Rowhouse logo. Its header has two pages, <b>Grids</b> and <b>Settings</b>.</li>
                <li><b>Grids</b> opens with <i>Your grids</i>, <b>New grid</b>, <b>Import grid</b>, <b>Export</b> and cards that sum up the org: how many grids and objects, how many grids log every change or have child tables, and how long the edit log keeps its entries. Under them, every grid in use, with its Grid Title, API name, object and number of columns; search it by title or API name; <b>Export</b>, beside Import grid, saves the grids it shows to a file (<a href="#admin-transfer" data-anchor-link="admin-transfer">below</a>). It opens sorted by Grid Title, A to Z: click another heading to sort by that column, and click it again to sort the other way.</li>
                <li>The side navigation on the left of the Grids page chooses what the list shows, each with how many: <b>Available grids</b>, the grids in use; <b>Archived grids</b>; and, under <b>By object</b>, the grids in use of one object.</li>
                <li>Click a grid's title to change it. The grid's name heads the page, with its object and API name and <b>Close</b> and <b>Save</b>; <b>Grid Admin</b> or <b>Grids</b> above the name goes back, asking first if something is unsaved.</li>
                <li>The <b>▾</b> at the end of each row is the grid's menu: <b>Edit</b>, as its title does; <b>Clone</b>; <b>Export</b>, to a file; and <b>Archive</b>, which takes the grid out of use without deleting it (<a href="#admin-rows" data-anchor-link="admin-rows">below</a>).</li>
                <li>Tabs for the grid itself, its columns (and formula columns), display rules, filters, actions and child tables, each with its count and an <b>Add</b> button under its table, and the Grid Guide's part about the open tab beside them. Formulas are checked as you type, with Salesforce's own message when one does not work.</li>
                <li><b>Settings</b> holds what is set for Rowhouse as a whole: how long the edit log keeps its entries (<a href="#audit-retention" data-anchor-link="audit-retention">above</a>).</li>
              </ul>
            </div>
            <div>
              <h4 class="rh-mt0">The gear on a grid</h4>
              <ul class="rh-tick">
                <li>Beside Refresh, for Rowhouse Grid Admin holders only. In a narrow space, or in a child table, it is <b>Grid settings</b> in the menu beside the search.</li>
                <li>It opens the same editor in a dialog. Not while the grid has unsaved changes: save or cancel them first. Save the settings, and the grid loads again with them.</li>
              </ul>
            </div>
          </div>
          <div class="rh-call" style="margin-top:18px"><span class="rh-k">What is checked</span><p>The tab and the gear are hidden from everyone without Rowhouse Grid Admin, and the server checks the permission again on every request. Saving also needs Customize Application, as saving Custom Metadata in Setup does; so do Clone, Archive, Restore and Import grid, which are grayed out without it. Export needs only Rowhouse Grid Admin. Every field and setting is described in the <a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=configure&amp;rowhouse__section=admin" data-page="configure" data-section="admin">configuration reference</a>.</p></div>

          <h3 id="admin-rows" data-anchor="admin-rows" style="margin-top:26px">Clone, archive and delete a grid</h3>
          <p>Each is in the grid's menu, the <span class="rh-ui">▾</span> at the end of its row on the Grid Admin tab's <span class="rh-ui">Grids</span> page. Clone, Archive and Restore are saved like any change to a grid, in a few seconds; while they are, a spinner takes the dialog's place (<i>Archiving. This takes a few seconds.</i>).</p>
          <ol class="rh-steps">
            <li><b>Clone it.</b> Click <span class="rh-ui">▾</span>, then <span class="rh-ui">Clone</span>. The dialog suggests the title <i>Copy of</i> the grid's, and an API name made from it, numbered if another grid has it; change either. Click <span class="rh-ui">Clone</span>. After a few seconds <i>Grid cloned</i>, and the copy opens to be changed: the same object, with copies of its columns, display rules, filters, actions and child tables. The grid you cloned stays as it is.</li>
            <li><b>Archive it.</b> Click <span class="rh-ui">▾</span>, then <span class="rh-ui">Archive</span>. The dialog says what archiving does, and which grids show this one as a child table. Click <span class="rh-ui">Archive</span>. After a few seconds <i>Grid archived</i>, and it leaves the list and the cards.</li>
            <li><b>What archiving does.</b> Nothing is deleted: its columns, rules and the rest stay as they are. A page that shows it says <i>The grid … is archived. A Rowhouse admin can restore it on the Grid Admin tab.</i> Another grid's child table that shows it is hidden; a child total column built on that child table still totals.</li>
            <li><b>Find it again.</b> In the side navigation on the left, click <span class="rh-ui">Archived grids</span>, with how many there are. Archived grids are listed there, each with <span class="rh-ui">Restore</span> and <span class="rh-ui">Delete in Setup</span> in its menu.</li>
            <li><b>Restore it.</b> Click <span class="rh-ui">▾</span>, then <span class="rh-ui">Restore</span>, then <span class="rh-ui">Restore</span> in the dialog. It is back under <span class="rh-ui">Available grids</span>, and pages that show it work again.</li>
            <li><b>Delete it for good.</b> Rowhouse cannot delete a grid: only Setup can delete Custom Metadata records. Click <span class="rh-ui">▾</span>, then <span class="rh-ui">Delete in Setup</span>. The dialog lists the grid's records in the order to delete them: other grids' child tables that show it, its columns, display rules, filters, actions and child tables, then the grid itself, last. Each opens its page in Setup in a new browser tab; click <span class="rh-ui">Delete</span> there, then <span class="rh-ui">OK</span>. Keep to the order: Salesforce will not delete the grid while any of its records still point at it. Once deleted, they cannot be restored here.</li>
          </ol>
          <h3 id="admin-transfer" data-anchor="admin-transfer" style="margin-top:26px">Export and import grids</h3>
          <p>A grid file sets up another org in a minute: a demo or trial org, a sandbox or org a change set cannot reach, or a colleague's org. It is a JSON file of grids, each with its settings, columns, display rules, filters, actions and child tables, by API name. It holds no records, no one's saved layout and no Lightning page.</p>
          <div class="rh-stepper rh-rv" aria-hidden="true">
            <div class="rh-sp" style="--rh-d:0s"><b>1</b><span>Export</span><small>one grid, or the grids the list shows, with the grids they show as child tables</small></div>
            <div class="rh-sp" style="--rh-d:1s"><b>2</b><span>Choose the file</span><small>on the Grid Admin tab of this org or another</small></div>
            <div class="rh-sp" style="--rh-d:2s"><b>3</b><span>Check</span><small>a badge on each grid: New, Copy, Left as it is or Can't import</small></div>
            <div class="rh-sp" style="--rh-d:3s"><b>4</b><span>Import</span><small>one grid after another, child grids first</small></div>
          </div>
          <ol class="rh-steps">
            <li><b>Export one grid.</b> Click <span class="rh-ui">▾</span> at the end of its row, then <span class="rh-ui">Export</span>. The browser saves a file named after the grid's API name, such as <span class="rh-v rh-plain">Key_Accounts.rowhouse.json</span>, with every grid it shows as a child table, so the file is complete. <i>Grids exported</i> says how many it holds.</li>
            <li><b>Export several.</b> Search, or choose an object in the side navigation, until the list shows the grids you want, then click <span class="rh-ui">Export 8 grids</span>, beside <span class="rh-ui">Import grid</span>; the number is how many the list shows. The file is named <span class="rh-v rh-plain">rowhouse-grids-</span> and the date. One file holds up to 50 grids, child grids included.</li>
            <li><b>Import.</b> In the org that is to have the grids, on the Grid Admin tab, click <span class="rh-ui">Import grid</span> beside <span class="rh-ui">New grid</span>. Click <span class="rh-ui">Choose file</span>, or drop the file on the dialog. Nothing is saved yet: the dialog shows the file with how many grids it holds and what happens to them, then lists every grid with a badge for what importing does here. A grid this org does not have is <i>New</i>, and is imported under its API name.</li>
            <li><b>A grid this org already has is never changed.</b> Under <span class="rh-ui">Grids this org already has</span>, <span class="rh-ui">Leave them as they are</span> is chosen: such a grid is <i>Left as it is</i>, and a grid in the file that shows it as a child table shows this org's. Choose <span class="rh-ui">Import them as copies</span> instead, and each is a <i>Copy</i>: imported as <i>Copy of</i> its title, under a free API name, and the file's other grids show the copies.</li>
            <li><b>Read what it says about each grid.</b> Grids that <i>Can't import</i> come first, each with why: a field or an object this org does not have, or a grid it shows as a child table that can't be imported. Create the field, or change the file, and import it again. <i>Imported with these warnings</i> lists what a grid would leave out here, as the Grid Admin tab's warnings do.</li>
            <li><b>Click <span class="rh-ui">Import 3 grids</span></b>; the number is how many can be imported. They are saved one after the other, child grids first, a few seconds each, while a spinner says which one it is on (<i>Importing … (2 of 3)</i>); keep the window open until it is done. <i>Grids imported</i> names them, and they are under <span class="rh-ui">Available grids</span>. If one cannot be saved, the dialog says why, and the grids before it stay imported.</li>
          </ol>
          <ul class="rh-tick">
            <li><b>Then put each grid on a page.</b> A file holds no Lightning page: add the Rowhouse Grid component to a page and enter the grid's API name. An action needs its flow, Apex class or quick action in the org, as it does when you add it by hand.</li>
            <li><b>Checked like a save.</b> Every grid in a file is checked as a grid saved on this tab is, so a file can do nothing you could not do by building the grid here. A file's filter values are in it as you typed them: share it as you would the grid's settings.</li>
            <li><b>Between a sandbox and its production org,</b> a change set or a deployment works too, and keeps the grids on your release path (<a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=start&amp;rowhouse__section=move" data-page="start" data-section="move">Moving grids between orgs</a>).</li>
          </ul>
        </section>

        <section id="security" data-anchor="security">
          <div class="rh-sec-head"><span class="rh-sec-num">Running it</span><h2>Security</h2>
          <p class="rh-sec-sub">Rowhouse never widens access. Every read and every write runs as the user, through the same checks as a Salesforce page, and the server decides; nothing the browser sends is trusted.</p></div>
          <div class="rh-frame rh-rv">
            <svg class="rh-dia" viewBox="0 0 900 170" role="img" aria-labelledby="secT secD">
              <title id="secT" data-anchor="secT">The checks every request passes</title>
              <desc id="secD" data-anchor="secD">A request from the grid passes six checks before it reaches your data: the Rowhouse Grid User permission set; the user's access to the object; field-level security; sharing; the grid's own configuration, such as editable columns and whether import or delete is allowed, read on the server; and finally your own validation rules, triggers and flows.</desc>
              <path class="rh-wire" d="M10,85 H890" style="stroke-width:2.5"/>
              <g class="rh-gate"><rect x="10" y="40" width="130" height="90" rx="10" fill="var(--rh-accent-soft)" stroke="var(--rh-accent-mid)"/><text x="75" y="76" text-anchor="middle" class="rh-b">Rowhouse</text><text x="75" y="94" text-anchor="middle" class="rh-b">User</text><text x="75" y="114" text-anchor="middle" class="rh-s">permission set</text></g>
              <g class="rh-gate"><rect x="160" y="40" width="130" height="90" rx="10" fill="var(--rh-sky-soft)" stroke="var(--rh-sky-mid)"/><text x="225" y="76" text-anchor="middle" class="rh-b">Object</text><text x="225" y="94" text-anchor="middle" class="rh-b">access</text><text x="225" y="114" text-anchor="middle" class="rh-s">read, edit, create, delete</text></g>
              <g class="rh-gate"><rect x="310" y="40" width="130" height="90" rx="10" fill="var(--rh-plum-soft)" stroke="var(--rh-plum-mid)"/><text x="375" y="76" text-anchor="middle" class="rh-b">Field-level</text><text x="375" y="94" text-anchor="middle" class="rh-b">security</text><text x="375" y="114" text-anchor="middle" class="rh-s">hidden columns removed</text></g>
              <g class="rh-gate"><rect x="460" y="40" width="130" height="90" rx="10" fill="var(--rh-gold-soft)" stroke="var(--rh-gold-mid)"/><text x="525" y="76" text-anchor="middle" class="rh-b">Sharing</text><text x="525" y="94" text-anchor="middle" class="rh-s">only records the</text><text x="525" y="110" text-anchor="middle" class="rh-s">user can see</text></g>
              <g class="rh-gate"><rect x="610" y="40" width="130" height="90" rx="10" fill="var(--rh-rose-soft)" stroke="var(--rh-rose-mid)"/><text x="675" y="76" text-anchor="middle" class="rh-b">The grid's</text><text x="675" y="94" text-anchor="middle" class="rh-b">own rules</text><text x="675" y="114" text-anchor="middle" class="rh-s">editable columns only</text></g>
              <rect x="760" y="40" width="130" height="90" rx="10" fill="var(--rh-teal-soft)" stroke="var(--rh-teal-mid)"/><text x="825" y="76" text-anchor="middle" class="rh-b">Your</text><text x="825" y="94" text-anchor="middle" class="rh-b">automation</text><text x="825" y="114" text-anchor="middle" class="rh-s">rules, triggers, flows</text>
              <circle r="6" class="rh-dot rh-clay"><animateMotion dur="4.8s" repeatCount="indefinite" path="M10,85 H890"/></circle>
            </svg>
          </div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Hidden stays hidden.</b> A column the user cannot read is not shown, exported or sent to the browser. A format rule on such a field is dropped for them, since its color would reveal the value, and so is a formula column or rule that reads a field they cannot.</li>
            <li><b>The grid's settings are read on the server</b> on every request: whether this grid allows editing, import, delete or a given action, and which columns are editable. A changed or forged request gains nothing.</li>
            <li><b>Filters narrow, they do not protect.</b> A grid's filters choose the records it shows; sharing decides which records a user may reach. To keep records from someone, use sharing (<a href="#filters" data-anchor-link="filters">above</a>).</li>
            <li><b>Nothing leaves Salesforce.</b> Rowhouse makes no callouts and loads no outside code; diagnostics stay in the user's own browser and never include record data.</li>
            <li id="encrypted" data-anchor="encrypted"><b>Encrypted fields.</b> A field encrypted with Shield Platform Encryption, or a Classic encrypted text field, is shown and edited as usual, but Salesforce cannot sort, filter, group, search or total it, so the grid does not offer those on its column, a search leaves it out, and a Default Sort Field on it is set aside. Diagnostics name such a column. A Grid Filter on an encrypted field stops the grid and says why, since leaving it out would show records the filter was meant to hide.</li>
          </ul>
        </section>

        <section id="diag" data-anchor="diag">
          <div class="rh-sec-head"><span class="rh-sec-num">Running it</span><h2>Diagnostics</h2>
          <p class="rh-sec-sub">Assign <b>Rowhouse Grid Diagnostics</b> to yourself, or to a user reporting a problem, for as long as you need it.</p></div>
          <div class="rh-split">
            <div>
              <h4 class="rh-mt0">What it shows</h4>
              <ul class="rh-tick">
                <li><b>Configuration warnings</b> above each grid: every setting that was skipped, and why.</li>
                <li><b>One line in the browser console</b> per configuration read, page of rows, load and save: timings, row counts and server CPU time. Never record data.</li>
                <li><b>Timing marks</b> in the browser's Performance panel, the ones the published benchmarks are taken from.</li>
                <li><b>What went wrong</b>, after an unexpected error. Everyone sees <i>Something went wrong. Try again, and if it keeps happening, ask your Salesforce admin.</i>; with Diagnostics, which Rowhouse Grid Admin includes, the message ends with Salesforce's own words in brackets.</li>
              </ul>
            </div>
            <pre><code>[rowhouse] &#123;"source":"rowhouse","event":"page",
          "grid":"Pipeline_Review","at":"2026-10-07T14:05:12.381Z",
          "ms":412,"serverMs":188,"cpuMs":61,
          "rows":31,"loaded":31,"total":31&#125;</code></pre>
          </div>
        </section>

        <section id="trouble" data-anchor="trouble">
          <div class="rh-sec-head"><span class="rh-sec-num">Running it</span><h2>Troubleshooting</h2></div>
          <details class="rh-faq"><summary>The grid shows an error instead of rows</summary><div class="rh-a"><p>Check that the user has the <b>Rowhouse Grid User</b> permission set and can read the grid's object. Check that the Rowhouse Grid component's <b>Grid Configuration</b> matches the record's Grid Configuration Name exactly, and that Object API Name and every Field API Name are API names that exist.</p></div></details>
          <details class="rh-faq"><summary>A column is missing for some users</summary><div class="rh-a"><p>They cannot read that field. Rowhouse leaves out columns a user's field-level security hides, without a message. If the field is hidden from you, the Grid Admin tab lists it as a warning, not a problem, so you can still save the grid for the people who can read it.</p></div></details>
          <details class="rh-faq"><summary>A column cannot be edited</summary><div class="rh-a"><p>All four must hold: Allow Inline Edit on the configuration, Editable on the column, the user may edit the object and the field, and the field can be edited at all (not a formula, roll-up, auto-number, system field or rich text). A formula column of the grid is always read-only. A lookup also needs read access to the target object's name.</p></div></details>
          <details class="rh-faq"><summary>There is no Import or Delete button</summary><div class="rh-a"><p>Import needs Allow Import, Allow New Records and Allow Inline Edit with at least one editable column, and the user must be allowed to edit the object; it is disabled while there are unsaved changes. Delete needs Allow Mass Delete and permission to delete the object, and appears in the bar that shows when rows are selected.</p></div></details>
          <details class="rh-faq"><summary>A color, grouping, tab or action does not show</summary><div class="rh-a"><p>Give yourself Rowhouse Grid Diagnostics and reload: the warning above the grid names the setting that was skipped and why. If there is no warning, the user cannot read a field it needs, or lacks the action's Required Permission.</p></div></details>
          <details class="rh-faq"><summary>"Something went wrong. Try again…"</summary><div class="rh-a"><p>An error Rowhouse did not expect. Give yourself Rowhouse Grid Diagnostics and do the same again: the message then ends with Salesforce's own words in brackets, which say what failed.</p></div></details>
          <details class="rh-faq"><summary>Saves fail with "This grid keeps a log of every change…"</summary><div class="rh-a"><p>The grid has Log Changes selected and the user cannot write to Grid Edit Log. Assign them Rowhouse Grid User, which includes that access.</p></div></details>
          <details class="rh-faq"><summary>There is no gear, or no Grid Admin tab</summary><div class="rh-a"><p>Both are for the <b>Rowhouse Grid Admin</b> permission set. Assign it (with Rowhouse Grid User), then reload the page. The tab is in the <b>Rowhouse</b> app in the App Launcher; to have it in another app too, add it to that app's navigation bar.</p></div></details>
          <details class="rh-faq"><summary>Users see Grid Admin or Grid Edit Logs in the Rowhouse app</summary><div class="rh-a"><p>Their profile shows the tab. Rowhouse Grid User shows the app with the Grid Guide only, but a profile can show a tab on its own: in Setup, open the user's profile and set the tab to Hidden in its tab settings. Rowhouse Grid Admin shows both tabs again to the people who build grids.</p></div></details>
          <details class="rh-faq"><summary>Save stays gray in the grid settings</summary><div class="rh-a"><p>Either nothing has changed yet, the list under the grid's name (from the gear, above the buttons) names something to fix first, or you do not have Customize Application, in which case the editor says so at the top. A Salesforce admin can save it for you.</p></div></details>
          <details class="rh-faq"><summary>"This grid shows … related to … records, and this page shows …"</summary><div class="rh-a"><p>The grid has a Record Page Field and sits on a record page of another object. Place it on a page of the object its Record Page Field points to, or clear the Record Page Field to show the whole list.</p></div></details>
          <details class="rh-faq"><summary>The grid shows an error naming a Grid Filter</summary><div class="rh-a"><p>That filter cannot work: its field was renamed or deleted, the user cannot read it, or its value no longer fits. Fix or switch off the filter on the Grid Admin tab's Filters tab.</p></div></details>
          <details class="rh-faq"><summary>The grid is too tall or too short on the page</summary><div class="rh-a"><p>With Height (px) blank, the grid fills the window from its top edge down. Beside other components, set a Height on the Grid Configuration.</p></div></details>
