                <tr><td>Sort by</td><td><span class="rh-v">Account Name (Name)</span></td></tr>
              </tbody></table></li>
            <li><b>Add the columns.</b> Click <span class="rh-ui">Columns (1)</span>; <span class="rh-ui">Account Name (Name)</span> is already there. Add these, as in step 1:

                <tr><td>Header</td><td>leave it empty: the column is headed <b>Subsidiaries</b></td></tr>
              </tbody></table></li>
            <li><b>Add up their revenue.</b> Click <span class="rh-ui">Add child total column</span> again:
              <table class="rh-fields"><tbody>
                <tr><td>Field column: the list that says <i>Choose a child table</i></td><td><span class="rh-v">Subsidiaries (Account_Groups_Subsidiaries)</span></td></tr>
                <tr><td>The list under it</td><td><span class="rh-v">Sum</span></td></tr>

                <tr><td>Header</td><td><span class="rh-v">Subsidiaries' revenue</span><button class="rh-copy" data-copy="Subsidiaries' revenue" type="button">Copy</button></td></tr>

            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>, then <span class="rh-ui">Activate</span>. On the <span class="rh-ui">Lightning Experience</span> tab, choose <span class="rh-ui">Sales</span>, click <span class="rh-ui">Add page to app</span>, then <span class="rh-ui">Save</span>.</li>

          <ol class="rh-tut">

          </ol>

          <ol class="rh-tut">
            <li><b>Give the UK company its parent.</b> On the <span class="rh-ui">United Oil &amp; Gas, UK</span> row, double-click the <span class="rh-ui">Parent Account</span> cell and type <span class="rh-v">United Oil</span>. When the matches appear, arrow to <span class="rh-ui">United Oil &amp; Gas Corp.</span> and press <kbd>Enter</kbd>.
              <div class="rh-check">The cell says United Oil &amp; Gas Corp., shaded yellow as an unsaved change.</div></li>
            <li><b>And the Singapore company.</b> Do the same on the <span class="rh-ui">United Oil &amp; Gas, Singapore</span> row.</li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> in the bar at the bottom.
              <div class="rh-check">"Saved 2 records." Both rows stay where they are, so you can see what you did; the Total row already counts 11 records.</div></li>
            <li><b>Refresh.</b> Click <span class="rh-ui">Refresh</span>, the round arrow above the grid.
              <div class="rh-check"><i>11 items</i>: the two subsidiaries have left the list, because they now have a parent. United Oil &amp; Gas Corp. has a toggle with <b>2</b> beside it, and its Subsidiaries column says 2.</div></li>
          </ol>
        </section>

        <section id="fill" data-anchor="fill">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Theresa</span><h2>8. Fill in a subsidiary</h2></div>
          <ol class="rh-tut">
            <li><b>Open the group.</b> Click the toggle beside United Oil &amp; Gas Corp.
              <div class="rh-check">A panel opens under the row with one tab, <b>Subsidiaries (2)</b>: the Singapore and UK companies, with their Industry and Employees, and a Total row.</div></li>
            <li><b>Add their revenue.</b> In the tab, click the Annual Revenue cell of <span class="rh-ui">United Oil &amp; Gas, UK</span> and type <span class="rh-v">1200000000</span>; press <kbd>Enter</kbd>. Then the one of <span class="rh-ui">United Oil &amp; Gas, Singapore</span>: <span class="rh-v">410000000</span>, and <kbd>Enter</kbd>.
              <div class="rh-check">The tab's own Save bar appears inside the panel, and its Total row already says Sum $1,610,000,000, in yellow until it is saved.</div></li>
            <li><b>Save the tab.</b> Click <span class="rh-ui">Save</span> in the panel's bar.</li>
            <li><b>Refresh the group grid.</b> Click <span class="rh-ui">Refresh</span> above the grid.
              <div class="rh-check">United Oil &amp; Gas Corp.'s Subsidiaries' revenue says $1,610,000,000. Totals on a parent row are worked out when the grid reads its rows, so a change saved in a tab shows there after Refresh.</div></li>
          </ol>
        </section>
