        <section id="grid" data-anchor="grid">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. The grid</h2>
          <p class="rh-sec-sub">You need the Rowhouse Grid Admin permission set, and Customize Application to save (see <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=start&amp;rowhouse__section=access" data-page="start" data-section="access">Give people access</a>).</p></div>
          <ol class="rh-tut">
            <li><b>Open the Grid Admin tab.</b> Click the App Launcher, type <span class="rh-v rh-plain">Rowhouse</span>, and click the <span class="rh-ui">Rowhouse</span> app. It opens on the <span class="rh-ui">Grid Guide</span>; click the <span class="rh-ui">Grid Admin</span> tab, then <span class="rh-ui">New grid</span>.</li>
            <li><b>Fill in the Grid tab:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Grid title</td><td><span class="rh-v">Account People</span><button class="rh-copy" data-copy="Account People" type="button">Copy</button></td></tr>
                <tr><td>API name</td><td><span class="rh-v">Account_People</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object</td><td><span class="rh-v">Contact (Contact)</span></td></tr>
                <tr><td>Sort by</td><td><span class="rh-v">Last Name (LastName)</span></td></tr>
                <tr><td>On a record page, show the records whose</td><td><span class="rh-v">Account ID (AccountId), on Account pages</span></td></tr>
              </tbody></table>
              <div class="rh-check rh-why">The last one is what ties the grid to the page it sits on: on an account's page it shows only the contacts whose Account is that account. The list offers each lookup of Contact to one object, with the pages it works on.</div></li>
            <li><b>Add the columns.</b> Click <span class="rh-ui">Columns (1)</span>. <span class="rh-ui">Full Name (Name)</span> is already there. For each row below, click <span class="rh-ui">Add column</span>, choose the field, and select <span class="rh-ui">Edit</span> where the table says so:
              <div class="rh-tbox" style="margin-top:10px"><table class="rh-ref">
                <thead><tr><th>Field</th><th>Edit</th></tr></thead>
                <tbody>
                  <tr><td class="rh-d">Title (Title)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Email (Email)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Business Phone (Phone)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Account ID (AccountId)</td><td>—</td></tr>
                </tbody></table></div>
              <div class="rh-check">The Account column's Header box suggests <b>Account</b>, in gray: a lookup is headed by what it points to, so there is no need to type one.</div></li>
            <li><b>Keep the name on screen.</b> On the <span class="rh-ui">Full Name (Name)</span> row, select <span class="rh-ui">Always shown</span>.
              <div class="rh-check rh-why">Users can hide and move the grid's columns for themselves (step 6). This one they can move, but not hide.</div></li>
          </ol>
        </section>

        <section id="more" data-anchor="more">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. A formula, a rule and a filter</h2></div>
          <ol class="rh-tut">
            <li><b>Add a formula column.</b> Click <span class="rh-ui">Add formula column</span>. In the new row:
              <table class="rh-fields"><tbody>
                <tr><td>Field column: the box that says <i>Such as Amount__c * 0.2</i></td><td><span class="rh-v">TODAY() - DATEVALUE(CreatedDate)</span><button class="rh-copy" data-copy="TODAY() - DATEVALUE(CreatedDate)" type="button">Copy</button></td></tr>
                <tr><td>The list under it (what the formula returns)</td><td><span class="rh-v">Number</span> <span class="rh-note">already chosen</span></td></tr>
                <tr><td>The box beside the list, <i>2 places</i> (decimal places)</td><td><span class="rh-v">0</span></td></tr>
                <tr><td>Header column, the box that says <i>Required</i></td><td><span class="rh-v">Days on file</span><button class="rh-copy" data-copy="Days on file" type="button">Copy</button></td></tr>
              </tbody></table>
              <div class="rh-check">Until the formula and the header are filled in, the editor lists them under <i>Fix these before saving</i>. A formula with a mistake shows Salesforce's own message there. The line under the buttons says <i>1 of 10 formulas used</i>.</div></li>
            <li><b>Mark the vice-presidents.</b> Click <span class="rh-ui">Display rules (0)</span>, then <span class="rh-ui">Add display rule</span>, and fill in the row:
              <table class="rh-fields"><tbody>
                <tr><td>Meaning</td><td><span class="rh-v">Executive</span><button class="rh-copy" data-copy="Executive" type="button">Copy</button></td></tr>
                <tr><td>Field</td><td><span class="rh-v">Title (Title)</span></td></tr>
                <tr><td>Condition</td><td><span class="rh-v">Contains</span></td></tr>
                <tr><td>Value</td><td><span class="rh-v">VP</span></td></tr>
                <tr><td>Look</td><td><span class="rh-v">Info icon</span></td></tr>
                <tr><td>Applies to</td><td><span class="rh-v">The cell</span> <span class="rh-note">already chosen</span></td></tr>
              </tbody></table></li>
            <li><b>Leave out contacts without an email.</b> Click <span class="rh-ui">Filters (0)</span>, then <span class="rh-ui">Add filter</span>:
              <table class="rh-fields"><tbody>
                <tr><td>Label</td><td><span class="rh-v">Has email</span><button class="rh-copy" data-copy="Has email" type="button">Copy</button></td></tr>
                <tr><td>Field</td><td><span class="rh-v">Email (Email)</span></td></tr>
                <tr><td>Condition</td><td><span class="rh-v">Is not blank</span></td></tr>
              </tbody></table></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>. After a few seconds the editor reads the grid back: <span class="rh-ui">Columns (6)</span>, <span class="rh-ui">Display rules (1)</span>, <span class="rh-ui">Filters (1)</span>.</li>
          </ol>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. The account page</h2></div>
          <ol class="rh-tut">
            <li><b>Open an account</b>, for example <span class="rh-v">United Oil &amp; Gas Corp.</span></li>
            <li><b>Edit its page.</b> Click the gear at the top right, then <span class="rh-ui">Edit Page</span>. Lightning App Builder opens with the account's page.</li>
            <li><b>Add the grid.</b> In the components list on the left, type <span class="rh-v rh-plain">Rowhouse</span> in the search box, and drag <span class="rh-ui">Rowhouse Grid</span> (under <span class="rh-ui">Custom - Managed</span>) onto the page, above the Related and Details tabs. On the right, enter <span class="rh-v">Account_People</span><button class="rh-copy" data-copy="Account_People" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.
              <div class="rh-check">The grid shows this account's contacts straight away, in the editor. There is nothing to set for the record: Lightning gives the grid the record of the page it is on.</div></li>
            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>. If Salesforce asks, click <span class="rh-ui">Activate</span>; otherwise click <span class="rh-ui">Activation…</span>. Choose <span class="rh-ui">Assign as Org Default</span>, then <span class="rh-ui">Desktop and phone</span>, click <span class="rh-ui">Next</span>, then <span class="rh-ui">Save</span>. Click the back arrow at the top left to return to the account.</li>
          </ol>
        </section>

        <section id="open" data-anchor="open">
          <div class="rh-persona"><span class="rh-avatar rh-b">SP</span><div><b>Now as Sam</b><span>Sam has the Rowhouse Grid User permission set.</span></div></div>
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Sam</span><h2>4. Open an account</h2></div>
          <ol class="rh-tut">
            <li><b>Open United Oil &amp; Gas Corp.</b> The grid <b>Account People</b> is on its page.</li>
          </ol>
          <div class="rh-check">Five contacts: Lauren Boyle, Molly Fitzgerald, Avi Green, Stella Pavlova and Arthur Song. (Molly Fitzgerald is one of ours: a new Developer Edition org has the other four, so expect one fewer in the counts here and in step 5.) Under the title: <i>5 items • Filtered • Sorted by LastName</i>, and a locked chip <i>Email is not blank</i>: the admin's filter. An <b>i</b> icon marks the three titles with VP in them (SVP, Technology; VP, Sales; SVP, Production). The Account column is headed <b>Account</b>. Hover over a <b>Days on file</b> cell and it shows a lock: the grid works it out.</div>
          <p class="rh-note">Title, Email and Business Phone are edited in place, as in any grid: double-click, type, <kbd>Enter</kbd>, then <b>Save</b> in the bar at the bottom.</p>
        </section>

        <section id="filter" data-anchor="filter">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Sam</span><h2>5. Narrow it down</h2></div>
          <ol class="rh-tut">
            <li><b>Filter by title.</b> Click the ▾ on the <span class="rh-ui">Title</span> header, then <span class="rh-ui">Filter…</span>. <span class="rh-ui">Contains</span> is chosen; type <span class="rh-v">VP</span> in <span class="rh-ui">Value</span> and press <kbd>Enter</kbd>.
              <div class="rh-check">Three contacts. A chip <i>Title contains "VP"</i> joins the admin's, with an ✕, and the Title header shows a filter icon.</div></li>
            <li><b>Take it off.</b> Click <span class="rh-ui">Clear filters</span>. The five contacts are back; the admin's chip stays. A filter you add lasts for the visit: reload the page and it is gone, while the admin's stays.</li>
          </ol>
        </section>

        <section id="layout" data-anchor="layout">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Sam</span><h2>6. Make it yours</h2></div>
          <ol class="rh-tut">
            <li><b>Sort by title.</b> Click the <span class="rh-ui">Title</span> header.</li>
            <li><b>Hide a column.</b> Open the ▾ menu on the <span class="rh-ui">Business Phone</span> header and choose <span class="rh-ui">Hide column</span>.
              <div class="rh-check">The column goes. The ▾ menu on <b>Full Name</b> has no Hide column: the admin keeps it on screen.</div></li>
            <li><b>Move one.</b> Drag the <span class="rh-ui">Email</span> header by its name onto the left half of the <span class="rh-ui">Title</span> header, and let go.
              <div class="rh-check">A blue bar shows on Title's left edge while you drag; Email then sits before Title.</div></li>
            <li><b>Reload the page</b> (<kbd>⌘</kbd>+<kbd>R</kbd>, or <kbd>Ctrl</kbd>+<kbd>R</kbd>).
              <div class="rh-check">The grid opens as Sam left it: sorted by Title, Email before Title, no Business Phone. A ↶ button, <b>Reset layout</b>, now sits after Display Key.</div></li>
            <li><b>Bring a column back.</b> Click <span class="rh-ui">Choose columns</span>, the button with three bars beside Refresh. Click <span class="rh-ui">Business Phone</span> under <span class="rh-ui">Available</span>, click ▸ to move it to <span class="rh-ui">Visible</span>, and click <span class="rh-ui">Save</span>.
              <div class="rh-check">Business Phone is back, last. In the dialog, Full Name had a lock beside it: it cannot leave Visible.</div></li>
            <li><b>Put it back.</b> Click <span class="rh-ui">Reset layout</span>. The grid is sorted by last name again, its columns are as the admin set them, and the button goes.</li>
          </ol>
        </section>

        <section id="add" data-anchor="add">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Sam</span><h2>7. Add a contact</h2>
          <p class="rh-sec-sub">United Oil &amp; Gas has a new buyer, and Sam adds her from the account's page.</p></div>
          <ol class="rh-tut">
            <li><b>Click New</b> above the grid.
              <div class="rh-check">Salesforce's New Contact form opens over the page, headed <b>New Contact</b>, with <i>When it is saved, it is added to the grid.</i> under it. <b>Account Name</b> already says <b>United Oil &amp; Gas Corp.</b>: the grid shows this account's contacts, so it fills that in.</div>
              <div class="rh-check rh-why">A new contact needs a last name, and this grid has no column to type one in: Full Name is made from First Name and Last Name. When a row cannot hold what a new record needs, New opens Salesforce's own form instead.</div></li>
            <li><b>Fill it in:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>First Name</td><td><span class="rh-v">Nora</span></td></tr>
                <tr><td>Last Name</td><td><span class="rh-v">Pickering</span></td></tr>
                <tr><td>Title</td><td><span class="rh-v">Purchasing Manager</span><button class="rh-copy" data-copy="Purchasing Manager" type="button">Copy</button></td></tr>
                <tr><td>Email</td><td><span class="rh-v">nora.pickering@unitedoilandgascorp.com</span><button class="rh-copy" data-copy="nora.pickering@unitedoilandgascorp.com" type="button">Copy</button> <span class="rh-note">the grid's filter leaves out contacts without one</span></td></tr>
              </tbody></table></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>.
              <div class="rh-check">The form closes and Nora Pickering is at the top of the grid, where you can see her: <i>6 items</i>. Click <span class="rh-ui">Refresh</span> and she takes her place by last name, between Stella Pavlova and Arthur Song.</div></li>
          </ol>
        </section>
        <section id="learned" data-anchor="learned">
          <div class="rh-sec-head"><span class="rh-sec-num">Wrap-up</span><h2>What you learned</h2></div>
