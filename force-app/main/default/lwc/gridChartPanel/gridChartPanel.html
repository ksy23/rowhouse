<template>
    <section class="rh-charts" aria-labelledby="chart-title">
        <div class="rh-charts-head">
            <div class="rh-charts-heading">
                <h2 id="chart-title" class="rh-charts-title">{title}</h2>
                <p class="rh-charts-sub">{subtitle}</p>
            </div>
            <div class="rh-charts-tools">
                <lightning-button-icon
                    class="rh-charts-edit"
                    icon-name="utility:settings"
                    variant="border-filled"
                    size="small"
                    alternative-text="Edit chart"
                    title="Edit chart"
                    onclick={handleEdit}
                ></lightning-button-icon>
                <lightning-button-icon
                    class="rh-charts-close"
                    icon-name="utility:close"
                    variant="border-filled"
                    size="small"
                    alternative-text="Close the chart"
                    title="Close the chart"
                    onclick={handleClose}
                ></lightning-button-icon>
            </div>
        </div>

        <div class="rh-charts-body">
            <template lwc:if={loading}>
                <div class="rh-charts-loading">
                    <lightning-spinner alternative-text="Loading the chart" size="small" variant="brand"></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={message}>
                <p class="rh-charts-message" role="status">{message}</p>
            </template>

            <!-- The drawing is for the eye; the table under it is what a screen reader reads. -->
            <template lwc:if={showHbar}>
                <svg class="rh-charts-svg" viewBox={barsViewBox} aria-hidden="true" focusable="false">
                    <template for:each={bars.ticks} for:item="t">
                        <text key={t.key} class="rh-charts-tick" x={t.x} y={t.y} text-anchor="middle">{t.text}</text>
                    </template>
                    <line class="rh-charts-axis" x1={bars.baseline.x1} y1={bars.baseline.y1} x2={bars.baseline.x2} y2={bars.baseline.y2}></line>
                    <template for:each={bars.bars} for:item="b">
                        <g key={b.key}>
                            <rect class={b.colorClass} x={b.x} y={b.y} width={b.w} height={b.h} rx="2"></rect>
                            <text class="rh-charts-label" x={b.labelX} y={b.labelY} text-anchor="end">{b.label}</text>
                            <text class="rh-charts-value" x={b.valueX} y={b.valueY} text-anchor="start">{b.value}</text>
                        </g>
                    </template>
                </svg>
            </template>
            <template lwc:if={showVbar}>
                <svg class="rh-charts-svg" viewBox={barsViewBox} aria-hidden="true" focusable="false">
                    <template for:each={bars.ticks} for:item="t">
                        <text key={t.key} class="rh-charts-tick" x={t.x} y={t.y} text-anchor="end">{t.text}</text>
                    </template>
                    <line class="rh-charts-axis" x1={bars.baseline.x1} y1={bars.baseline.y1} x2={bars.baseline.x2} y2={bars.baseline.y2}></line>
                    <template for:each={bars.bars} for:item="b">
                        <g key={b.key}>
                            <rect class={b.colorClass} x={b.x} y={b.y} width={b.w} height={b.h} rx="2"></rect>
                            <text class="rh-charts-value" x={b.valueX} y={b.valueY} text-anchor="middle">{b.value}</text>
                            <text class="rh-charts-label" x={b.labelX} y={b.labelY} transform={b.labelTransform} text-anchor="end">{b.label}</text>
                        </g>
                    </template>
                </svg>
            </template>
            <template lwc:if={showDonut}>
                <div class="rh-charts-donutrow">
                    <svg class="rh-charts-donut" viewBox={donutViewBox} aria-hidden="true" focusable="false">
                        <g transform={donutRotate}>
                            <template for:each={donut.segments} for:item="s">
                                <circle
                                    key={s.key}
                                    class={s.colorClass}
                                    cx={donut.center}
                                    cy={donut.center}
                                    r={donut.radius}
                                    fill="none"
                                    stroke-width={donut.stroke}
                                    stroke-dasharray={s.dash}
                                    stroke-dashoffset={s.offset}
                                ></circle>
                            </template>
                        </g>
                        <text class="rh-charts-total" style={donutTotalStyle} x={donut.center} y={donutTotalY} text-anchor="middle">{totalShort}</text>
                        <text class="rh-charts-count" x={donut.center} y={donutCountY} text-anchor="middle">{donutCountText}</text>
                    </svg>
                    <ul class="rh-charts-legend">
                        <template for:each={entries} for:item="e">
                            <li key={e.key} class="rh-charts-legend-item">
                                <span class={e.swatchClass}></span>
                                <span class="rh-charts-legend-label" title={e.label}>{e.axisLabel}</span>
                                <span class="rh-charts-legend-value" title={e.text}>{e.short}</span>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <!-- Show as a table: the figures in full, in place of the drawing. -->
            <template lwc:if={showTable}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered rh-charts-grid">
                    <caption class="slds-assistive-text">{title}</caption>
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" class="rh-charts-grid-label"><div class="slds-truncate">{groupHeading}</div></th>
                            <th scope="col" class="rh-charts-num"><div class="slds-truncate">{valueHeading}</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={entries} for:item="e">
                            <tr key={e.key}>
                                <th scope="row" class="rh-charts-grid-label">{e.label}</th>
                                <td class="rh-charts-num">{e.text}</td>
                            </tr>
                        </template>
                        <tr class="rh-charts-grid-total">
                            <th scope="row" class="rh-charts-grid-label">Total</th>
                            <td class="rh-charts-num">{totalText}</td>
                        </tr>
                    </tbody>
                </table>
            </template>
            <template lwc:elseif={drawn}>
                <table class="slds-assistive-text rh-charts-table">
                    <caption>{title}</caption>
                    <thead>
                        <tr>
                            <th scope="col">{groupHeading}</th>
                            <th scope="col">{valueHeading}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={entries} for:item="e">
                            <tr key={e.key}>
                                <th scope="row">{e.label}</th>
                                <td>{e.text}</td>
                            </tr>
                        </template>
                        <tr>
                            <th scope="row">Total</th>
                            <td>{totalText}</td>
                        </tr>
                    </tbody>
                </table>
            </template>
        </div>
        <template lwc:if={footText}>
            <p class="rh-charts-foot">{footText} <button class="slds-button rh-charts-toggle" onclick={handleToggleTable}>{toggleLabel}</button></p>
        </template>
    </section>
</template>
