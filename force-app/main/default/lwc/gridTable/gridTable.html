                                                    aria-haspopup="true"
                                                    aria-expanded={row.actionsCell.menuExpanded}
                                                    title={row.actionsCell.label}
                                                    tabindex={row.actionsCell.controlTabindex}
                                                    disabled={row.actionsCell.disabled}
                                                    data-row-menu-button
                                                    data-row-id={row.id}
                                                    onclick={handleRowMenuButton}
                                                    onkeydown={handleRowMenuButtonKeyDown}
                                                >
                                                    <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                                                    <span class="slds-assistive-text">{row.actionsCell.label}</span>
                                                </button>
                                                <template lwc:if={row.actionsCell.menuOpen}>
                                                    <div class={row.actionsCell.dropdownCls}>
                                                        <ul class="slds-dropdown__list" role="menu" aria-label={row.actionsCell.label} onkeydown={handleRowMenuKeyDown} onfocusout={handleRowMenuFocusOut}>
                                                            <template for:each={row.actionsCell.menuItems} for:item="m">
                                                                <li key={m.key} class="slds-dropdown__item" role="presentation">
                                                                    <a
                                                                        href="#"
                                                                        role="menuitem"
                                                                        tabindex="-1"
                                                                        data-row-id={row.id}
                                                                        data-action={m.name}
                                                                        onclick={handleRowMenuChoice}
                                                                    >
                                                                        <span class="slds-truncate" title={m.label}>{m.label}</span>
                                                                    </a>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </td>
                                </template>
                                </template>
                            </tr>
                        </template>
                        <template lwc:if={hasBottomSpacer}>
                            <tr role="none" aria-hidden="true" class="rh-spacer">
                                <td role="none" colspan={spacerColspan} style={bottomSpacerStyle}></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <!-- An empty list says so: a search that matched nothing, or no records. -->
                <template lwc:if={emptyState}>
                    <div class="slds-p-around_large slds-text-align_center rh-empty" role="status">
                        <lightning-icon icon-name={emptyState.icon} size="small" class="slds-m-bottom_x-small"></lightning-icon>
                        <p class="slds-text-heading_small rh-empty-title">{emptyState.title}</p>
                        <template lwc:if={emptyState.message}>
                            <p class="slds-text-color_weak slds-m-top_xx-small">{emptyState.message}</p>
                        </template>
                        <template lwc:if={emptyState.actionLabel}>
                            <button class="slds-button slds-button_neutral slds-m-top_small rh-empty-action" onclick={handleEmptyAction}>{emptyState.actionLabel}</button>
                        </template>
                    </div>
                </template>
                <!-- The Total row: the whole list's subtotals, stuck to the bottom of
                     the scroller. A read-only grid of its own, not a row of the grid,
                     reached with Down from the last row: see totalCells. -->
                <template lwc:if={totalCells}>
                    <table role="grid" aria-readonly="true" class="slds-table slds-table_bordered slds-table_fixed-layout rh-totals" style={tableStyle} aria-label={totalsLabel}>
                        <tbody>
                            <tr role="row">
                                <template for:each={totalCells} for:item="t">
                                    <td key={t.key} role="gridcell" data-total-field={t.key} tabindex={t.tabindex} class={t.cls} style={t.style}>
                                        <template lwc:if={t.isLabel}>
                                            <span class="slds-truncate rh-total-label"><span class="rh-total-word">Total</span>{t.countText}</span>
                                        </template>
                                        <template lwc:if={t.hasSubtotal}>
                                            <span class="slds-truncate rh-subtotal" title={t.spoken} aria-hidden="true"><span class="rh-subtotal-kind">{t.kind}</span>{t.text}</span>
                                            <span class="slds-assistive-text">{t.spoken}</span>
                                        </template>
                                    </td>
                                </template>
                            </tr>
                        </tbody>
                    </table>
                </template>
                <!-- More rows on the server. Scrolling near the end or reaching the
                     last row asks for them; the button is the same thing for anyone who
                     does neither. Outside the grid role, so the grid keeps one tab stop. -->
                <template lwc:if={showLoadMore}>
                    <div class="slds-p-around_small slds-text-align_center rh-load-more">
                        <template lwc:if={isLoadingMore}>
                            <div class="slds-is-relative slds-p-vertical_large rh-load-more-spinner">
                                <lightning-spinner alternative-text="Loading more rows" variant="brand" size="medium"></lightning-spinner>
                            </div>
                        </template>
                        <template lwc:else>
                            <button class="slds-button slds-button_neutral rh-load-more-button" onclick={handleLoadMoreClick}>{loadMoreLabel}</button>
                        </template>
                    </div>
                </template>
            </div>
            <!-- Cell-level error text, referenced from each errored cell by aria-describedby.
                 Table only: in cards the message sits under its field, with the same id. -->
            <div class="slds-assistive-text">
                <template for:each={errorDescriptions} for:item="e">
                    <span key={e.id} id={e.id}>Error: {e.message}</span>
                </template>
            </div>
        </template>
        <template lwc:if={showFooter}>
            <!-- The Save bar: a pill floating at the bottom of the grid, in the selection
                 bar's light blue, with what is unsaved above its buttons. -->
            <div class={footerClass} role="region" aria-label="Unsaved changes">
                <p class="slds-text-align_center rh-footer-summary">{footerSummary}</p>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center rh-footer-actions">
                    <!-- Undo and Redo beside the changes they undo. -->
                    <template lwc:if={hasHistory}>
                        <span class="slds-grid slds-m-right_medium rh-footer-history">
                            <button class="slds-button slds-button_neutral rh-footer-undo" title={undoTitle} onclick={handleUndoClick} disabled={undoDisabled}>
                                <lightning-icon icon-name="utility:undo" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>Undo
                            </button>
                            <button class="slds-button slds-button_neutral rh-footer-redo" title={redoTitle} onclick={handleRedoClick} disabled={redoDisabled}>
                                <lightning-icon icon-name="utility:redo" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>Redo
                            </button>
                        </span>
                    </template>
                    <button class="slds-button slds-button_neutral rh-footer-cancel" onclick={handleCancel} disabled={saveDisabled}>Cancel</button>
                    <!-- While the edits save, Save keeps its blue and turns "Saving…" with a
                         spinner; it does nothing more until the save is done. -->
                    <button
                        class="slds-button slds-button_brand rh-footer-save"
                        onclick={handleSave}
                        disabled={saveButtonDisabled}
                        aria-disabled={saveAriaDisabled}
                    >
                        <template lwc:if={isSavingEdits}>
                            <span class="slds-spinner slds-spinner_inverse slds-spinner_x-small slds-spinner_inline slds-m-right_x-small rh-save-spinner" aria-hidden="true">
                                <span class="slds-spinner__dot-a"></span>
                                <span class="slds-spinner__dot-b"></span>
                            </span>Saving…
                        </template>
                        <template lwc:else>Save</template>
                    </button>
                </div>
            </div>
        </template>
        <div class="slds-assistive-text rh-table-live" aria-live="polite" aria-atomic="true" lwc:dom="manual"></div>
    </div>
</template>
