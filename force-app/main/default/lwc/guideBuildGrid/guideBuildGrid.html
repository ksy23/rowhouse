<template>
    <div class="rh-build">
        <template lwc:if={canBuild}>
            <button class="slds-button slds-button_brand rh-build-open" onclick={handleOpen}>{buttonLabel}</button>
            <p class="rh-build-done" role="status">{builtText}</p>
        </template>
        <template lwc:elseif={cannotBuild}>
            <p class="rh-build-cannot">{cannotText}</p>
        </template>
    </div>
    <template lwc:if={dialogOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="heading"
            class="slds-modal slds-fade-in-open rh-build-dialog"
            onkeydown={handleKeyDown}
        >
            <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
            <div class="slds-modal__container">
                <button
                    class="slds-button slds-button_icon slds-modal__close rh-build-close"
                    title="Cancel and close"
                    disabled={working}
                    onclick={handleCancel}
                >
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Cancel and close</span>
                </button>
                <div class="slds-modal__header">
                    <h1 id="heading" class="slds-modal__title slds-hyphenate rh-build-heading">{heading}</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- While the grids are saved, a spinner takes the list's place, as Import does. -->
                    <template lwc:if={working}>
                        <div class="rh-build-busy" tabindex="-1">
                            <div class="rh-build-spinner">
                                <lightning-spinner alternative-text="Building the grids" size="medium" variant="brand"></lightning-spinner>
                            </div>
                            <p class="rh-build-progress" role="status">{progress}</p>
                            <p class="rh-build-busy-note">Keep this window open until it is done.</p>
                        </div>
                    </template>
                    <template lwc:elseif={checking}>
                        <div class="rh-build-loading">
                            <lightning-spinner
                                alternative-text="Checking which grids this org has"
                                size="small"
                                variant="brand"
                            ></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="rh-build-lede">{ledeText}</p>
                        <ul class="slds-list_dotted slds-m-top_small rh-build-items">
                            <template for:each={items} for:item="item">
                                <li key={item.key} class={item.className}>
                                    <b>{item.title}</b>
                                    <span class="rh-build-item-text">{item.text}</span>
                                </li>
                            </template>
                        </ul>
                        <template lwc:if={afterText}>
                            <p class="slds-m-top_small slds-text-color_weak rh-build-after">{afterText}</p>
                        </template>
                    </template>
                    <template lwc:if={error}>
                        <p class="slds-m-top_small slds-text-color_error rh-build-error" role="alert">{error}</p>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral rh-build-cancel" disabled={working} onclick={handleCancel}>
                        {cancelLabel}
                    </button>
                    <template lwc:if={showBuild}>
                        <button class="slds-button slds-button_brand rh-build-confirm" disabled={buildDisabled} onclick={handleBuild}>
                            Build
                        </button>
                    </template>
                </div>
            </div>
            <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
