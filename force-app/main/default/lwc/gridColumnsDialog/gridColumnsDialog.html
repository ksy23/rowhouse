<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="heading"
        aria-describedby="description"
        class="slds-modal slds-fade-in-open rh-columns-dialog"
        onkeydown={handleKeyDown}
    >
        <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
        <div class="slds-modal__container">
            <button
                class="slds-button slds-button_icon slds-modal__close rh-columns-close"
                title="Cancel and close"
                onclick={handleCancel}
            >
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="heading" class="slds-modal__title slds-hyphenate">Choose columns</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="description">
                <template lwc:if={viewShown}>
                    <p class="slds-m-bottom_small rh-columns-intro">
                        Move the columns you want into Visible, in the order to show them. This changes the view you're
                        on: Save or Save As, above the grid, keeps it.
                    </p>
                </template>
                <template lwc:else>
                    <p class="slds-m-bottom_small rh-columns-intro">
                        Move the columns you want into Visible, in the order to show them. Only you see this choice;
                        Reset layout puts back your admin's columns.
                    </p>
                </template>
                <template lwc:if={keptText}>
                    <p class="slds-m-bottom_small slds-text-color_weak rh-columns-kept">{keptText}</p>
                </template>
                <lightning-dual-listbox
                    class="rh-columns-lists"
                    name="columns"
                    label="Columns"
                    variant="label-hidden"
                    source-label="Available"
                    selected-label="Visible"
                    options={options}
                    value={value}
                    required-options={requiredOptions}
                    min="1"
                    size="10"
                    onchange={handleChange}
                ></lightning-dual-listbox>
            </div>
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral rh-columns-cancel" onclick={handleCancel}>Cancel</button>
                <button class="slds-button slds-button_brand rh-columns-save" onclick={handleSave}>Save</button>
            </div>
        </div>
        <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
