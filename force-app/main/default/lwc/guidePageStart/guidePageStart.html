          <main class="rh-content">

        <section id="need" data-anchor="need">
          <div class="rh-sec-head"><span class="rh-sec-num">01</span><h2>What you need</h2></div>
          <div class="rh-prose">
            <ul class="rh-tick">
              <li><b>Lightning Experience.</b> Rowhouse is a Lightning web component. It is placed on App, Record and Home pages; it does not run in Salesforce Classic, in Experience Cloud sites, or in the Salesforce mobile app's own list views.</li>
              <li><b>Permission to customize the application.</b> Grids are described by Custom Metadata records. You build them on the <b>Grid Admin</b> tab, or record by record in Setup; saving either way needs the Customize Application permission, which Salesforce admins have. Placing a grid on a page needs the usual permissions for Lightning App Builder.</li>
              <li><b>Rowhouse installed in the org.</b> If you are reading this on the Grid Guide tab, it is.</li>
              <li id="not-certified" data-anchor="not-certified"><b>In a production org, until Rowhouse has passed Salesforce's security review:</b> if saving a grid says <i>Salesforce did not let Rowhouse save it</i>, turn on <b>Deploy Metadata from Non-Certified Package Versions via Apex</b> (in Setup, type <span class="rh-ui">Apex Settings</span> in the Quick Find box). Saving a grid, the guide's Build buttons and Import Grid write Custom Metadata from Apex, which Salesforce allows such a package only with this setting.</li>
            </ul>
          </div>
          <div class="rh-call">
            <span class="rh-k">Good to know before you plan a grid</span>
            <p>A grid shows <b>every record of its object that the user is allowed to see</b>. Without filters, a grid of Opportunities shows open and closed ones alike. Add <b>Grid Filters</b> (such as Stage does not equal Closed Won) to narrow it for everyone; users cannot remove them. Users can also search, filter by a column, and group (for example by Stage) to keep closed records together where they can be collapsed.</p>
          </div>
        </section>

        <section id="model" data-anchor="model">
          <div class="rh-sec-head"><span class="rh-sec-num">02</span><h2>How a grid is defined</h2>
            <p class="rh-sec-sub">A grid is a <b>Grid Configuration</b> record plus the records that point to it. They are Custom Metadata, so they are settings, not data: they move between sandboxes and production in a change set or a deployment, and nobody has to re-create them by hand.</p></div>

          <div class="rh-frame rh-rv">

              <title id="mT" data-anchor="mT">The six kinds of configuration record</title>
              <desc id="mD" data-anchor="mD">A Grid Configuration in the center. Grid Columns, Grid Display Rules, Grid Filters, Grid Actions and Grid Child Tables each point to it through their Grid Configuration field. A Grid Child Table also points to a second Grid Configuration, the one shown in its tab.</desc>
              <path class="rh-wire" d="M250,47 C330,47 330,165 380,165"/>
              <path class="rh-wire rh-plum" d="M250,115 C330,115 330,165 380,165"/>
              <path class="rh-wire rh-teal" d="M250,183 C330,183 330,165 380,165"/>
              <path class="rh-wire rh-rose" d="M250,251 C330,251 330,165 380,165"/>
              <path class="rh-wire rh-gold" d="M670,165 H560"/>
              <path class="rh-wire rh-gold" d="M760,205 V265 H560 C520,265 500,250 500,215"/>
              <g class="rh-node rh-s"><rect x="30" y="20" width="220" height="54" rx="10"/><text class="rh-b" x="48" y="43">Grid Column</text><text class="rh-s" x="48" y="62">one per column · required</text></g>
              <g class="rh-node rh-p"><rect x="30" y="88" width="220" height="54" rx="10"/><text class="rh-b" x="48" y="111">Grid Display Rule</text><text class="rh-s" x="48" y="130">one per display rule · optional</text></g>
              <g class="rh-node rh-t"><rect x="30" y="156" width="220" height="54" rx="10"/><text class="rh-b" x="48" y="179">Grid Filter</text><text class="rh-s" x="48" y="198">one per condition · optional</text></g>
              <g class="rh-node rh-r"><rect x="30" y="224" width="220" height="54" rx="10"/><text class="rh-b" x="48" y="247">Grid Action</text><text class="rh-s" x="48" y="266">one per action · optional</text></g>
              <g class="rh-node rh-a rh-pop"><rect x="380" y="110" width="180" height="110" rx="12"/><text class="rh-k" x="398" y="134">The grid</text><text class="rh-b" x="398" y="160" style="font-size:16px">Grid</text><text class="rh-b" x="398" y="180" style="font-size:16px">Configuration</text><text class="rh-s" x="398" y="202">one per grid · required</text></g>
              <g class="rh-node rh-g"><rect x="670" y="125" width="220" height="80" rx="10"/><text class="rh-b" x="688" y="150">Grid Child Table</text><text class="rh-s" x="688" y="170">one per tab under each row</text><text class="rh-s" x="688" y="188">links a parent and a child grid</text></g>
              <text class="rh-s" x="580" y="285">its tab shows another Grid Configuration</text>
              <circle r="4.5" class="rh-dot rh-sky"><animateMotion dur="2.6s" repeatCount="indefinite" path="M250,47 C330,47 330,165 380,165"/></circle>
              <circle r="4.5" class="rh-dot rh-plum"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite" path="M250,115 C330,115 330,165 380,165"/></circle>
              <circle r="4.5" class="rh-dot rh-teal"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite" path="M250,183 C330,183 330,165 380,165"/></circle>
              <circle r="4.5" class="rh-dot rh-rose"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M250,251 C330,251 330,165 380,165"/></circle>
              <circle r="4.5" class="rh-dot rh-gold"><animateMotion dur="2.6s" begin=".4s" repeatCount="indefinite" path="M670,165 H560"/></circle>
            </svg>
          </div>

          <div class="rh-tbox rh-rv" style="margin-top:22px">
            <table class="rh-ref">
              <thead><tr><th>Record</th><th>How many</th><th>What it holds</th></tr></thead>
              <tbody>
                <tr><td>Grid Configuration</td><td class="rh-d">1 per grid</td><td>The object, the sort it opens with, how many rows the first page loads, its height, frozen columns, the lookup that ties it to a record page, and what users may do: edit, export, import, delete, and whether every change is logged.</td></tr>
                <tr><td>Grid Column</td><td class="rh-d">1 per column</td><td>The field, or a formula the grid works out; the order, whether it can be edited, sorted or wrapped, its width, and grouping and subtotal settings.</td></tr>
                <tr><td>Grid Display Rule</td><td class="rh-d">0 or more</td><td>A test (a value, a range, another field, or a formula) and a look: a fill, a text color, bold, an icon or a data bar, on a cell, or a bar on the whole row.</td></tr>
                <tr><td>Grid Filter</td><td class="rh-d">0 or more</td><td>A condition every record in the grid must meet. Users see it as a locked chip and cannot remove it.</td></tr>
                <tr><td>Grid Child Table</td><td class="rh-d">0 or more</td><td>A tab of related records under each row, shown with another Grid Configuration.</td></tr>
                <tr><td>Grid Action</td><td class="rh-d">0 or more</td><td>A flow or quick action users can run on a row, or a flow they run on the selected rows.</td></tr>
              </tbody>
            </table>
          </div>
          <p class="rh-note" style="margin-top:10px">Every field of every record is in the <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=configure" data-page="configure">configuration reference</a>. In Setup, each field also has help text: hover over the <b>i</b> beside its label.</p>
        </section>

        <section id="access" data-anchor="access">
          <div class="rh-sec-head"><span class="rh-sec-num">03</span><h2>Give people access</h2>
            <p class="rh-sec-sub">Rowhouse ships three permission sets. None gives access to your records: what a user sees and changes in a grid is exactly what their profile, permission sets and sharing already allow.</p></div>
          <div class="rh-split rh-rv-stagger">
            <div class="rh-tile" style="--rh-c:var(--rh-accent)"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5.5 5"/></svg></div><h4>Rowhouse Grid User · required</h4><p>Assign it to everyone who uses a grid, admins included. It lets them open grids, save changes, write to the audit log, keep their own layout of each grid, and read this guide in the <b>Rowhouse</b> app (its <b>Grid Guide</b> tab, the only one they see there, also opened by the <b>?</b> on each grid). A profile cannot grant this access; it has to be the permission set.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg></div><h4>Rowhouse Grid Diagnostics · optional</h4><p>Shows troubleshooting information: configuration warnings above each grid, and load and save timings in the browser console. Assign it while you investigate a problem, then remove it.</p></div>
            <div class="rh-tile rh-plum"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></div><h4>Rowhouse Grid Admin · for whoever builds grids</h4><p>Adds the <b>Grid Admin</b> and <b>Grid Edit Logs</b> tabs to the <b>Rowhouse</b> app, beside its <b>Grid Guide</b>, and the gear to each grid, where grids are built and changed, and includes what Rowhouse Grid Diagnostics shows. It also shows the guide's pages for admins: this one, Configure and Features. Assign it with Rowhouse Grid User. Saving a grid also needs Customize Application.</p></div>
          </div>

          <h3>Assign Rowhouse Grid User</h3>
          <ol class="rh-tut">
            <li><b>Open the permission set.</b> In Setup, type <span class="rh-v rh-plain">Permission Sets</span> in the Quick Find box and click <span class="rh-ui">Permission Sets</span>. Click <span class="rh-ui">Rowhouse Grid User</span>.</li>
            <li><b>Add people.</b> Click <span class="rh-ui">Manage Assignments</span>, then <span class="rh-ui">Add Assignment</span>. Select each person who will use a grid, including yourself.</li>
            <li><b>Confirm.</b> Click <span class="rh-ui">Next</span>, leave the expiration as <span class="rh-ui">No expiration date</span>, and click <span class="rh-ui">Assign</span>, then <span class="rh-ui">Done</span>.</li>
            <li><b>Give yourself Rowhouse Grid Admin.</b> Go back to <span class="rh-ui">Permission Sets</span>, click <span class="rh-ui">Rowhouse Grid Admin</span>, and repeat steps 2 and 3, selecting yourself.</li>
          </ol>
          <div class="rh-call rh-w"><span class="rh-k">If someone sees nothing</span><p>A user without Rowhouse Grid User sees an error where the grid should be. A user who has it but cannot read the grid's object sees a message saying so. Check the permission set first, then their access to the object.</p></div>
        </section>

        <section id="first" data-anchor="first">
          <div class="rh-sec-head"><span class="rh-sec-num">04</span><h2>Your first grid: an account directory</h2>
            <p class="rh-sec-sub">A small grid of Accounts with four columns, where users can fix phone numbers, industries and owners, built on the Grid Admin tab. Ten minutes, start to finish. For a bigger example with grouping and colors, follow <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=tutorial-pipeline" data-page="tutorial-pipeline">the pipeline review tutorial</a>, which builds its grid in Setup, record by record.</p></div>

          <h3>1 · Open the Grid Admin tab</h3>
          <ol class="rh-tut">
            <li><b>Open the Rowhouse app.</b> Click the App Launcher (the nine dots at the top left), type <span class="rh-v rh-plain">Rowhouse</span> in its search box, and click <span class="rh-ui">Rowhouse</span> under <span class="rh-ui">Apps</span>, beside the Rowhouse logo. The app opens on its <span class="rh-ui">Grid Guide</span> tab, this guide. Click the <span class="rh-ui">Grid Admin</span> tab beside it. It opens on its <span class="rh-ui">Grids</span> page: <i>Your grids</i>, cards that sum up the org's grids, and the list of every grid in use, with a side navigation on the left that narrows it to archived grids or one object's.</li>
            <li><b>Start a grid.</b> Click <span class="rh-ui">New grid</span>.</li>
          </ol>

          <h3>2 · Name it and choose the object</h3>
          <ol class="rh-tut">
            <li><b>Fill in the Grid tab</b> and leave the rest as it is:
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Grid title</td><td><span class="rh-v">Account Directory</span><button class="rh-copy" data-copy="Account Directory" type="button">Copy</button></td></tr>
                <tr><td>API name</td><td><span class="rh-v">Account_Directory</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object</td><td><span class="rh-v">Account (Account)</span> <span class="rh-note">choose it from the list</span></td></tr>
                <tr><td>Sort by</td><td><span class="rh-v">Account Name (Name)</span> <span class="rh-note">appears once the object is chosen</span></td></tr>
                <tr><td>Sort direction</td><td><span class="rh-v">Ascending</span> <span class="rh-note">already chosen</span></td></tr>
                <tr><td>Edit cells in the grid</td><td><span class="rh-tick">✓</span> selected (the default)</td></tr>
                <tr><td>Create records with New</td><td><span class="rh-tick">✓</span> selected (the default)</td></tr>
              </tbody></table>
            </li>
          </ol>

          <h3>3 · Add the columns and save</h3>
          <ol class="rh-tut">
            <li><b>Open the Columns tab.</b> Click <span class="rh-ui">Columns (1)</span>. <span class="rh-ui">Account Name (Name)</span> is there already: a new grid starts with its object's name.</li>
            <li><b>Add three more.</b> For each row of this table, click <span class="rh-ui">Add column</span>, choose the field in the new row's <span class="rh-ui">Field</span> list, type the header if the table has one, and select <span class="rh-ui">Edit</span>:
              <div class="rh-tbox" style="margin-top:10px"><table class="rh-ref">
                <thead><tr><th>Field</th><th>Header</th><th>Edit</th></tr></thead>
                <tbody>
                  <tr><td class="rh-d">Account Phone (Phone)</td><td>—</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Industry (Industry)</td><td>—</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Owner ID (OwnerId)</td><td>Account Owner<button class="rh-copy" data-copy="Account Owner" type="button">Copy</button></td><td class="rh-tick">✓</td></tr>
                </tbody></table></div>
              <p class="rh-note" style="margin-top:8px">A blank header shows the field's label; a lookup such as OwnerId is headed by what it points to, "Owner" (the box shows it in gray). Here it gets one that says more. Leave a dash (—) empty.</p>
            </li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>. The editor says <i>Saving. This takes a few seconds…</i>, and then a green <i>Grid saved</i> message appears. If Save stays gray, the list under the grid's name says what to fix first.</li>
          </ol>
          <p class="rh-note">Rather build it in Setup? A grid is a Grid Configuration record and a Grid Column record per column; the <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=configure" data-page="configure">configuration reference</a> has every field, and the tutorials build their grids that way.</p>

          <h3>4 · Put the grid on a page</h3>
          <ol class="rh-tut">
            <li><b>Create an App page.</b> In Setup, type <span class="rh-v rh-plain">Lightning App Builder</span> in the Quick Find box and click <span class="rh-ui">Lightning App Builder</span>. Click <span class="rh-ui">New</span>, choose <span class="rh-ui">App Page</span>, and click <span class="rh-ui">Next</span>.</li>
            <li><b>Name it.</b> Enter the Label <span class="rh-v">Account Directory</span> and click <span class="rh-ui">Next</span>. Choose <span class="rh-ui">One Region</span> and click <span class="rh-ui">Done</span>.</li>
            <li><b>Add the grid.</b> In the list of components on the left, find <span class="rh-ui">Rowhouse Grid</span> under <span class="rh-ui">Custom - Managed</span> (near the bottom of the list) and drag it onto the page. On the right, enter <span class="rh-v">Account_Directory</span><button class="rh-copy" data-copy="Account_Directory" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.</li>
            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>. When Salesforce offers to activate the page, click <span class="rh-ui">Activate</span> (or, later, click <span class="rh-ui">Activation…</span> at the top right). On the <span class="rh-ui">Lightning Experience</span> tab, choose the app your users work in (for example <span class="rh-ui">Sales</span>), click <span class="rh-ui">Add page to app</span>, and click <span class="rh-ui">Save</span>.</li>
            <li><b>Open it.</b> Open that app and click the <span class="rh-ui">Account Directory</span> tab in its navigation bar (or the <span class="rh-ui">More</span> menu).</li>
          </ol>
          <div class="rh-check">A grid titled <b>Account Directory</b> with the Accounts icon, four columns (Account Name, Account Phone, Industry, Account Owner), sorted by name. Hover over a phone number: a blue pencil means you can edit it. Hover over an account name: a light gray lock, because Account Name was not made editable. For the same reason, <span class="rh-ui">New</span> above the grid opens Salesforce's New Account form rather than adding a row: a new account needs its name, and the grid cannot take one.</div>
        </section>

        <section id="where" data-anchor="where">
          <div class="rh-sec-head"><span class="rh-sec-num">05</span><h2>Where to put a grid</h2></div>
          <div class="rh-tiles rh-rv-stagger">
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg></div><h4>App page: the usual home</h4><p>A grid on its own App page, added to an app as a tab, fills the window from its top edge to the bottom of the screen. Leave Height (px) empty for this.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg></div><h4>Home page</h4><p>Beside other components, set <b>Height (px)</b> on the Grid Configuration (for example 420), or the grid pushes the rest of the page down a full window.</p></div>
            <div class="rh-tile rh-plum"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></div><h4>Record page</h4><p>With a Height set. Give the grid a <b>Record Page Field</b> and it shows only that record's related rows; without one it shows its whole list. See <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=tutorial-contacts" data-page="tutorial-contacts">Contacts on an account page</a>.</p></div>
          </div>
        </section>

        <section id="move" data-anchor="move">
          <div class="rh-sec-head"><span class="rh-sec-num">06</span><h2>Moving grids between orgs</h2></div>
          <div class="rh-prose">
            <p><b>To any org, with a file.</b> On the Grid Admin tab, <b>Export</b> a grid from its <b>▾</b> menu, or the grids the list shows with the Export button beside Import Grid; in the other org, click <b>Import Grid</b> and choose the file. The dialog shows what importing does before anything is saved, and a grid that org already has is never changed. This is the quick way to set up a demo or trial org, or an org a change set cannot reach. See <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=features&amp;rowhouse__section=admin-transfer" data-page="features" data-section="admin-transfer">Export and import grids</a>.</p>
            <p><b>From a sandbox to its production org, on your release path.</b> Grid Configurations and everything that points to them are Custom Metadata records. Build a grid in a sandbox, then add its records to an outbound change set (they are listed under <b>Custom Metadata Type</b> records by type) or include them in your deployment. Deploy the Grid Configuration with its columns, rules, filters, child tables and actions together, since they point to it.</p>
            <p>The page that shows the grid is a Lightning page, which deploys the same way as any other; a grid file holds no page.</p>
          </div>
        </section>

        <section id="tips" data-anchor="tips">
          <div class="rh-sec-head"><span class="rh-sec-num">07</span><h2>Tips from building the tutorials</h2></div>
          <ul class="rh-tick">
            <li><b>In Setup, number Sort Order in tens</b> (10, 20, 30). A new column can then go between two others without renumbering. The Grid Admin tab numbers them for you, in the order of its list.</li>
            <li><b>In Setup, start each record's name with the grid's name</b>, as in <span class="rh-v rh-plain">Account_Directory_Phone</span>. Records of all grids share one list in Setup, and names must be unique across all of them. The Grid Admin tab names them that way itself.</li>
            <li><b>Use API names, without a namespace prefix</b>: <span class="rh-v rh-plain">OwnerId</span>, not <span class="rh-v rh-plain">Owner</span>; <span class="rh-v rh-plain">My_Field__c</span>, not its label.</li>
            <li><b>Give yourself Rowhouse Grid Diagnostics while you build</b> (Rowhouse Grid Admin includes it). A setting that cannot work (a misspelled field, a subtotal that does not fit) is skipped, not fatal, and the warning shows above the grid only to people with that permission set. On the Grid Admin tab the same warnings show under the editor as you change things.</li>
            <li><b>Change a grid where it is.</b> With Rowhouse Grid Admin, a gear beside a grid's Refresh button opens that grid's settings; save, and the grid loads again with the change.</li>
            <li><b>Lookups show names.</b> A lookup column, such as AccountId or OwnerId, shows the related record's name as a link and is edited by searching.</li>
          </ul>
          <div class="rh-next">
            <a href="/lightning/n/rowhouse__Grid_Guide" data-page="welcome"><small>Back</small><b>← Home</b></a>
            <a class="rh-fwd" href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=configure" data-page="configure"><small>Next</small><b>Configuration reference →</b></a>
          </div>
        </section>
