<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="heading"
        class="slds-modal slds-fade-in-open slds-modal_large rh-settings"
        onkeydown={handleKeyDown}
    >
        <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
        <div class="slds-modal__container">
            <lightning-button-icon
                class="slds-button slds-button_icon slds-modal__close rh-settings-close"
                icon-name="utility:close"
                variant="bare"
                size="large"
                alternative-text="Close grid settings"
                title="Close grid settings"
                onclick={handleCloseRequest}
            ></lightning-button-icon>
            <div class="slds-modal__header">
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                    <img class="slds-m-right_small rh-settings-mark" src={markUrl} alt="" width="28" height="28" />
                    <h1 id="heading" class="slds-modal__title slds-hyphenate">{heading}</h1>
                </div>
            </div>
            <div class="slds-modal__content slds-p-horizontal_medium slds-p-top_small rh-settings-body">
                <c-grid-config-editor
                    config-name={configName}
                    onsaved={handleSaved}
                    onclose={handleEditorClose}
                ></c-grid-config-editor>
            </div>
        </div>
        <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
