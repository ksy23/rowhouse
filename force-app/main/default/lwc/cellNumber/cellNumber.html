<template>
    <template lwc:if={isEdit}>
        <div onkeydown={handleKeyDown}>
            <lightning-input
                type="number"
                label={label}
                variant="label-hidden"
                formatter={formatter}
                step={step}
                value={inputValue}
                required={required}
                onchange={handleChange}
            ></lightning-input>
            <template lwc:if={error}>
                <p class="slds-form-element__help slds-text-color_error rh-editor-error" role="alert">{error}</p>
            </template>
        </div>
    </template>
    <template lwc:else>
        <span class="slds-truncate" title={text}>{text}</span>
    </template>
</template>
