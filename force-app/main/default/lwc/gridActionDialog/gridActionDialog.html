<template>
    <section
        role="alertdialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="heading"
        aria-describedby="description"
        class="slds-modal slds-fade-in-open rh-action-dialog"
        onkeydown={handleKeyDown}
    >
        <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close rh-action-close" title="Cancel and close" data-control onclick={handleCancel}>
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="heading" class="slds-modal__title slds-hyphenate">{heading}</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="description">
                <p class="slds-m-bottom_x-small rh-action-runs-on">{runsOnText}</p>
                <ul class="slds-list_dotted slds-m-bottom_small rh-action-names">
                    <template for:each={shownNames} for:item="n">
                        <li key={n.key}>{n.name}</li>
                    </template>
                </ul>
                <template lwc:if={moreText}>
                    <p class="slds-m-bottom_small rh-action-more">{moreText}</p>
                </template>
                <template lwc:if={draftsText}>
                    <p class="slds-text-color_error rh-action-drafts">{draftsText}</p>
                </template>
            </div>
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral rh-action-cancel" data-control onclick={handleCancel}>Cancel</button>
                <button class="slds-button slds-button_brand rh-action-confirm" data-control onclick={handleConfirm}>{confirmLabel}</button>
            </div>
        </div>
        <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
