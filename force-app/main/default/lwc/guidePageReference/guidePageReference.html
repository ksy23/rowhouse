        <section id="faq" data-anchor="faq">
          <div class="rh-sec-head"><span class="rh-sec-num">Questions</span><h2>Questions people ask</h2></div>
          <details class="rh-faq"><summary>Can I undo after saving?</summary><div class="rh-a"><p>No. Undo covers changes you have not saved. Saved values are the record's; use the record's field history, or the grid's audit trail if your admin turned it on, to see what they were.</p></div></details>
          <details class="rh-faq"><summary>What if two people edit the same record?</summary><div class="rh-a"><p>The last save wins, as with a list view's inline edit. Rowhouse does not lock records while they are being edited.</p></div></details>
          <details class="rh-faq"><summary>Do my company's validation rules, triggers and flows still run?</summary><div class="rh-a"><p>Yes. A save from the grid is an ordinary save. If a rule refuses a record, its cell shows the rule's message and the other records still save.</p></div></details>
          <details class="rh-faq"><summary>Does any data leave Salesforce?</summary><div class="rh-a"><p>No. Rowhouse makes no callouts and loads no outside code. Export creates a file in your own browser.</p></div></details>
          <details class="rh-faq"><summary>Does it work in Salesforce Classic or the mobile app?</summary><div class="rh-a"><p>It runs on Lightning pages in Lightning Experience, and in a narrow space it switches to record cards. It does not run in Classic or in Experience Cloud sites, and it has not yet been tested in the Salesforce mobile app.</p></div></details>
          <details class="rh-faq"><summary>How does it show amounts when my org has more than one currency?</summary><div class="rh-a"><p>Each amount in its record's currency, by its code, as Salesforce does: <span class="rh-v rh-plain">USD 78,250.00</span>, <span class="rh-v rh-plain">CAD 1,000.00</span>. Totals and subtotals are in your org's corporate currency, each record converted at your org's rates, and show its code. Filters and display rules compare amounts as stored, in each record's own currency (<a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=features&amp;rowhouse__section=currency" data-page="features" data-section="currency">Features › More than one currency</a>).</p></div></details>
          <details class="rh-faq"><summary>Which browsers does it support?</summary><div class="rh-a"><p>The browsers Salesforce supports for Lightning Experience.</p></div></details>
          <details class="rh-faq"><summary>Why does New sometimes open Salesforce's New form instead of adding a row?</summary><div class="rh-a"><p>A row in the grid can be filled in only through the grid's own columns. When a new record needs a required field that is not an editable column, when you have more than one record type to choose from, or when the grid does not let you edit cells, <b>New</b> opens Salesforce's own form instead, with what the grid knows already filled in, such as the account on an account's page. The record you save there appears at the top of the grid.</p></div></details>
          <details class="rh-faq"><summary>Does a field's lookup filter apply in the grid?</summary><div class="rh-a"><p>Yes, when you edit the cell: a lookup with a lookup filter opens Salesforce's own lookup, which offers only the records the filter allows. A paste or an import matches a record by its Id, or by its name, looked up in Salesforce; if a required lookup filter rejects that record, Salesforce refuses it when you save, and the cell says why.</p></div></details>
        </section>

        <section id="glossary" data-anchor="glossary">
          <div class="rh-sec-head"><span class="rh-sec-num">Words</span><h2>Glossary</h2></div>
          <div class="rh-tbox"><table class="rh-ref">
            <tbody>
              <tr><td>API name</td><td>The name Salesforce uses for an object or field in code and settings, such as <code>Opportunity</code>, <code>CloseDate</code> or <code>My_Field__c</code>. Shown in Object Manager under Field Name.</td></tr>
              <tr><td>Grid Configuration</td><td>The record that describes one grid, built on the Grid Admin tab or in Setup. Its API name goes into the Rowhouse Grid component.</td></tr>
              <tr><td>Grid Admin tab</td><td>Where grids are listed, built, changed, cloned, exported, imported and archived without Setup, on its Grids page, and Rowhouse's own settings are made, on its Settings page. The gear on a grid opens the same editor for that grid.</td></tr>
              <tr><td>Archived grid</td><td>A grid taken out of use from its menu on the Grid Admin tab, without deleting it: listed under Archived grids in the Grids page's side navigation, refused by the pages that show it, and restored from there. Deleting it for good is done in Setup.</td></tr>
              <tr><td>Grid Guide tab</td><td>This guide. Everyone with Rowhouse Grid User can open it in the Rowhouse app, from the App Launcher or from <b>Help</b> (?) on a grid; its pages for admins show to Rowhouse Grid Admin.</td></tr>
              <tr><td>Rowhouse app</td><td>The Lightning app, with the Rowhouse logo, that holds the Grid Guide (where it opens), Grid Admin and Grid Edit Logs tabs. Rowhouse Grid User shows it with the Grid Guide only; Rowhouse Grid Admin adds the other two.</td></tr>
              <tr><td>Rowhouse Grid</td><td>The Lightning component you drag onto a page in Lightning App Builder.</td></tr>
              <tr><td>Unsaved edit</td><td>A change shown in its cell, shaded yellow, not yet saved to Salesforce.</td></tr>
              <tr><td>Save bar</td><td>The light-blue bar that floats at the bottom of the grid while something is unsaved: the count of unsaved changes, and under it Undo, Redo, Cancel and Save.</td></tr>
              <tr><td>Range</td><td>A rectangle of cells selected with Shift, for copy, paste, fill down and clear.</td></tr>
              <tr><td>Row number</td><td>A row's place in the list, 1, 2, 3 down the grid's left edge, as in a list view. Not a record number: sorting or searching numbers the rows again. A row with errors shows its error icon just before it.</td></tr>
              <tr><td>Selected rows</td><td>Rows selected in the checkbox column, for Update field, Delete and actions, and an edit to every selected row (<b>Update N selected items</b>).</td></tr>
              <tr><td>Row menu</td><td>The ▾ at a row's end: Edit, Delete and Change Owner, as on a list view, then the admin's actions.</td></tr>
              <tr><td>Charts</td><td>The toolbar's chart icon, which opens a chart of every matching record beside the grid.</td></tr>
              <tr><td>New row</td><td>A row that <b>New</b> adds at the top of the grid, marked New where a row number goes. It is not a record until Save creates it; Undo or Cancel takes it away.</td></tr>
              <tr><td>Display rule</td><td>A highlight (a color, bold, an icon or a data bar) that shows when a field meets a test or a formula is true, explained in the Display Key.</td></tr>
              <tr><td>Display Key</td><td>The swatch icon in a grid's toolbar, after Charts where the grid has them, that opens a key of what each display rule's look means.</td></tr>
              <tr><td>Grid Filter</td><td>A condition every row of a grid must meet, set by the admin, shown to users as a locked chip.</td></tr>
              <tr><td>Formula column</td><td>A column the grid works out from other fields, in the syntax of a formula field. Read-only.</td></tr>
              <tr><td>Field of a related record</td><td>A column for a field of the record a lookup points to, such as <code>Account.Industry</code> on a contact, headed <b>Account: Industry</b>. Changing it changes that record, on every row that shares it.</td></tr>
              <tr><td>Record Page Field</td><td>On a Grid Configuration, the lookup that links the grid's records to the record page it is placed on.</td></tr>
              <tr><td>Grid User Layout</td><td>The private record that keeps one user's layout of one grid, and which of its saved views they pinned; Reset layout puts back the admin's layout and keeps their views.</td></tr>
              <tr><td>Saved view (Grid View)</td><td>A named way of looking at a grid, as a list view is: its columns, grouping, filters and chart. Its owner's alone until they share it with all users or with roles and public groups; only its owner can change it.</td></tr>
              <tr><td>Filter logic</td><td>How a user's filters join, by number: <code>1 AND (2 OR 3)</code>. Without it every filter must hold.</td></tr>
              <tr><td>Group, subtotal, Total row</td><td>Rows gathered by a column's value, with figures for each group; the Total row covers the whole list.</td></tr>
              <tr><td>Child table</td><td>A tab of related records under a row, itself a full grid.</td></tr>
              <tr><td>Action</td><td>A flow or quick action run from a row's menu, or a flow run on the selected rows.</td></tr>
              <tr><td>Grid Edit Log</td><td>Where the audit trail is kept, one entry per change, when a grid has Log Changes selected. Entries are kept forever unless an admin chooses a period on the Grid Admin tab; then a clean-up deletes older ones each night.</td></tr>
              <tr><td>Rowhouse Setting</td><td>The one record, named Default, of settings for Rowhouse as a whole: for now, how long Grid Edit Log keeps its entries. Set on the Grid Admin tab's Settings page.</td></tr>
              <tr><td>Rowhouse Grid User · Diagnostics · Admin</td><td>The three permission sets: the first for everyone who uses a grid, the second for troubleshooting, the third for whoever builds grids.</td></tr>
            </tbody></table></div>
