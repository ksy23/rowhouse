        <section id="goal" data-anchor="goal">
          <div class="rh-persona"><span class="rh-avatar rh-c">HL</span><div><b>Hannah Lowell, Account Manager</b><span>Prepares quarterly business reviews. Wants each account's people and deals one click away, and to fix a title or a close date without leaving the list.</span></div></div>

          <p class="rh-sec-sub">Three grids: one of accounts, and two that appear as tabs under each account row. The two child grids are ordinary Grid Configurations; a Grid Child Table record links each one to the account grid.</p></div>

        <section id="children" data-anchor="children">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. Two child grids</h2>
          <p class="rh-sec-sub">Build the grids that go in the tabs first, so they can be chosen when you link them. They never need a page of their own.</p></div>
          <h3>Key Account Contacts</h3>
          <ol class="rh-tut">
            <li><b>Create the Grid Configuration.</b> In Setup, type <span class="rh-v rh-plain">Custom Metadata Types</span> in the Quick Find box and click <span class="rh-ui">Custom Metadata Types</span>. Beside <span class="rh-ui">Grid Configuration</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>, and fill in:
              <table class="rh-fields"><tbody>
                <tr><td>Label</td><td><span class="rh-v">Key Account Contacts</span><button class="rh-copy" data-copy="Key Account Contacts" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Key_Account_Contacts</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Contact</span></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">LastName</span></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Ascending</span></td></tr>
              </tbody></table> Save.</li>
            <li><b>Add four Grid Columns</b>, each with <span class="rh-v">Key Account Contacts</span> in Grid Configuration:
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref"><thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th></tr></thead><tbody>
                <tr><td>Key Account Contacts Name<br><span class="rh-d">Key_Account_Contacts_Name</span></td><td class="rh-d">Name</td><td>Name</td><td class="rh-d">10</td><td>—</td></tr>
                <tr><td>Key Account Contacts Title<br><span class="rh-d">Key_Account_Contacts_Title</span></td><td class="rh-d">Title</td><td></td><td class="rh-d">20</td><td class="rh-tick">✓</td></tr>
                <tr><td>Key Account Contacts Email<br><span class="rh-d">Key_Account_Contacts_Email</span></td><td class="rh-d">Email</td><td></td><td class="rh-d">30</td><td class="rh-tick">✓</td></tr>
                <tr><td>Key Account Contacts Phone<br><span class="rh-d">Key_Account_Contacts_Phone</span></td><td class="rh-d">Phone</td><td>Phone</td><td class="rh-d">40</td><td class="rh-tick">✓</td></tr>
              </tbody></table></div></li>
          </ol>
          <h3>Key Account Deals</h3>
          <ol class="rh-tut">
            <li><b>Create the Grid Configuration:</b>
              <table class="rh-fields"><tbody>
                <tr><td>Label</td><td><span class="rh-v">Key Account Deals</span><button class="rh-copy" data-copy="Key Account Deals" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Key_Account_Deals</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Opportunity</span></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">CloseDate</span></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Ascending</span></td></tr>
              </tbody></table> Save.</li>
            <li><b>Add four Grid Columns</b>, each with <span class="rh-v">Key Account Deals</span> in Grid Configuration:
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref"><thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th><th>More</th></tr></thead><tbody>
                <tr><td>Key Account Deals Name<br><span class="rh-d">Key_Account_Deals_Name</span></td><td class="rh-d">Name</td><td>Opportunity</td><td class="rh-d">10</td><td>—</td><td></td></tr>
                <tr><td>Key Account Deals Stage<br><span class="rh-d">Key_Account_Deals_Stage</span></td><td class="rh-d">StageName</td><td></td><td class="rh-d">20</td><td class="rh-tick">✓</td><td></td></tr>
                <tr><td>Key Account Deals Amount<br><span class="rh-d">Key_Account_Deals_Amount</span></td><td class="rh-d">Amount</td><td></td><td class="rh-d">30</td><td class="rh-tick">✓</td><td>Subtotal <span class="rh-v rh-plain">Sum</span></td></tr>
                <tr><td>Key Account Deals Close Date<br><span class="rh-d">Key_Account_Deals_Close_Date</span></td><td class="rh-d">CloseDate</td><td></td><td class="rh-d">40</td><td class="rh-tick">✓</td><td></td></tr>
              </tbody></table></div></li>
          </ol>
        </section>

        <section id="parent" data-anchor="parent">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. The account grid</h2></div>
          <ol class="rh-tut">
            <li><b>Create the Grid Configuration:</b>
              <table class="rh-fields"><tbody>
                <tr><td>Label</td><td><span class="rh-v">Key Accounts</span><button class="rh-copy" data-copy="Key Accounts" type="button">Copy</button></td></tr>
                <tr><td>Grid Configuration Name</td><td><span class="rh-v">Key_Accounts</span></td></tr>
                <tr><td>Object API Name</td><td><span class="rh-v">Account</span></td></tr>
                <tr><td>Default Sort Field</td><td><span class="rh-v">Name</span></td></tr>
                <tr><td>Default Sort Direction</td><td><span class="rh-v">Ascending</span></td></tr>
                <tr><td>Frozen Columns</td><td><span class="rh-v">1</span></td></tr>
              </tbody></table> Save.</li>
            <li><b>Add six Grid Columns</b>, each with <span class="rh-v">Key Accounts</span> in Grid Configuration:
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref"><thead><tr><th>Label · Name</th><th>Field API Name</th><th>Column Label</th><th>Sort Order</th><th>Editable</th><th>More</th></tr></thead><tbody>
                <tr><td>Key Accounts Name<br><span class="rh-d">Key_Accounts_Name</span></td><td class="rh-d">Name</td><td></td><td class="rh-d">10</td><td>—</td><td></td></tr>
                <tr><td>Key Accounts Type<br><span class="rh-d">Key_Accounts_Type</span></td><td class="rh-d">Type</td><td>Type</td><td class="rh-d">20</td><td class="rh-tick">✓</td><td></td></tr>
                <tr><td>Key Accounts Industry<br><span class="rh-d">Key_Accounts_Industry</span></td><td class="rh-d">Industry</td><td></td><td class="rh-d">30</td><td class="rh-tick">✓</td><td></td></tr>
                <tr><td>Key Accounts Revenue<br><span class="rh-d">Key_Accounts_Revenue</span></td><td class="rh-d">AnnualRevenue</td><td></td><td class="rh-d">40</td><td class="rh-tick">✓</td><td>Subtotal <span class="rh-v rh-plain">Sum</span></td></tr>
                <tr><td>Key Accounts Phone<br><span class="rh-d">Key_Accounts_Phone</span></td><td class="rh-d">Phone</td><td>Phone</td><td class="rh-d">50</td><td class="rh-tick">✓</td><td></td></tr>
                <tr><td>Key Accounts Owner<br><span class="rh-d">Key_Accounts_Owner</span></td><td class="rh-d">OwnerId</td><td>Owner</td><td class="rh-d">60</td><td>—</td><td></td></tr>
              </tbody></table></div></li>
          </ol>
        </section>

        <section id="links" data-anchor="links">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. Link them as tabs</h2></div>
          <ol class="rh-tut">
            <li><b>Open Grid Child Table records.</b> In <span class="rh-ui">Custom Metadata Types</span>, beside <span class="rh-ui">Grid Child Table</span>, click <span class="rh-ui">Manage Records</span>, then <span class="rh-ui">New</span>.</li>
            <li><b>Create these two:</b>
              <div class="rh-tbox" style="margin-top:12px"><table class="rh-ref"><thead><tr><th>Label · Name</th><th>Grid Configuration</th><th>Child Configuration</th><th>Relationship Field</th><th>Tab Label</th><th>Sort Order</th></tr></thead><tbody>
                <tr><td>Key Accounts Contacts<br><span class="rh-d">Key_Accounts_Contacts</span></td><td>Key Accounts</td><td>Key Account Contacts</td><td class="rh-d">AccountId</td><td>Contacts</td><td class="rh-d">10</td></tr>
                <tr><td>Key Accounts Deals<br><span class="rh-d">Key_Accounts_Deals</span></td><td>Key Accounts</td><td>Key Account Deals</td><td class="rh-d">AccountId</td><td>Opportunities</td><td class="rh-d">20</td></tr>
              </tbody></table></div></li>
          </ol>
          <div class="rh-check rh-why">Relationship Field is the field on the <i>child</i> record that points to the account: AccountId on both Contact and Opportunity. Rowhouse uses it to show each account's own records, and to fill it in on records imported into the tab.</div>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. The page</h2></div>
          <ol class="rh-tut">
            <li><b>Create an App page</b> in Lightning App Builder, as in the other tutorials: <span class="rh-ui">New</span> › <span class="rh-ui">App Page</span> › Label <span class="rh-v">Key Accounts</span> › <span class="rh-ui">One Region</span>.</li>
            <li><b>Add the grid.</b> Drag <span class="rh-ui">Rowhouse Grid</span> onto the page and enter <span class="rh-v">Key_Accounts</span><button class="rh-copy" data-copy="Key_Accounts" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>. Only the account grid is placed; its tabs come with it.</li>
            <li><b>Save and activate</b>, adding the page to the <span class="rh-ui">Sales</span> app.</li>
          </ol>
        </section>

        <section id="open" data-anchor="open">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Hannah</span><h2>5. Open an account</h2></div>
          <ol class="rh-tut">
            <li><b>Open the grid.</b> In the Sales app, click <span class="rh-ui">Key Accounts</span>.
              <div class="rh-check">A column of toggles beside the account names. Accounts with related records show a count beside their toggle; accounts with none have no toggle.</div></li>
            <li><b>Open one.</b> Click the toggle beside an account with contacts and opportunities (we use <i>Edge Communications</i>).
              <div class="rh-check">A panel opens under the row, with a blue bar down its left edge and two tabs: <b>Contacts (2)</b> and <b>Opportunities (4)</b>. It opens on the first tab with records.</div></li>
            <li><b>Look at the deals.</b> Click the <span class="rh-ui">Opportunities</span> tab. The deals have a Total row with the sum of their amounts.</li>
          </ol>
        </section>

        <section id="edit" data-anchor="edit">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Hannah</span><h2>6. Edit in a tab</h2></div>
          <ol class="rh-tut">
            <li><b>Fix a title.</b> Back on the <span class="rh-ui">Contacts</span> tab, click a contact's Title once and type a new one (we use <span class="rh-v">SVP, Global Procurement</span> for Rose Gonzalez); what you type replaces the old title. Press <kbd>Enter</kbd>.
              <div class="rh-check">The tab's own Save bar appears inside the panel. Each tab saves on its own.</div></li>
            <li><b>Save it.</b> Click that Save bar's <span class="rh-ui">Save</span>.</li>
            <li><b>Close the account.</b> Click the account's toggle again.</li>
          </ol>
        </section>

        <section id="keys" data-anchor="keys">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Hannah</span><h2>7. The same from the keyboard</h2></div>
          <ol class="rh-tut">
            <li>Click any cell of the account grid, then use <kbd>↑</kbd> <kbd>↓</kbd> to reach an account with a toggle, and <kbd>←</kbd> until you reach the toggle itself, at the left of the row. Press <kbd>Enter</kbd> to open it.</li>
            <li>Press <kbd>↓</kbd> to move onto the panel, then <kbd>Enter</kbd> to go into the tab's grid. Move and edit there as in any grid.</li>
            <li>Press <kbd>Esc</kbd> to come back out to the panel, and <kbd>↑</kbd> to return to the account's row.</li>
          </ol>
        </section>

        <section id="learned" data-anchor="learned">
          <div class="rh-sec-head"><span class="rh-sec-num">Wrap-up</span><h2>What you learned</h2></div>

            <div class="rh-tile rh-teal"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="10" width="7" height="5" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/><path d="M6.5 8v10.5H14M6.5 12.5H14"/></svg></div><h4>Child tables</h4><p>Grids inside rows, each with its own columns, rules and Save bar.</p></div>
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg></div><h4>Reusable grids</h4><p>A configuration can be a page's grid and another grid's tab at once.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></div><h4>Keys across levels</h4><p>Enter goes in, Esc comes out, and the arrows never get lost.</p></div>
