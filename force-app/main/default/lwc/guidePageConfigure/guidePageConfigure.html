          <h3 style="margin-top:22px">The same setting, in each place</h3>
          <p>The tables further down use Setup's field names. On the Grid Admin tab they read:</p>

          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Who.</b> The <b>Rowhouse Grid Admin</b> permission set adds the <b>Grid Admin</b> and <b>Grid Edit Logs</b> tabs to the <b>Rowhouse</b> app, beside its <b>Grid Guide</b> (where it opens and all that users see in it), and shows the gear beside each grid's Refresh button. Saving also needs <b>Customize Application</b>. Without it you can open a grid and try changes, but <b>Save</b> and <b>New grid</b> stay gray, and the editor says why.</li>
            <li><b>Checked as you go.</b> A moment after each change, the editor checks the grid with the same code the grid itself uses. Problems that would stop it (no title, a field the object does not have, the same field twice) keep Save gray; settings the grid would leave out are listed as warnings. A field that field-level security hides from you is a warning too, not a problem: the people who can read it see its column.</li>
            <li><b>What you can choose from.</b> The object list shows the objects you can read. A field hidden from you is offered only if you have <b>View Setup and Configuration</b>, as Setup lists it for you; without it, the editor offers only the fields you can read.</li>
            <li><b>Close or Cancel.</b> On the Grid Admin tab, Close and Save sit at the top, beside the grid's name; from the gear, at the bottom. The button beside Save reads <b>Close</b> while nothing has changed and <b>Cancel</b> once something has. Leaving with changes, by that button or by <b>Grid Admin</b> or <b>Grids</b> above the name, asks <i>Discard your changes?</i>, with <b>Keep editing</b> and <b>Discard</b>.</li>
            <li><b>Saving takes a few seconds.</b> It is a deployment, the same as saving in Setup. Saved from the gear, the grid then loads again with the change.</li>
            <li><b>Nothing is deleted.</b> A saved column, filter, action or child table has an <b>On</b> switch instead (its <b>Inactive</b> field); a display rule's switch is its <b>Active</b> field. An entry added and not yet saved can be removed. A whole grid is archived instead (its <b>Archived</b> field), from its menu on the Grids page, and <b>Delete in Setup</b> there lists its records to delete in Setup (<a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=features&amp;rowhouse__section=admin-rows" data-page="features" data-section="admin-rows">Features › Clone, archive and delete a grid</a>).</li>
            <li><b>Fixed once saved:</b> a grid's API name and its object. For another object, build another grid.</li>
            <li><b>Help as you build.</b> On the Grid Admin tab, the Grid Guide sits beside the editor's tabs and follows them: Columns shows the Grid Column, Display rules the Grid Format Rule, and so on. In a narrower window it moves under the tabs, and a table too wide for the window scrolls sideways. <b>Open ↗</b> opens that record's part of this reference in a new browser tab, so the grid you are building stays as it is. <b>Hide help</b> folds it away, and this browser remembers; <b>Show help</b>, beside Close, brings it back. From the gear, the <b>?</b> beside each tab's introduction opens the same part of this reference. <b>Grid Guide</b>, at the top of the tab, opens Get started in a new browser tab; <b>Get started →</b> on the Grids page opens it in place.</li>
            <li><b>One setting for Rowhouse as a whole.</b> On the tab's <b>Settings</b> page, <b>Grid Edit Log Retention</b> sets how long the audit trail keeps its entries (<a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=features&amp;rowhouse__section=audit-retention" data-page="features" data-section="audit-retention">Features › Audit trail</a>). It is the <b>Log Retention (days)</b> field of the <b>Rowhouse Setting</b> record named <span class="rh-v rh-plain">Default</span>, which Setup also shows, but set it on the tab: saving there is what starts or stops the nightly clean-up. A period saved in Setup only, the tab says, is not acted on until it is saved on the tab.</li>
          </ul>

        <section id="config" data-anchor="config">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 1 of 6</span><h2>Grid Configuration</h2>
          <p class="rh-sec-sub">One per grid. Its Label is the grid's title, and its API name (Grid Configuration Name) is what you type into the Rowhouse Grid component.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Configuration__mdt" data-anchor="ref-Grid_Configuration__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>The grid&#x27;s title, shown at the top of the grid. Required.</td></tr>
        <tr><td>Grid Configuration Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>The API name you enter in the Rowhouse Grid component in Lightning App Builder. Filled in from the Label. Required.</td></tr>
        <tr><td>Archived<br><code>Archived__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Takes the grid out of use without deleting it. An archived grid is listed only under Archived on the Grid Admin tab, a page that shows it says it is archived, and another grid&#x27;s child table that shows it is hidden. Restore it on the Grid Admin tab. To delete it for good, delete its records in Setup.</td></tr>
        <tr><td>Object API Name<br><code>Object_API_Name__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the object this grid shows, without a namespace prefix.</td></tr>
        <tr><td>Page Size<br><code>Page_Size__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>How many rows the first page loads, from 1 to 2,000. Default 200. Later pages load 2,000 rows at a time as the user scrolls.</td></tr>
        <tr><td>Default Sort Field<br><code>Default_Sort_Field__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the field the grid is sorted by when it opens, without a namespace prefix.</td></tr>
        <tr><td>Default Sort Direction<br><code>Default_Sort_Direction__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">Ascending</td><td>The direction of the sort the grid opens with: ascending or descending.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Ascending</span><span class="rh-ptag">Descending</span></div></td></tr>
        <tr><td>Height (px)<br><code>Height_Px__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The grid&#x27;s height in pixels. If blank, the grid fills the window from its top edge to the bottom of the screen. Values below 160 are treated as 160.</td></tr>
        <tr><td>Frozen Columns<br><code>Frozen_Columns__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>How many columns, counted from the left, stay in place when the grid scrolls sideways. Blank or 0 freezes none.</td></tr>
        <tr><td>Show Row Numbers<br><code>Show_Row_Numbers__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Checked: the rows are numbered down the grid&#x27;s left edge, as a list view numbers them: 1, 2, 3 in the order shown. Uncheck to hide the numbers, for example on a narrow grid on a record page.</td></tr>
        <tr><td>Record Page Field<br><code>Record_Page_Field__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>On a record page, the grid shows only the records whose field of this name points to the page&#x27;s record, such as AccountId for a Contacts grid on Account pages. It must be a lookup of the grid&#x27;s object. Leave blank to show the same records on every page; on App and Home pages it has no effect.</td></tr>
        <tr><td>Allow Inline Edit<br><code>Allow_Inline_Edit__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Lets users edit values directly in the grid and save them. Only columns marked Editable can be edited, and users need edit access to each field and record.</td></tr>
        <tr><td>Allow New Records<br><code>Allow_New_Records__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Checked: the grid has a New button for users who can create its records, and may allow import. The new record is a row at the top, saved with the other changes; Salesforce&#x27;s New form opens instead when the grid can&#x27;t fill in all it needs.</td></tr>
        <tr><td>Allow CSV Export<br><code>Allow_CSV_Export__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Lets users export the grid&#x27;s rows to a CSV file.</td></tr>
        <tr><td>Allow Mass Delete<br><code>Allow_Mass_Delete__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Lets users delete the rows they select, after confirming. Deleted records go to the Recycle Bin. Users also need delete access to the object and to each record.</td></tr>
        <tr><td>Allow Import<br><code>Allow_Import__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Lets users import a CSV or Excel file. Rows with a record Id update that record; rows without one create a new record, so Allow New Records must be checked too. Only the grid&#x27;s editable columns are written; users need edit or create access to the object.</td></tr>
        <tr><td>Log Changes<br><code>Log_Changes__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Keeps an audit trail for this grid. Every field change, and every record created, deleted or used in an action, is recorded in Grid Edit Log with the user and time. If a change cannot be logged, it is not made. Users need the Rowhouse Grid User permission set to write to the log.</td></tr>
        </tbody></table></div>
          <div class="rh-call" style="margin-top:18px"><span class="rh-k">Defaults worth knowing</span>
            <p>Page Size blank loads the first 200 rows, then 2,000 at a time up to 10,000 as the grid opens, then more as users scroll, up to 100,000. Height blank fills the window. A Height under 160 is treated as 160. Show Row Numbers starts selected, so the rows are numbered, as a list view's are. Allow Inline Edit and Allow CSV Export are selected by default; Allow Mass Delete, Allow Import and Log Changes are not, because each can change many records at once.</p></div>
          <div class="rh-call rh-s" style="margin-top:12px"><span class="rh-k">On a record page: Record Page Field</span>
            <p>Placed on a record page, a grid with a <b>Record Page Field</b> shows only the records whose field points to that page's record, like a related list: a Contacts grid with <span class="rh-v rh-plain">AccountId</span>, on Account pages, shows that account's contacts. An import there fills the field in on every record it creates. On the Grid Admin tab the list offers the object's lookups to one object; in Setup any lookup of the grid's object works. The page must be of an object the lookup points to: on another object's page the grid says so instead of showing rows. On App and Home pages, or with the field blank, the grid shows its whole list.</p></div>
        </section>

        <section id="column" data-anchor="column">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 2 of 6</span><h2>Grid Column</h2>
          <p class="rh-sec-sub">One per column, left to right by Sort Order. A column the user cannot read (field-level security) is left out for that user, silently.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Column__mdt" data-anchor="ref-Grid_Column__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Names the record in Setup only; users never see it. Start it with the grid&#x27;s name. Required.</td></tr>
        <tr><td>Grid Column Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Unique across all Grid Column records. Required.</td></tr>
        <tr><td>Grid Configuration<br><code>Grid_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid this column belongs to.</td></tr>
        <tr><td>Field API Name<br><code>Field_API_Name__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the field shown in this column, without a namespace prefix; or a field of a related record, reached through up to five lookups, such as Account.Industry.</td></tr>
        <tr><td>Column Label<br><code>Column_Label__c</code></td><td class="rh-d">Text (80)</td><td class="rh-d">—</td><td>The column header. If blank, the field&#x27;s label is used.</td></tr>
        <tr><td>Cell Type<br><code>Cell_Type__c</code></td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>How the column shows and edits its values, for example text, number, currency, percent, date, checkbox or picklist. If blank, it is set from the field&#x27;s type, which is right for almost every field.</td></tr>
        <tr><td>Sort Order<br><code>Sort_Order__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The column&#x27;s position, from left to right.</td></tr>
        <tr><td>Inactive<br><code>Inactive__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Check to turn the column off without deleting it. The Grid Admin tab turns columns off this way, since it cannot delete Custom Metadata records. A record that does not mention this field stays on.</td></tr>
        <tr><td>Width (px)<br><code>Width_Px__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The column&#x27;s width in pixels. If blank, the width suits the column&#x27;s type and values. A column is never narrower than its type needs, and users can resize it.</td></tr>
        <tr><td>Editable<br><code>Editable__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Lets users edit this column in the grid. The grid must allow inline edit, and users need edit access to the field and the record. Rich text is always read-only in the grid; long text is edited in a text area that first reads the whole value.</td></tr>
        <tr><td>Sortable<br><code>Sortable__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Lets users sort the grid by this column. Fields that Salesforce cannot sort, such as long text, are never sortable.</td></tr>
        <tr><td>Wrap Text<br><code>Wrap_Text__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Shows this column&#x27;s text on up to three lines instead of cutting it off at one. Users can switch it from the column menu; the grid keeps each user&#x27;s choice until they click Reset layout.</td></tr>
        <tr><td>Always Shown<br><code>Always_Shown__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Keeps this column on screen for every user. Users can hide, show and move the other columns from Choose columns, a column&#x27;s menu or by dragging its header; they can still move this one, but not hide it.</td></tr>
        <tr><td>Group Level<br><code>Group_Level__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>Groups the grid by this column when it opens: 1 for the outermost grouping, 2 and 3 for groupings inside it. Leave blank not to group by this column. Users can change the grouping from the column menu; the grid keeps each user&#x27;s choice until they click Reset layout.</td></tr>
        <tr><td>Group Date Unit<br><code>Group_Date_Unit__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>For a date or date/time column used for grouping: group by day, week, month, quarter, year, fiscal quarter or fiscal year. Month if blank. A week starts on the first day of the week in the user&#x27;s locale; fiscal periods follow the org&#x27;s fiscal year settings. Users can change it from the Group column&#x27;s menu.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Day</span><span class="rh-ptag">Week</span><span class="rh-ptag">Month</span><span class="rh-ptag">Quarter</span><span class="rh-ptag">Year</span><span class="rh-ptag">Fiscal Quarter</span><span class="rh-ptag">Fiscal Year</span></div></td></tr>
        <tr><td>Allow Grouping<br><code>Allow_Grouping__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Lets users group by this column from its menu, without the grid opening grouped by it. Picklist, checkbox, lookup, owner, date and date/time columns are offered for grouping anyway; check this for others whose values repeat, such as a text column of regions. Numbers, long text and multi-select picklists cannot be grouped.</td></tr>
        <tr><td>Subtotal<br><code>Subtotal__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>What each group and the Total row show for this column, calculated over every matching record, not just the rows loaded. Sum and Average for numbers, currency and percent; Min and Max also for dates; Count (values that are not blank) for most columns. Leave blank to show nothing.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Sum</span><span class="rh-ptag">Average</span><span class="rh-ptag">Min</span><span class="rh-ptag">Max</span><span class="rh-ptag">Count</span></div></td></tr>
        <tr><td>Child Table<br><code>Child_Table__c</code></td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Makes this a child total column: the API name of one of this grid&#x27;s Grid Child Table records. The column shows, on each row, a total of that child table&#x27;s records for the row, worked out with the child grid&#x27;s own filters. Leave blank for a column on a field. With it, Field API Name is left blank and Child Total says what to work out.</td></tr>
        <tr><td>Child Total<br><code>Child_Total__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>For a child total column: what it works out from the child table&#x27;s records under each row: Sum, Average, Min or Max of Child Field, or Count (of the records, or with a Child Field of its values that are not blank).<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Sum</span><span class="rh-ptag">Average</span><span class="rh-ptag">Min</span><span class="rh-ptag">Max</span><span class="rh-ptag">Count</span></div></td></tr>
        <tr><td>Child Field<br><code>Child_Field__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>For a child total column: the field of the child table&#x27;s object to total, by API name, such as Amount. Sum and Average take a number, currency or percent field; Min and Max also a date or date/time. Leave blank with Count to count the records.</td></tr>
        <tr><td>Formula<br><code>Formula__c</code></td><td class="rh-d">Long text</td><td class="rh-d">—</td><td>For a formula column: a Salesforce formula, in the syntax of formula fields, that the grid works out for each row when the rows are read. A formula column has no Field API Name, needs a Column Label, is Text when Formula Type is blank, and is read only.</td></tr>
        <tr><td>Formula Type<br><code>Formula_Type__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>What a formula column&#x27;s formula returns.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Text</span><span class="rh-ptag">Number</span><span class="rh-ptag">Currency</span><span class="rh-ptag">Percent</span><span class="rh-ptag">Date</span><span class="rh-ptag">Date/Time</span><span class="rh-ptag">Checkbox</span></div></td></tr>
        <tr><td>Decimal Places<br><code>Decimal_Places__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>For a Number, Currency or Percent formula column: how many decimal places it shows. Blank shows 2.</td></tr>
        </tbody></table></div>
          <div class="rh-split" style="margin-top:18px">
            <div class="rh-call"><span class="rh-k">Who can edit a column</span><p>All four must be true: the configuration's <b>Allow Inline Edit</b> is selected; the column's <b>Editable</b> is selected; the user can edit the object and the field; and the field can be edited at all (formulas, roll-ups, auto-numbers and system fields never can, nor can rich text). Long text is edited in a text area that first reads the whole value, however long.</p></div>
            <div class="rh-call rh-s"><span class="rh-k">Lookups</span><p>For a lookup or owner field (AccountId, OwnerId), the cell shows the record's name as a link and is edited by searching. Users need read access to the target object's name to edit it. Without a Column Label the column is headed by what it points to, as a record page heads it: "Account", "Owner", not "Account ID". A lookup field with a lookup filter is edited with Salesforce's own lookup, which applies the filter. The list ends with <b>New Account</b> (the target object) for users who may create one.</p></div>
          </div>
          <div class="rh-call" style="margin-top:12px"><span class="rh-k">A field of a related record</span><p>Put the lookups first, as a report or a formula does: <span class="rh-v rh-plain">Account.Industry</span> on a Contact grid, <span class="rh-v rh-plain">Account.Owner.Email</span>, or <span class="rh-v rh-plain">My_Lookup__r.Status__c</span> for a custom lookup. Up to five lookups, each pointing to one kind of record. On the Grid Admin tab, choose the lookup in the Field list (<b>Account &gt;</b>), then the field under it. Without a Column Label the column is headed <span class="rh-v rh-plain">Account: Industry</span>. Edits are saved to the related record (<a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=features&amp;rowhouse__section=related-fields" data-page="features" data-section="related-fields">Features › Fields of a related record</a>). Default Sort Field, Grid Format Rule and Grid Filter fields take the same form. A path that cannot work is left out with a warning.</p></div>
          <div class="rh-call rh-p" style="margin-top:12px;border-left-color:var(--rh-plum);background:var(--rh-plum-soft)"><span class="rh-k" style="color:var(--rh-plum)">Formula columns</span>
            <p>Leave <b>Field API Name</b> blank and fill in <b>Formula</b>, <b>Formula Type</b> and <b>Column Label</b>: the grid works the value out for each row as it reads the rows, in the syntax of a formula field (see <a href="#formulas" data-anchor-link="formulas">Formulas</a>). <b>Decimal Places</b> sets the places of a number, currency or percent result (2 when blank). A formula column is read-only and cannot be sorted, grouped, filtered, searched or subtotaled; it exports with the rest. At most 10 formulas a grid, columns and display rules together.</p>
          </div>
          <div class="rh-call rh-s" style="margin-top:12px"><span class="rh-k">Child total columns</span>
            <p>Leave <b>Field API Name</b> blank and fill in <b>Child Table</b> (a Grid Child Table of the same grid), <b>Child Total</b> (sum, average, min, max or count) and, except for a count, <b>Child Field</b> (the child field to total), with a <b>Column Label</b>: each row then shows what its related records add up to, such as an account's number of contacts. It follows the child table's own filters. Read-only, and it cannot be sorted, grouped or filtered. A row's total is left blank when it cannot be worked out: when the child table's filter tests a field the user cannot read, or when the row has more related records than Salesforce lets one request read. At most five per grid. On the Grid Admin tab, <b>Add child total column</b>.</p>
          </div>
        </section>

        <section id="rule" data-anchor="rule">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 3 of 6</span><h2>Grid Format Rule</h2>
          <p class="rh-sec-sub">One per highlight. Rules are tested in the browser against the values the row shows, so once a user keeps an edit, the row's other colors follow it before anything is saved; the edited cell itself stays shaded as unsaved until Save. A rule with a <b>Formula</b> is the exception: it is worked out on the server for the saved record, so it changes after a save.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Format_Rule__mdt" data-anchor="ref-Grid_Format_Rule__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>What the color means, in your words. Users see it in the Display Key, in the cell&#x27;s tooltip, and screen readers read it. Required.</td></tr>
        <tr><td>Grid Format Rule Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Unique across all Grid Format Rule records. Required.</td></tr>
        <tr><td>Grid Configuration<br><code>Grid_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid this rule applies to.</td></tr>
        <tr><td>Field API Name<br><code>Field_API_Name__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the field the condition tests, without a namespace prefix. For a rule that applies to the row, the field does not need to be a column; for a rule that colors a cell, it must be one.</td></tr>
        <tr><td>Operator<br><code>Operator__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">Equals</td><td>How the field is compared with Value. Greater than, less than and Between work with numbers, dates and times; Contains with text, picklists and multi-select picklists; Starts with with text and picklists.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Equals</span><span class="rh-ptag">Does not equal</span><span class="rh-ptag">Greater than</span><span class="rh-ptag">Greater than or equal to</span><span class="rh-ptag">Less than</span><span class="rh-ptag">Less than or equal to</span><span class="rh-ptag">Between</span><span class="rh-ptag">Contains</span><span class="rh-ptag">Does not contain</span><span class="rh-ptag">Starts with</span><span class="rh-ptag">Is blank</span><span class="rh-ptag">Is not blank</span></div></td></tr>
        <tr><td>Value<br><code>Value__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>What the field is compared with. Numbers as 1234.5; dates as 2026-12-31, TODAY, TODAY+7 or TODAY-30; checkboxes as true or false; lookups and owners as a record Id, or $User for the person viewing the grid. Leave blank for Is blank and Is not blank.</td></tr>
        <tr><td>Value To<br><code>Value_To__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>For Between only: the upper end of the range. Both ends are included.</td></tr>
        <tr><td>Compare Field<br><code>Compare_Field__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>Compare the field with this field of the same record instead of with Value, such as Close Date greater than Due Date. Equals and Does not equal work for any two fields of the same kind; greater and less than for numbers, dates and times. Leave Value blank.</td></tr>
        <tr><td>Style<br><code>Style__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>How a matching cell or row looks. Colors come from the Salesforce Lightning Design System palette. On a row, the fill shows as a bar at the row&#x27;s left edge, and an icon goes before the row&#x27;s first value. A data bar shows how large a number is beside the column&#x27;s other values; it applies to a number cell only.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Green fill</span><span class="rh-ptag">Amber fill</span><span class="rh-ptag">Red fill</span><span class="rh-ptag">Purple fill</span><span class="rh-ptag">Gray fill</span><span class="rh-ptag">Red text</span><span class="rh-ptag">Green text</span><span class="rh-ptag">Gray text</span><span class="rh-ptag">Bold</span><span class="rh-ptag">Warning icon</span><span class="rh-ptag">Error icon</span><span class="rh-ptag">Success icon</span><span class="rh-ptag">Info icon</span><span class="rh-ptag">Up arrow</span><span class="rh-ptag">Down arrow</span><span class="rh-ptag">Data bar</span></div></td></tr>
        <tr><td>Apply To<br><code>Apply_To__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">Cell</td><td>Cell highlights the tested field&#x27;s cell in the row; Row highlights the whole row.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Cell</span><span class="rh-ptag">Row</span></div></td></tr>
        <tr><td>Sort Order<br><code>Sort_Order__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The order rules are applied in. When two matching rules set the same thing on a cell, such as two fills, the lower number wins.</td></tr>
        <tr><td>Active<br><code>Active__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Ticked</td><td>Uncheck to turn the rule off without deleting it.</td></tr>
        <tr><td>Formula<br><code>Formula__c</code></td><td class="rh-d">Long text</td><td class="rh-d">—</td><td>A Salesforce formula that returns true or false, worked out on the server for each row when the rows are read. With a Formula, Operator and Value are ignored; Field names the cell to color, or leave it blank with Apply To set to Row.</td></tr>
        </tbody></table></div>
          <div class="rh-call rh-p" style="margin-top:18px;border-left-color:var(--rh-plum);background:var(--rh-plum-soft)"><span class="rh-k" style="color:var(--rh-plum)">When two rules apply to one cell</span>
            <p>A style sets one of five things: the <b>fill</b>, the <b>text color</b>, the <b>weight</b> (bold), an <b>icon</b> or a <b>data bar</b>. For each of the five, the first matching rule wins, first meaning the lowest Sort Order. So a red-text rule, a green-fill rule and a warning icon can all show on one cell, but of two fills only the first shows. A Row rule counts for every cell in its row; put a Cell rule before it to let it show through.</p></div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Between:</b> Operator Between, Value the low end and <b>Value To</b> the high end, both included. For numbers, dates, date/times and times. On the Grid Admin tab, choosing Between adds a second box, <i>and</i>, under Value.</li>
            <li><b>Two fields:</b> fill in <b>Compare Field</b> instead of Value, and the rule compares Field with that field of the same record: <span class="rh-v rh-plain">Amount</span> Greater than <span class="rh-v rh-plain">Budget__c</span>. Equals, Does not equal and the four comparisons; both fields of the same kind (two numbers, two dates, two text fields), but not multi-select picklists on the Grid Admin tab. The compare field need not be a column. On the tab, the list under Condition says <i>A value</i>; choose <i>Field: …</i> there instead.</li>
            <li><b>A formula:</b> fill in <b>Formula</b>, true or false, such as <span class="rh-v rh-plain">Amount &gt; Budget__c * 1.1</span>. Operator and Value are then not used, and Field is only the cell the rule colors; leave it blank, with Apply To Row, for the whole row. On the tab, choose <b>Formula is true</b> in Condition: a formula box takes Value's place, and Field offers <i>None (a row rule)</i>.</li>
          </ul>
        </section>

        <section id="filter" data-anchor="filter">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 4 of 6</span><h2>Grid Filter</h2>
          <p class="rh-sec-sub">One per condition every row must meet. The grid shows only the records that meet all its filters that are on; users see them as locked chips above the grid and cannot remove them.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Filter__mdt" data-anchor="ref-Grid_Filter__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Names the filter in Setup and on the Grid Admin tab (its Name, which the tab fills in from the field and condition when left blank). Users never see it: the grid shows the condition itself, such as &quot;Email is not blank&quot;. Required.</td></tr>
        <tr><td>Grid Filter Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Unique across all Grid Filter records. Required.</td></tr>
        <tr><td>Grid Configuration<br><code>Grid_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid this filter narrows.</td></tr>
        <tr><td>Field API Name<br><code>Field_API_Name__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the field the filter tests, without a namespace prefix. The field does not need to be a column, but SOQL must be able to filter on it, and users who cannot read it cannot open the grid.</td></tr>
        <tr><td>Operator<br><code>Operator__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">Equals</td><td>How the field is compared with Value. Greater than, less than and Between work with numbers, dates and times; Contains and Does not contain work with text, picklists and multi-select picklists; Starts with works with text and picklists.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Equals</span><span class="rh-ptag">Does not equal</span><span class="rh-ptag">Greater than</span><span class="rh-ptag">Greater than or equal to</span><span class="rh-ptag">Less than</span><span class="rh-ptag">Less than or equal to</span><span class="rh-ptag">Between</span><span class="rh-ptag">Contains</span><span class="rh-ptag">Does not contain</span><span class="rh-ptag">Starts with</span><span class="rh-ptag">Is blank</span><span class="rh-ptag">Is not blank</span></div></td></tr>
        <tr><td>Value<br><code>Value__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>What the field is compared with. Numbers as 1234.5; dates as 2026-12-31, TODAY, TODAY+7 or TODAY-30; checkboxes as true or false; picklists by label or API name; lookups and owners as a record Id, or $User for the person viewing the grid. Leave blank for Is blank and Is not blank.</td></tr>
        <tr><td>Value To<br><code>Value_To__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>For Between only: the upper end of the range. Both ends are included.</td></tr>
        <tr><td>Sort Order<br><code>Sort_Order__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The order filters are listed in on the Grid Admin tab. Every active filter applies, whatever its order.</td></tr>
        <tr><td>Inactive<br><code>Inactive__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Check to turn the filter off without deleting it. The Grid Admin tab turns filters off this way, since it cannot delete Custom Metadata records.</td></tr>
        </tbody></table></div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Operators and values</b> are the format rules' (<a href="#operators" data-anchor-link="operators">below</a>), Between included: a picklist value by label or API name, a date as <span class="rh-v rh-plain">2026-12-31</span> or <span class="rh-v rh-plain">TODAY-30</span>, a lookup as a record Id or <span class="rh-v rh-plain">$User</span> ("my records").</li>
            <li><b>A filter that cannot work stops the grid</b> with a message naming the filter. It is never skipped, as a display rule is, because skipping it would show records you meant to keep out. A user who cannot read a filter's field cannot open the grid.</li>
            <li><b>Filters narrow; they are not security.</b> Who can see a record is still decided by sharing and field-level security.</li>
            <li><b>Users add their own</b> from each column's ▾ menu, for as long as they stay on the page (see the <a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=using&amp;rowhouse__section=find" data-page="using" data-section="find">user guide</a>).</li>
          </ul>
        </section>

        <section id="child" data-anchor="child">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 5 of 6</span><h2>Grid Child Table</h2>
          <p class="rh-sec-sub">One per tab under each row. The tab is a full grid of its own Grid Configuration, limited to the records whose Relationship Field points to that row.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Child__mdt" data-anchor="ref-Grid_Child__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Names the record in Setup. The tab shows Tab Label, or the child configuration&#x27;s label. Required.</td></tr>
        <tr><td>Grid Child Table Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Unique across all Grid Child Table records. Required.</td></tr>
        <tr><td>Grid Configuration<br><code>Grid_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid whose rows show this tab.</td></tr>
        <tr><td>Child Configuration<br><code>Child_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid configuration shown in the tab. Its columns, editing, mass actions, import and grouping settings all apply, limited to the records related to the row.</td></tr>
        <tr><td>Relationship Field<br><code>Relationship_Field__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of the lookup or master-detail field on the child grid&#x27;s object that points to the parent row, without a namespace prefix. For example, AccountId for Contacts shown under Accounts.</td></tr>
        <tr><td>Tab Label<br><code>Tab_Label__c</code></td><td class="rh-d">Text (80)</td><td class="rh-d">—</td><td>The tab&#x27;s name. If blank, the child grid configuration&#x27;s label is used.</td></tr>
        <tr><td>Height (px)<br><code>Height_Px__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The child grid&#x27;s height in pixels, in the panel under an open row; the panel grows to fit it. If blank, 388 pixels under a row of a top-level grid and 168 one level down. Values below 160 are treated as 160. A child grid with fewer rows takes less room; one with more scrolls inside.</td></tr>
        <tr><td>Sort Order<br><code>Sort_Order__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The order tabs appear in, lowest first. The panel opens on the first tab that has records.</td></tr>
        <tr><td>Inactive<br><code>Inactive__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Check to turn the child table off without deleting it. The Grid Admin tab turns child tables off this way, since it cannot delete Custom Metadata records. A record that does not mention this field stays on.</td></tr>
        </tbody></table></div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Build the child grid first</b>: a Grid Configuration and columns for the child object, like any other grid. It need not be placed on any page.</li>
            <li><b>Three levels at most</b>: a grid, its child tables, and theirs. The third level has no toggle of its own.</li>
            <li><b>Height</b> is the most the tab's panel grows to, at least 160 pixels; empty, the panel fits the records up to its level's usual height.</li>
            <li><b>Everything the child configuration allows</b> works in the tab: editing, sorting, formatting, grouping, mass changes, import and actions. An import into a tab fills in the parent on every new record.</li>
          </ul>
        </section>

        <section id="action" data-anchor="action">
          <div class="rh-sec-head"><span class="rh-sec-num">Record 6 of 6</span><h2>Grid Action</h2>
          <p class="rh-sec-sub">One per action. Rowhouse checks the type and the names when the grid loads; whether the flow or class exists is found out when someone runs it.</p></div>
          <div class="rh-tbox"><table class="rh-ref" id="ref-Grid_Action__mdt" data-anchor="ref-Grid_Action__mdt"><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>
        <tr><td>Label</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>What the menu item or button says. Required.</td></tr>
        <tr><td>Grid Action Name</td><td class="rh-d">Text (40)</td><td class="rh-d">—</td><td>Unique across all Grid Action records. Also what the audit log records. Required.</td></tr>
        <tr><td>Grid Configuration<br><code>Grid_Configuration__c</code></td><td class="rh-d">Lookup to Grid Configuration</td><td class="rh-d">—</td><td>The grid that offers this action.</td></tr>
        <tr><td>Action Type<br><code>Action_Type__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">—</td><td>What kind of action this is. A screen flow opens on a page of its own, then returns to the grid. Autolaunched flows, Apex actions and quick actions run on the server for each record, 50 records per call, with the permissions they are built with.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Screen flow</span><span class="rh-ptag">Autolaunched flow</span><span class="rh-ptag">Invocable Apex action</span><span class="rh-ptag">Quick action</span></div></td></tr>
        <tr><td>Action Name<br><code>Action_Name__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>The API name of what runs: the flow, the Apex class with the invocable method, or the quick action. For an object&#x27;s quick action use Object.ActionName (for example Account.NewCase); for a global quick action use the name alone (for example LogACall).</td></tr>
        <tr><td>Input Name<br><code>Input_Name__c</code></td><td class="rh-d">Text (80)</td><td class="rh-d">—</td><td>The name of the input that receives the record Id. If blank: recordId for a flow, contextId for a quick action, and the only input of an Apex action. A screen flow run on selected rows receives their Ids in a text collection variable named ids, as flows launched from a list view do.</td></tr>
        <tr><td>Show In<br><code>Show_In__c</code></td><td class="rh-d">Picklist</td><td class="rh-d">Row menu and selection</td><td>Where the action is offered: each row&#x27;s menu, the bar that appears when rows are selected, or both. Blank means both.<div class="rh-pill-row rh-pill-row-ref"><span class="rh-ptag">Row menu and selection</span><span class="rh-ptag">Row menu</span><span class="rh-ptag">Selection</span></div></td></tr>
        <tr><td>Confirmation<br><code>Confirmation__c</code></td><td class="rh-d">Text (255)</td><td class="rh-d">—</td><td>A question to ask before the action runs, such as &quot;Send the renewal quote?&quot;. If blank, an action on selected rows still asks and names them; one on a single row runs at once unless the row has unsaved changes. Screen flows never ask.</td></tr>
        <tr><td>Required Permission<br><code>Required_Permission__c</code></td><td class="rh-d">Text (80)</td><td class="rh-d">—</td><td>The API name of a custom permission. If set, only users with that permission see and can run the action. If blank, everyone who can use the grid and read the records can. Rowhouse does not check access to the flow, class or quick action itself, so use this to restrict actions that should not be available to everyone.</td></tr>
        <tr><td>Sort Order<br><code>Sort_Order__c</code></td><td class="rh-d">Number</td><td class="rh-d">—</td><td>The order actions appear in, lowest first.</td></tr>
        <tr><td>Inactive<br><code>Inactive__c</code></td><td class="rh-d">Checkbox</td><td class="rh-d">Not ticked</td><td>Check to turn the action off without deleting it. The Grid Admin tab turns actions off this way, since it cannot delete Custom Metadata records. A record that does not mention this field stays on.</td></tr>
        </tbody></table></div>
          <div class="rh-tbox" style="margin-top:18px"><table class="rh-ref">
            <thead><tr><th>Action Type</th><th>Action Name, for example</th><th>Receives</th><th>Runs</th></tr></thead>
            <tbody>
              <tr><td>Screen flow</td><td class="rh-d">Add_Case_Note</td><td>A row: its Id in <code>recordId</code>. Selected rows: their Ids in a text collection named <code>ids</code>.</td><td>On a page of its own, as the user, then back to the grid</td></tr>
              <tr><td>Autolaunched flow</td><td class="rh-d">Mark_Case_Reviewed</td><td>Each record's Id in <code>recordId</code>, one interview per record</td><td>On the server, 50 records per call</td></tr>
              <tr><td>Invocable Apex action</td><td class="rh-d">CaseEscalation</td><td>Each record's Id, as text, in the action's only input</td><td>On the server, 50 records per call</td></tr>
              <tr><td>Quick action</td><td class="rh-d">LogACall, or Object.ActionName</td><td>Each record's Id in <code>contextId</code></td><td>On the server, 50 records per call</td></tr>
            </tbody></table></div>
          <div class="rh-call rh-w" style="margin-top:16px"><span class="rh-k">Access</span><p>Rowhouse checks that the user can read the object and the records, and holds the action's Required Permission if it has one. It does not check the user's access to the flow or Apex class itself, and an autolaunched flow runs in system context by default. To limit who can run an action, give it a Required Permission (a custom permission); to make a flow respect field access, set it to run in user context.</p></div>
        </section>

        <section id="celltypes" data-anchor="celltypes">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>Cell types</h2>
          <p class="rh-sec-sub">Leave <b>Cell Type</b> blank: Rowhouse picks it from the field. These are the values it uses, should you ever need to override one. Cell Type is set in Setup only; the Grid Admin tab keeps it as it is. An unknown value stops the grid with an error naming the column.</p></div>
          <div class="rh-pill-row rh-rv-stagger">
            <span class="rh-ptag">text</span><span class="rh-ptag">textarea</span><span class="rh-ptag">email</span><span class="rh-ptag">phone</span><span class="rh-ptag">url</span><span class="rh-ptag">number</span><span class="rh-ptag">currency</span><span class="rh-ptag">percent</span><span class="rh-ptag">date</span><span class="rh-ptag">datetime</span><span class="rh-ptag">time</span><span class="rh-ptag">checkbox</span><span class="rh-ptag">picklist</span><span class="rh-ptag">multipicklist</span><span class="rh-ptag">reference</span><span class="rh-ptag">owner</span><span class="rh-ptag">id</span>
          </div>
          <p class="rh-note">Numbers, currency and percent align right; checkboxes are centered; everything else aligns left. These can be edited in the grid: text, textarea, email, phone, url, number, currency, percent, date, datetime, time, checkbox, picklist, multipicklist, reference and owner. Rich text and Ids are shown read-only.</p>
        </section>

        <section id="operators" data-anchor="operators">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>Operators and values for rules and filters</h2></div>
          <div class="rh-tbox rh-rv"><table class="rh-ref rh-wrap1">
            <thead><tr><th>Operator</th><th>Works with</th><th>Value, for example</th></tr></thead>
            <tbody>
              <tr><td>Equals · Does not equal</td><td>every type</td><td><span class="rh-v rh-plain">Closed Won</span> <span class="rh-v rh-plain">true</span> <span class="rh-v rh-plain">$User</span></td></tr>
              <tr><td>Greater than · Greater than or equal to · Less than · Less than or equal to</td><td>numbers, currency, percent, dates, date/times, times</td><td><span class="rh-v rh-plain">250000</span> <span class="rh-v rh-plain">TODAY</span> <span class="rh-v rh-plain">TODAY+7</span> <span class="rh-v rh-plain">2026-12-31</span> <span class="rh-v rh-plain">17:30</span></td></tr>
              <tr><td>Between</td><td>numbers, currency, percent, dates, date/times, times</td><td>Value <span class="rh-v rh-plain">10</span> and Value To <span class="rh-v rh-plain">50</span>, both included</td></tr>
              <tr><td>Contains · Does not contain</td><td>text, picklists, multi-select picklists</td><td><span class="rh-v rh-plain">urgent</span></td></tr>
              <tr><td>Starts with</td><td>text, picklists</td><td><span class="rh-v rh-plain">Closed</span></td></tr>
              <tr><td>Is blank · Is not blank</td><td>every type except checkbox (a checkbox is never blank)</td><td>leave Value blank</td></tr>
            </tbody></table></div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Numbers</b> plainly: <span class="rh-v rh-plain">1234.5</span>, no currency symbol or thousands separator.</li>
            <li><b>Dates</b> as <span class="rh-v rh-plain">2026-12-31</span>, or relative to today: <span class="rh-v rh-plain">TODAY</span>, <span class="rh-v rh-plain">TODAY+7</span>, <span class="rh-v rh-plain">TODAY-30</span>. Today is the user's today, in their time zone, worked out when the grid loads.</li>
            <li><b>Checkboxes</b> as <span class="rh-v rh-plain">true</span> or <span class="rh-v rh-plain">false</span>. <b>Picklists</b> by label or API name, in any case.</li>
            <li><b>Lookups and owners</b> by record Id, or <span class="rh-v rh-plain">$User</span> for the person looking at the grid ("my records").</li>
            <li><b>Text</b> comparisons ignore case. A blank value meets only Does not equal and Does not contain, as in a list view filter.</li>
          </ul>
        </section>

        <section id="styles" data-anchor="styles">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>Styles</h2>
          <p class="rh-sec-sub">Colors from Salesforce's own palette, chosen to stay readable with every text color. There is no blue fill and no yellow: Salesforce uses light blue for a selected row and pale yellow for an unsaved edit.</p></div>
          <div class="rh-swatches rh-rv-stagger">
            <div class="rh-sw"><div class="rh-chip" style="background:var(--rh-f-green)">$420,000</div><div class="rh-nm">Green fill</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:var(--rh-f-amber)">10/2/2026</div><div class="rh-nm">Amber fill</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:var(--rh-f-red)">High</div><div class="rh-nm">Red fill</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:var(--rh-f-purple)">Escalated</div><div class="rh-nm">Purple fill</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:var(--rh-f-grey)">Closed</div><div class="rh-nm">Gray fill</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff;color:var(--rh-b-red);font-weight:600">9/28/2026</div><div class="rh-nm">Red text</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff;color:var(--rh-b-green);font-weight:600">+12%</div><div class="rh-nm">Green text</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff;color:#747474">Inactive</div><div class="rh-nm">Gray text</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff;font-weight:700">Key account</div><div class="rh-nm">Bold</div></div>
          </div>
          <h3>Icons and data bars</h3>
          <p>An icon goes before the cell's value: <b>Warning icon</b>, <b>Error icon</b>, <b>Success icon</b>, <b>Info icon</b>, <b>Up arrow</b> and <b>Down arrow</b>. On a Row rule it goes before the row's first value. The rule's Label is what the icon means, for screen readers and in its tooltip. A <b>Data bar</b> draws a bar behind a number, as long as the value's place between the lowest and the highest loaded value, on a scale that always includes zero; Cell rules on number, currency and percent columns only. The rule's condition decides which cells have a bar, so <span class="rh-v rh-plain">Is not blank</span> gives every number one.</p>
          <div class="rh-swatches rh-rv-stagger">
            <div class="rh-sw"><div class="rh-chip" style="background:#fff"><span style="color:#dd7a01">⚠</span> 9/28/2026</div><div class="rh-nm">Warning icon</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff"><span style="color:#2e844a">✔</span> Won</div><div class="rh-nm">Success icon</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:#fff">↑ 12%</div><div class="rh-nm">Up arrow</div></div>
            <div class="rh-sw"><div class="rh-chip" style="background:linear-gradient(to right,#acf3e4 60%,#fff 60%);text-align:right">$250,000</div><div class="rh-nm">Data bar</div></div>
          </div>
          <h3>On a whole row</h3>
          <p>With <b>Apply To</b> set to Row, a fill tints the whole row lightly and draws a 4-pixel bar in the same color at the row's left edge. The tint is lighter than a cell's fill, so a cell rule still shows on the row, and the row's hover, selected and unsaved colors show over it. Text colors and bold apply to every cell of the row.</p>
          <div class="rh-swatches rh-rv-stagger">
            <div class="rh-sw"><div class="rh-chip rh-bar" style="--rh-bc:var(--rh-b-green);--rh-tc:var(--rh-t-green)">Row · Green</div><div class="rh-nm">Green fill, Row</div></div>
            <div class="rh-sw"><div class="rh-chip rh-bar" style="--rh-bc:var(--rh-b-amber);--rh-tc:var(--rh-t-amber)">Row · Amber</div><div class="rh-nm">Amber fill, Row</div></div>
            <div class="rh-sw"><div class="rh-chip rh-bar" style="--rh-bc:var(--rh-b-red);--rh-tc:var(--rh-t-red)">Row · Red</div><div class="rh-nm">Red fill, Row</div></div>
            <div class="rh-sw"><div class="rh-chip rh-bar" style="--rh-bc:var(--rh-b-purple);--rh-tc:var(--rh-t-purple)">Row · Purple</div><div class="rh-nm">Purple fill, Row</div></div>
            <div class="rh-sw"><div class="rh-chip rh-bar" style="--rh-bc:var(--rh-b-grey);--rh-tc:var(--rh-t-grey)">Row · Gray</div><div class="rh-nm">Gray fill, Row</div></div>
          </div>
        </section>

        <section id="formulas" data-anchor="formulas">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>Formulas</h2>
          <p class="rh-sec-sub">Formula columns and formula display rules use the syntax of a Salesforce formula field: the same functions, operators and field names, checked as you type on the Grid Admin tab.</p></div>
          <div class="rh-tbox rh-rv"><table class="rh-ref">
            <thead><tr><th>Formula</th><th>Formula Type</th><th>Gives</th></tr></thead>
            <tbody>
              <tr><td><code>FirstName &amp; " " &amp; LastName</code></td><td>Text</td><td>A contact's full name</td></tr>
              <tr><td><code>Amount * Probability</code></td><td>Currency</td><td>An opportunity's weighted amount (a percent field is a fraction in a formula: 10% is 0.1)</td></tr>
              <tr><td><code>Account.Name</code></td><td>Text</td><td>A field through a lookup</td></tr>
              <tr><td><code>CloseDate - TODAY()</code></td><td>Number</td><td>Days until the close date</td></tr>
              <tr><td><code>Amount &gt; 250000</code></td><td>(a display rule)</td><td>True or false: whether the rule applies</td></tr>
            </tbody></table></div>
          <ul class="rh-tick" style="margin-top:18px">
            <li><b>Worked out on the server</b> as the rows are read, so the values are the saved record's: after a save, the rows read back show the new results.</li>
            <li><b>A field through a lookup</b> works (<code>Account.Name</code>), but not through a lookup that can point to more than one object, such as the owner of a record a queue can own (a case, a lead, a custom object) or a task's Related To: use the lookup's Id instead.</li>
            <li><b>A user who cannot read a field the formula uses</b> does not get the column or the rule, as with a column on a field they cannot read.</li>
            <li><b>A row the formula cannot work out</b> (a division by zero, say) shows a blank cell.</li>
            <li><b>A Percent result is a fraction</b>, as in a formula field: <code>Won__c / Total__c</code> of 0.25 shows as 25%.</li>
            <li><b>A formula can read <code>$User</code>, <code>$Organization</code> and custom settings (<code>$Setup</code>)</b>, which no field check covers: as with a formula field, put nothing in a grid formula its users should not see.</li>
          </ul>
        </section>

        <section id="grouping" data-anchor="grouping">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>Grouping and subtotals</h2></div>
          <div class="rh-tbox rh-rv"><table class="rh-ref">
            <thead><tr><th>Field type</th><th>Users can group by it</th><th>Sum, Average</th><th>Min, Max</th><th>Count</th></tr></thead>
            <tbody>
              <tr><td>Picklist</td><td class="rh-tick">✓</td><td>—</td><td>—</td><td class="rh-tick">✓</td></tr>
              <tr><td>Checkbox</td><td class="rh-tick">✓</td><td>—</td><td>—</td><td>—</td></tr>
              <tr><td>Lookup, owner</td><td class="rh-tick">✓ by name</td><td>—</td><td>—</td><td class="rh-tick">✓</td></tr>
              <tr><td>Date, date/time</td><td class="rh-tick">✓ by day, week, month, quarter, year, fiscal quarter or fiscal year</td><td>—</td><td class="rh-tick">✓</td><td class="rh-tick">✓</td></tr>
              <tr><td>Number, currency, percent</td><td>—</td><td class="rh-tick">✓</td><td class="rh-tick">✓</td><td class="rh-tick">✓</td></tr>
              <tr><td>Text, email, phone, URL</td><td>only with a Group Level or Allow Grouping</td><td>—</td><td>—</td><td class="rh-tick">✓</td></tr>
              <tr><td>Long text, multi-select picklist, record Id, formulas</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
            </tbody></table></div>
          <p class="rh-note" style="margin-top:10px">Count counts the values that are not blank. Subtotals and counts cover every record that matches, not only the rows loaded. A Total row under the grid shows the whole list's subtotals, grouped or not. A week starts on each user's first day of the week; fiscal quarters and years follow the org's fiscal year settings, custom fiscal years included.</p>
        </section>

        <section id="wrong" data-anchor="wrong">
          <div class="rh-sec-head"><span class="rh-sec-num">Values</span><h2>When a setting is wrong</h2>
          <p class="rh-sec-sub">One typo should not take a grid away from everyone, so a setting that cannot work is skipped and the grid still opens. People with the Rowhouse Grid Diagnostics permission set see why, in a line above the grid that opens into the full list.</p></div>
          <figure class="rh-rv">
            <div class="rh-screen"><div class="rh-stage"><div class="rh-card-m">
              <div class="rh-m-head"><div class="rh-m-ico rh-opp"><svg viewBox="0 0 24 24"><path d="M4 18h16v2H4zM6 10h3v6H6zm5-4h3v10h-3zm5 6h3v4h-3z"/></svg></div><div><div class="rh-m-title">Pipeline Review</div><div class="rh-m-meta">31 items • Sorted by Close Date • Updated a few seconds ago</div></div><div class="rh-m-tools"><div class="rh-m-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Search this list…</div><div class="rh-m-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7"/></svg>Display Key</div><div class="rh-m-ibtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div><div class="rh-m-ibtn" title="Choose columns"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M12 5v14"/><path d="M18 5v14"/></svg></div><div class="rh-m-ibtn" title="Grid settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></div><div class="rh-m-ibtn" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg></div><div class="rh-m-btn">New</div><div class="rh-m-btn"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Export</div></div></div>
              <div style="padding:0 14px 12px"><div class="rh-m-warn">3 configuration warnings (shown with Rowhouse Grid Diagnostics only) <span class="rh-m-link" style="margin-left:6px">Hide</span>
                <ul>
                  <li>Format rule Pipeline_Big_Deal was skipped: Value "250,000" is not a number. Write it as 1234.5, without separators or symbols.</li>
                  <li>Grid Column Pipeline_Name: a sum subtotal does not apply to Opportunity Name, a text field, so it is not shown.</li>
                  <li>Grid Column Pipeline_Close: Group Level must be 1, 2 or 3.</li>
                </ul></div></div>
            </div></div></div>
            <figcaption>What an admin with Rowhouse Grid Diagnostics sees when settings cannot work: a line under the grid's title that opens into the list. Users without it see the grid, minus the parts that were skipped.</figcaption>
          </figure>
          <div class="rh-tbox"><table class="rh-ref rh-wrap1">
            <thead><tr><th>Mistake</th><th>What happens</th></tr></thead>
            <tbody>
              <tr><td>Object API Name or a Field API Name that does not exist, an unknown Cell Type, or a Record Page Field that is not a lookup</td><td>The grid shows an error naming the field, object or column. Check the spelling and use API names.</td></tr>
              <tr><td>A format rule that cannot work</td><td>That rule is skipped, with the reason: an unknown field, an operator that does not suit the type, a value that is not a number or a date, a picklist value that does not exist, or a Cell rule on a field that is not a column.</td></tr>
              <tr><td>A grouping or subtotal that does not fit</td><td>Skipped, with the reason: a level other than 1 to 3, a level used twice, a field that cannot be grouped, a subtotal that does not suit the type. An unknown date unit is replaced by month, with a warning.</td></tr>
              <tr><td>A child table or action that cannot work</td><td>That tab or action is left out, with the reason.</td></tr>
              <tr><td>A formula that does not work</td><td>The Grid Admin tab shows Salesforce's own message and keeps Save gray. Saved in Setup, the column or rule is left out, with the reason.</td></tr>
              <tr><td>A Grid Filter that cannot work</td><td>The grid shows an error naming the filter, for everyone: a filter is never skipped.</td></tr>
              <tr><td>A rule on a field the user cannot read</td><td>Left out for that user, with no warning: a colored row would otherwise reveal a value they are not allowed to see.</td></tr>
            </tbody></table></div>
