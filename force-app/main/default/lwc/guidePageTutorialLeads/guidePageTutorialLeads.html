            <h1 style="margin-top:14px">The morning lead queue</h1>
            <p class="rh-dek">Jenna starts each day with the leads that came in overnight. She rates them, calls the hot ones first, and passes the rest to the team. In a list view, each of those is a record opened and saved. Here, one grid of open leads marks the hot ones nobody has called yet in red, logs a call from the row, and hands leads over in one go.</p>

          <div class="rh-persona"><span class="rh-avatar rh-d">JR</span><div><b>Jenna Rossi, Sales Development Representative</b><span>Works the inbound leads every morning. Wants the open ones on one screen, the hot ones nobody has called standing out, and the calls and hand-overs done without opening each lead.</span></div></div>

        <section id="grid" data-anchor="grid">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. The grid</h2>
          <p class="rh-sec-sub">You need the Rowhouse Grid Admin permission set, and Customize Application to save (see <a href="/lightning/n/rowhouse__Rowhouse_Guide?rowhouse__page=start&amp;rowhouse__section=access" data-page="start" data-section="access">Give people access</a>).</p></div>
          <ol class="rh-tut">
            <li><b>Open the Grid Admin tab.</b> Click the App Launcher, type <span class="rh-v rh-plain">Rowhouse</span>, click the <span class="rh-ui">Rowhouse</span> app, then the <span class="rh-ui">Grid Admin</span> tab, and click <span class="rh-ui">New grid</span>.</li>
            <li><b>Fill in the Grid tab:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Grid Title</td><td><span class="rh-v">Lead Queue</span><button class="rh-copy" data-copy="Lead Queue" type="button">Copy</button></td></tr>
                <tr><td>API name</td><td><span class="rh-v">Lead_Queue</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object</td><td><span class="rh-v">Lead (Lead)</span></td></tr>
                <tr><td>Sort by</td><td><span class="rh-v">Last Name (LastName)</span></td></tr>
              </tbody></table></li>
            <li><b>Add the columns.</b> Click <span class="rh-ui">Columns (1)</span>. <span class="rh-ui">Full Name (Name)</span> is already there. For each row below, click <span class="rh-ui">Add column</span>, choose the field, and select <span class="rh-ui">Edit</span>:
              <div class="rh-tbox" style="margin-top:10px"><table class="rh-ref">
                <thead><tr><th>Field</th><th>Edit</th></tr></thead>
                <tbody>
                  <tr><td class="rh-d">Company (Company)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Title (Title)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Status (Status)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Rating (Rating)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Lead Source (LeadSource)</td><td class="rh-tick">✓</td></tr>
                  <tr><td class="rh-d">Owner ID (OwnerId)</td><td class="rh-tick">✓</td></tr>
                </tbody></table></div>
              <div class="rh-check">The Owner ID column's Header box suggests <b>Owner</b>, in gray.</div></li>
          </ol>
        </section>

        <section id="rules" data-anchor="rules">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. A filter and three rules</h2></div>
          <ol class="rh-tut">
            <li><b>Leave out closed leads.</b> Click <span class="rh-ui">Filters (0)</span>, then <span class="rh-ui">Add filter</span>:
              <table class="rh-fields"><tbody>
                <tr><td>Name</td><td><span class="rh-v">Open leads</span><button class="rh-copy" data-copy="Open leads" type="button">Copy</button></td></tr>
                <tr><td>Field</td><td><span class="rh-v">Status (Status)</span></td></tr>
                <tr><td>Condition</td><td><span class="rh-v">Does not contain</span></td></tr>
                <tr><td>Value</td><td><span class="rh-v">Closed</span><button class="rh-copy" data-copy="Closed" type="button">Copy</button></td></tr>
              </tbody></table>
              <div class="rh-check rh-why">Both closed statuses, Closed - Converted and Closed - Not Converted, contain the word, so neither shows.</div></li>
            <li><b>Mark the hot leads nobody has called.</b> Click <span class="rh-ui">Display rules (0)</span>, then <span class="rh-ui">Add display rule</span>, and fill in the row:
              <table class="rh-fields"><tbody>
                <tr><td>Meaning</td><td><span class="rh-v">Hot, not contacted yet</span><button class="rh-copy" data-copy="Hot, not contacted yet" type="button">Copy</button></td></tr>
                <tr><td>Condition</td><td><span class="rh-v">Formula is true</span> <span class="rh-note">choose it first</span></td></tr>
                <tr><td>Field</td><td>leave it empty: it says <i>The cell it colors</i>, and a rule on the whole row needs none</td></tr>
                <tr><td>Value: the box that says <i>Such as Amount__c &gt; Budget__c * 1.1</i></td><td><span class="rh-v">AND(ISPICKVAL(Rating, "Hot"), ISPICKVAL(Status, "Open - Not Contacted"))</span><button class="rh-copy" data-copy="AND(ISPICKVAL(Rating, &quot;Hot&quot;), ISPICKVAL(Status, &quot;Open - Not Contacted&quot;))" type="button">Copy</button></td></tr>
                <tr><td>Look</td><td><span class="rh-v">Red fill</span></td></tr>
                <tr><td>Applies to</td><td><span class="rh-v">The whole row</span></td></tr>
              </tbody></table>
              <div class="rh-check rh-why">A formula rule tests the saved record on the server, with Salesforce's own formula language: here, two fields at once.</div></li>
            <li><b>Point at every hot lead.</b> Click <span class="rh-ui">Add display rule</span>:
              <table class="rh-fields"><tbody>
                <tr><td>Meaning</td><td><span class="rh-v">Hot</span></td></tr>
                <tr><td>Field</td><td><span class="rh-v">Rating (Rating)</span></td></tr>
                <tr><td>Condition</td><td><span class="rh-v">Equals</span></td></tr>
                <tr><td>Value</td><td><span class="rh-v">Hot</span></td></tr>
                <tr><td>Look</td><td><span class="rh-v">Up arrow</span></td></tr>
              </tbody></table></li>
            <li><b>Quiet the cold ones.</b> Click <span class="rh-ui">Add display rule</span> once more: Meaning <span class="rh-v">Cold</span>, Field <span class="rh-v">Rating (Rating)</span>, Condition <span class="rh-v">Equals</span>, Value <span class="rh-v">Cold</span>, Look <span class="rh-v">Gray text</span>.</li>
          </ol>
        </section>

        <section id="action" data-anchor="action">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. Log a call</h2>
          <p class="rh-sec-sub">Log a Call is a global quick action that every org has. Run on a lead, it records a completed call on the lead's activity timeline.</p></div>
          <ol class="rh-tut">
            <li><b>Add the action.</b> Click <span class="rh-ui">Actions (0)</span>, then <span class="rh-ui">Add action</span>, and fill in the row:
              <table class="rh-fields"><tbody>
                <tr><td>Label</td><td><span class="rh-v">Log a call</span><button class="rh-copy" data-copy="Log a call" type="button">Copy</button> <span class="rh-note">what the menu says</span></td></tr>
                <tr><td>Type</td><td><span class="rh-v">Quick action</span></td></tr>
                <tr><td>Runs</td><td><span class="rh-v">LogACall</span><button class="rh-copy" data-copy="LogACall" type="button">Copy</button></td></tr>
                <tr><td>Offered in</td><td><span class="rh-v">Row menu</span></td></tr>
              </tbody></table></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>. After a few seconds the editor reads the grid back: <span class="rh-ui">Columns (7)</span>, <span class="rh-ui">Display rules (3)</span>, <span class="rh-ui">Filters (1)</span>, <span class="rh-ui">Actions (1)</span>.</li>
          </ol>
        </section>

        <section id="page" data-anchor="page">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. The page</h2></div>
          <ol class="rh-tut">
            <li><b>Create an App page.</b> In Setup, type <span class="rh-v rh-plain">Lightning App Builder</span> in the Quick Find box and click <span class="rh-ui">Lightning App Builder</span>. Click <span class="rh-ui">New</span>, choose <span class="rh-ui">App Page</span>, click <span class="rh-ui">Next</span>, enter the Label <span class="rh-v">Lead Queue</span>, click <span class="rh-ui">Next</span>, choose <span class="rh-ui">One Region</span>, and click <span class="rh-ui">Done</span>.</li>
            <li><b>Add the grid.</b> Drag <span class="rh-ui">Rowhouse Grid</span> from the <span class="rh-ui">Custom</span> components onto the page, and enter <span class="rh-v">Lead_Queue</span><button class="rh-copy" data-copy="Lead_Queue" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>.</li>
            <li><b>Save and activate.</b> Click <span class="rh-ui">Save</span>, then <span class="rh-ui">Activate</span>. On the <span class="rh-ui">Lightning Experience</span> tab, choose <span class="rh-ui">Sales</span>, click <span class="rh-ui">Add page to app</span>, then <span class="rh-ui">Save</span>.</li>
          </ol>
        </section>

        <section id="open" data-anchor="open">
          <div class="rh-persona"><span class="rh-avatar rh-d">JR</span><div><b>Now as Jenna</b><span>Jenna has the Rowhouse Grid User permission set.</span></div></div>
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Jenna</span><h2>5. Open the queue</h2></div>
          <ol class="rh-tut">
            <li><b>Open it.</b> In the Sales app, click <span class="rh-ui">Lead Queue</span>.
              <div class="rh-check">The open leads by last name, 15 in a new Developer Edition org, and a locked chip <i>Status does not contain Closed</i>. Bertha Boxer's Rating, Hot, has an arrow before it. No row is red: Bertha has been contacted.</div></li>
            <li><b>See what the marks mean.</b> Click <span class="rh-ui">Display Key</span>: <i>Hot, not contacted yet</i>, <i>Hot</i> and <i>Cold</i>, each with its look. Click it again to close it.</li>
          </ol>
        </section>

        <section id="rate" data-anchor="rate">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Jenna</span><h2>6. Rate a lead</h2>
          <p class="rh-sec-sub">Phyllis Cotton, the CFO of Abbott Insurance, asked for pricing on the website last night.</p></div>
          <ol class="rh-tut">
            <li><b>Rate her Hot.</b> Double-click Phyllis Cotton's <span class="rh-ui">Rating</span> cell and choose <span class="rh-v">Hot</span>.
              <div class="rh-check">The cell is yellow, an unsaved change, and the Save bar says "1 unsaved change".</div></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> in the bar at the bottom.
              <div class="rh-check">"Saved 1 record." An arrow comes before Hot, and Phyllis Cotton's row turns red, with a red bar at its left edge: Hot, and still Open - Not Contacted. A formula rule tests the saved record, so the red comes with Save.</div></li>
          </ol>
        </section>

        <section id="call" data-anchor="call">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Jenna</span><h2>7. Call it in</h2></div>
          <ol class="rh-tut">
            <li><b>Log the call.</b> After calling Phyllis, click the ▾ at the right end of her row and choose <span class="rh-ui">Log a call</span>.
              <div class="rh-check">A message: "Log a call: done on 1 record." The call is on her activity timeline, marked completed.</div></li>
            <li><b>Mark her contacted.</b> Double-click her <span class="rh-ui">Status</span> cell, choose <span class="rh-v">Working - Contacted</span>, and click <span class="rh-ui">Save</span> in the bar at the bottom.
              <div class="rh-check">The red goes; the arrow stays. She is still hot, but no longer waiting.</div></li>
          </ol>
        </section>

        <section id="handover" data-anchor="handover">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Jenna</span><h2>8. Hand leads over</h2>
          <p class="rh-sec-sub">Two leads in health care and manufacturing go to a colleague who covers those industries.</p></div>
          <ol class="rh-tut">
            <li><b>Select them.</b> Select the checkbox at the start of <span class="rh-ui">Mike Braund</span>'s row and of <span class="rh-ui">Jeff Glimpse</span>'s.
              <div class="rh-check">A bar floats over the top of the grid: "2 selected", with <span class="rh-ui">Update field</span> and <span class="rh-ui">Clear</span>.</div></li>
            <li><b>Give them a new owner.</b> Click <span class="rh-ui">Update field</span>. In <span class="rh-ui">Field</span>, choose <span class="rh-ui">Owner</span>; in <span class="rh-ui">New Owner</span>, type part of a colleague's name and choose them; then click <span class="rh-ui">Apply</span>.
              <div class="rh-check">The dialog is headed <b>Change 2 selected rows</b> and names the two leads. Once you click Apply, both Owner cells show your colleague's name, yellow as unsaved changes, and the Save bar says "2 unsaved changes".</div></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>, then <span class="rh-ui">Clear</span> in the selection bar.
              <div class="rh-check">The two leads are your colleague's. They stay in the queue, which shows every open lead you can see; to see only your own, filter the Owner column by <span class="rh-ui">Is me</span>.</div></li>
          </ol>
        </section>

          <div class="rh-sec-head"><span class="rh-sec-num">Wrap-up</span><h2>What you learned</h2></div>

            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1.1.3-2.2 1.5-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></div><h4>Icons and gray</h4><p>Marks that say what a value means, explained in the Display Key.</p></div>

            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5.5 5"/></svg></div><h4>Hand-overs</h4><p>Update field gives selected leads a new owner, checked before Save.</p></div>
