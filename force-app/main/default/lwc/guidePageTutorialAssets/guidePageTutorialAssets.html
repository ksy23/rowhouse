        <section id="assets" data-anchor="assets">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>1. The asset grid</h2>
          <p class="rh-sec-sub">You need the Rowhouse Grid Admin permission set, and Customize Application to save (see <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=start&amp;rowhouse__section=access" data-page="start" data-section="access">Give people access</a>).</p></div>
          <ol class="rh-tut">
            <li><b>Open the Grid Admin tab.</b> Click the App Launcher, type <span class="rh-v rh-plain">Rowhouse</span>, click the <span class="rh-ui">Rowhouse</span> app, then the <span class="rh-ui">Grid Admin</span> tab, and click <span class="rh-ui">New grid</span>.</li>
            <li><b>Fill in the Grid tab:</b>
              <table class="rh-fields"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
                <tr><td>Grid title</td><td><span class="rh-v">Account Assets</span><button class="rh-copy" data-copy="Account Assets" type="button">Copy</button></td></tr>
                <tr><td>API name</td><td><span class="rh-v">Account_Assets</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object</td><td><span class="rh-v">Asset (Asset)</span></td></tr>
                <tr><td>Sort by</td><td><span class="rh-v">Usage End Date (UsageEndDate)</span></td></tr>
                <tr><td>On a record page, show the records whose</td><td><span class="rh-v">Account ID (AccountId), on Account pages</span></td></tr>
              </tbody></table>
              <div class="rh-check"><span class="rh-ui">Create records with New</span> is already selected: users can add assets as rows of the grid.</div></li>
            <li><b>Add the columns.</b> Click <span class="rh-ui">Columns (1)</span>. <span class="rh-ui">Asset Name (Name)</span> is already there. For each row below, click <span class="rh-ui">Add column</span>, choose the field, select <span class="rh-ui">Edit</span> where the table says so, and type the header where it gives one:
              <div class="rh-tbox" style="margin-top:10px"><table class="rh-ref">
                <thead><tr><th>Field</th><th>Edit</th><th>Header</th></tr></thead>
                <tbody>
                  <tr><td class="rh-d">Product ID (Product2Id)</td><td class="rh-tick">✓</td><td></td></tr>
                            <tr><td class="rh-d">Serial Number (SerialNumber)</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td class="rh-d">Status (Status)</td><td class="rh-tick">✓</td><td></td></tr>
                  <tr><td class="rh-d">Usage End Date (UsageEndDate)</td><td class="rh-tick">✓</td><td><span class="rh-v">Warranty ends</span><button class="rh-copy" data-copy="Warranty ends" type="button">Copy</button></td></tr>
                </tbody></table></div>
              <div class="rh-check">Select <span class="rh-ui">Edit</span> on <span class="rh-ui">Asset Name (Name)</span> as well. The Product ID column's Header box suggests <b>Product</b>, in gray.</div></li>
          </ol>
        </section>

        <section id="rules" data-anchor="rules">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>2. Warranty colors</h2></div>
          <ol class="rh-tut">
            <li><b>Add three display rules.</b> Click <span class="rh-ui">Display rules (0)</span>. For each row below, click <span class="rh-ui">Add display rule</span> and fill it in:
              <div class="rh-tbox" style="margin-top:10px"><table class="rh-ref">
                <thead><tr><th>Meaning</th><th>Field</th><th>Condition</th><th>Value</th><th>Look</th><th>Applies to</th></tr></thead>
                <tbody>
                  <tr><td>Warranty ends soon</td><td class="rh-d">Usage End Date (UsageEndDate)</td><td>Between</td><td><span class="rh-v rh-plain">TODAY</span> in the first box, <span class="rh-v rh-plain">TODAY+90</span> in the second</td><td>Amber fill</td><td>The cell</td></tr>
                  <tr><td>Warranty expired</td><td class="rh-d">Usage End Date (UsageEndDate)</td><td>Less than</td><td><span class="rh-v rh-plain">TODAY</span></td><td>Red text</td><td>The cell</td></tr>
                  <tr><td>Retired</td><td class="rh-d">Status (Status)</td><td>Equals</td><td><span class="rh-v rh-plain">Obsolete</span></td><td>Gray text</td><td>The whole row</td></tr>
                </tbody></table></div>
              <div class="rh-check rh-why">TODAY and TODAY+90 are worked out each time the grid opens, so the colors move with the calendar. Between includes both ends.</div></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>. After a few seconds the editor reads the grid back: <span class="rh-ui">Columns (5)</span>, <span class="rh-ui">Display rules (3)</span>.</li>
          </ol>
        </section>

        <section id="base" data-anchor="base">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>3. The account grid</h2></div>
          <ol class="rh-tut">
            <li><b>Start another grid.</b> Click <span class="rh-ui">Grids</span> at the top of the Grid Admin tab, then <span class="rh-ui">New grid</span>, and fill in the Grid tab:
              <table class="rh-fields"><tbody>
                <tr><td>Grid title</td><td><span class="rh-v">Installed Base</span><button class="rh-copy" data-copy="Installed Base" type="button">Copy</button></td></tr>
                <tr><td>API name</td><td><span class="rh-v">Installed_Base</span> <span class="rh-note">fills in by itself</span></td></tr>
                <tr><td>Object</td><td><span class="rh-v">Account (Account)</span></td></tr>
                <tr><td>Sort by</td><td><span class="rh-v">Account Name (Name)</span></td></tr>
              </tbody></table></li>
            <li><b>Add two columns:</b> click <span class="rh-ui">Columns (1)</span>, then <span class="rh-ui">Add column</span> twice, and choose <span class="rh-v">Account Type (Type)</span> and <span class="rh-v">Industry (Industry)</span>. Leave Edit as it is: this grid is for reading.</li>
            <li><b>Add the assets as a tab.</b> Click <span class="rh-ui">Child tables (0)</span>, then <span class="rh-ui">Add child table</span>:
              <table class="rh-fields"><tbody>
                <tr><td>Grid</td><td><span class="rh-v">Account Assets (Account_Assets)</span></td></tr>
                <tr><td>Linked by</td><td><span class="rh-v">Account ID (AccountId)</span> <span class="rh-note">already chosen</span></td></tr>
                <tr><td>Tab label</td><td><span class="rh-v">Assets</span><button class="rh-copy" data-copy="Assets" type="button">Copy</button></td></tr>
              </tbody></table>
              <div class="rh-check rh-why">The same grid as on the account page, so its columns, colors and New come with it.</div></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>: <span class="rh-ui">Columns (3)</span>, <span class="rh-ui">Child tables (1)</span>.</li>
            <li><b>Count each account's assets.</b> Click <span class="rh-ui">Columns (3)</span>, then <span class="rh-ui">Add child total column</span>. In the list that says <i>Choose a child table</i>, choose <span class="rh-v">Assets (Installed_Base_Assets)</span>. Leave <span class="rh-ui">Count</span> as it is and the Header empty: the column is headed <b>Assets</b>.</li>
            <li><b>Show the earliest warranty end.</b> Click <span class="rh-ui">Add child total column</span> again:
              <table class="rh-fields"><tbody>
                <tr><td>Field column: the list that says <i>Choose a child table</i></td><td><span class="rh-v">Assets (Installed_Base_Assets)</span></td></tr>
                <tr><td>The list under it</td><td><span class="rh-v">Min</span></td></tr>
                <tr><td>The list beside it, <i>Choose a field</i></td><td><span class="rh-v">Usage End Date (UsageEndDate)</span></td></tr>
                <tr><td>Header</td><td><span class="rh-v">Earliest warranty end</span><button class="rh-copy" data-copy="Earliest warranty end" type="button">Copy</button></td></tr>
              </tbody></table></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span>: <span class="rh-ui">Columns (5)</span>.</li>
          </ol>
        </section>

        <section id="pages" data-anchor="pages">
          <div class="rh-sec-head"><span class="rh-sec-num">Build it · admin</span><h2>4. The pages</h2></div>
          <ol class="rh-tut">
            <li><b>Put the asset grid on the account page.</b> Open any account, click the gear at the top right, then <span class="rh-ui">Edit Page</span>. Search the components for <span class="rh-v rh-plain">Rowhouse</span>, and drag <span class="rh-ui">Rowhouse Grid</span> onto the page, above the Related and Details tabs. On the right, enter <span class="rh-v">Account_Assets</span><button class="rh-copy" data-copy="Account_Assets" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>. Click <span class="rh-ui">Save</span>; if Salesforce asks, click <span class="rh-ui">Activate</span> and assign the page as the org default for desktop and phone, as in <a href="/lightning/n/rowhouse__Grid_Guide?rowhouse__page=tutorial-contacts&amp;rowhouse__section=page" data-page="tutorial-contacts" data-section="page">Contacts on an account page</a>.</li>
            <li><b>Give the account grid a page.</b> In Lightning App Builder, click <span class="rh-ui">New</span>, choose <span class="rh-ui">App Page</span>, enter the Label <span class="rh-v">Installed Base</span>, choose <span class="rh-ui">One Region</span>, drag <span class="rh-ui">Rowhouse Grid</span> onto it, and enter <span class="rh-v">Installed_Base</span><button class="rh-copy" data-copy="Installed_Base" type="button">Copy</button> in <span class="rh-ui">Grid Configuration</span>. Click <span class="rh-ui">Save</span>, then <span class="rh-ui">Activate</span>; choose <span class="rh-ui">Sales</span>, click <span class="rh-ui">Add page to app</span>, then <span class="rh-ui">Save</span>.</li>
          </ol>
        </section>

        <section id="add" data-anchor="add">
          <div class="rh-persona"><span class="rh-avatar">CM</span><div><b>Now as Colin</b><span>Colin has the Rowhouse Grid User permission set. Grand Hotels &amp; Resorts has just had two generators installed at its Chicago hotel.</span></div></div>
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Colin</span><h2>5. Add a customer's assets</h2></div>
          <ol class="rh-tut">
            <li><b>Open the account.</b> Open <span class="rh-v">Grand Hotels &amp; Resorts Ltd</span>.
              <div class="rh-check">The <b>Account Assets</b> grid is on its page, with no rows yet, and a <b>New</b> button above it.</div></li>
            <li><b>Add the first generator.</b> Click <span class="rh-ui">New</span>. A row appears at the top, with <b>New</b> where a row number goes. Fill in its cells, double-clicking each:
              <table class="rh-fields"><tbody>
                <tr><td>Asset Name</td><td><span class="rh-v">Lobby standby generator</span><button class="rh-copy" data-copy="Lobby standby generator" type="button">Copy</button></td></tr>
                <tr><td>Product</td><td>type <span class="rh-v">Diesel 200</span>, then choose <span class="rh-v">GenWatt Diesel 200kW</span></td></tr>
                <tr><td>Serial Number</td><td><span class="rh-v">GW-200-4471</span><button class="rh-copy" data-copy="GW-200-4471" type="button">Copy</button></td></tr>
                <tr><td>Status</td><td><span class="rh-v">Installed</span></td></tr>
                <tr><td>Warranty ends</td><td>in the calendar, click <span class="rh-ui">Next Month</span> once, then the <span class="rh-v">15</span></td></tr>
              </tbody></table>
              <div class="rh-check">The Save bar says "1 new record", and the row's cells are yellow: unsaved.</div></li>
            <li><b>Add the second.</b> Click <span class="rh-ui">New</span> again, and fill in the new row:
              <table class="rh-fields"><tbody>
                <tr><td>Asset Name</td><td><span class="rh-v">Kitchen generator</span><button class="rh-copy" data-copy="Kitchen generator" type="button">Copy</button></td></tr>
                <tr><td>Product</td><td>type <span class="rh-v">Propane 100</span>, then choose <span class="rh-v">GenWatt Propane 100kW</span></td></tr>
                <tr><td>Serial Number</td><td><span class="rh-v">GW-100-2093</span><button class="rh-copy" data-copy="GW-100-2093" type="button">Copy</button></td></tr>
                <tr><td>Status</td><td><span class="rh-v">Installed</span></td></tr>
                <tr><td>Warranty ends</td><td>click <span class="rh-ui">Previous Month</span> once, then the <span class="rh-v">15</span></td></tr>
              </tbody></table>
              <div class="rh-check">This one came secondhand, with its warranty already over. The new row goes under the first.</div></li>
            <li><b>Save.</b> Click <span class="rh-ui">Save</span> in the bar at the bottom.
              <div class="rh-check"><i>2 items</i>, in order of warranty end: the kitchen generator first, its date red because it has passed; the lobby generator's date amber, because it falls within the next 90 days. Both assets belong to Grand Hotels &amp; Resorts Ltd: the grid knows which account's page it is on, so you never chose the account.</div></li>
          </ol>
        </section>

        <section id="review" data-anchor="review">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Colin</span><h2>6. Review the installed base</h2></div>
          <ol class="rh-tut">
            <li><b>Open the grid.</b> In the Sales app, click <span class="rh-ui">Installed Base</span>.
              <div class="rh-check">Every account. Grand Hotels &amp; Resorts Ltd has a toggle with <b>2</b>; its <b>Assets</b> column says 2 and <b>Earliest warranty end</b> shows the kitchen generator's date. Accounts with no assets have no toggle and say 0.</div></li>
            <li><b>Open the account.</b> Click the toggle beside Grand Hotels &amp; Resorts Ltd.
              <div class="rh-check">One tab, <b>Assets (2)</b>, the same grid as on the account's page: the same columns and the red and amber dates. Its own search and a ▾ menu sit at its top right.</div></li>
          </ol>
        </section>

        <section id="replace" data-anchor="replace">
          <div class="rh-sec-head"><span class="rh-sec-num">Use it · Colin</span><h2>7. Replace a generator</h2>
          <p class="rh-sec-sub">The hotel is replacing the kitchen generator rather than renewing its warranty. Colin records both, without leaving the list.</p></div>
          <ol class="rh-tut">
            <li><b>Retire the old one.</b> In the tab, double-click the kitchen generator's <span class="rh-ui">Status</span> and choose <span class="rh-v">Obsolete</span>.
              <div class="rh-check">The row's text turns gray at once: the Retired rule follows the unsaved value. Its expired date stays red; the date's own rule comes first.</div></li>
            <li><b>Add the new one.</b> Open the ▾ menu at the top right of the tab and choose <span class="rh-ui">New</span>. A row appears at the top of the tab; fill it in:
              <table class="rh-fields"><tbody>
                <tr><td>Asset Name</td><td><span class="rh-v">Kitchen generator</span><button class="rh-copy" data-copy="Kitchen generator" type="button">Copy</button></td></tr>
                <tr><td>Product</td><td>type <span class="rh-v">Propane 500</span>, then choose <span class="rh-v">GenWatt Propane 500kW</span></td></tr>
                <tr><td>Status</td><td><span class="rh-v">Purchased</span></td></tr>
                <tr><td>Warranty ends</td><td>in the year list at the top right of the calendar, choose next year, then click the <span class="rh-v">15</span></td></tr>
              </tbody></table>
              <div class="rh-check">The panel's Save bar says "1 new record, 5 unsaved changes".</div></li>
            <li><b>Save the tab.</b> Click <span class="rh-ui">Save</span> in the panel's bar.
              <div class="rh-check">The tab says <b>Assets (3)</b>, and the toggle 3. The new generator's date has no color: it is more than 90 days away. It belongs to Grand Hotels &amp; Resorts Ltd, the row the tab is under.</div></li>
            <li><b>Refresh the account grid.</b> Click <span class="rh-ui">Refresh</span> above the grid.
              <div class="rh-check">The Assets column says 3. Totals on a row are worked out when the grid reads its rows, so a change saved in a tab shows there after Refresh.</div></li>
          </ol>
        </section>

        <section id="learned" data-anchor="learned">
          <div class="rh-sec-head"><span class="rh-sec-num">Wrap-up</span><h2>What you learned</h2></div>
          <div class="rh-tiles rh-rv-stagger">
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg></div><h4>One grid, two places</h4><p>A record page grid can also be another grid's tab, with the same columns and rules.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div><h4>New rows that know their parent</h4><p>On a record page, or from a tab's ▾ menu, New fills in the record it belongs to.</p></div>
            <div class="rh-tile rh-rose"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1.1.3-2.2 1.5-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></div><h4>Dates that move</h4><p>TODAY and TODAY+90 keep the colors right every day.</p></div>
            <div class="rh-tile rh-teal"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg></div><h4>Min and count</h4><p>Child totals put each account's asset count and earliest date on its row.</p></div>
