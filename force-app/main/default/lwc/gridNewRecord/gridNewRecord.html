<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="heading"
        class="slds-modal slds-fade-in-open slds-modal_medium rh-new-record"
        onkeydown={handleKeyDown}
    >
        <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
        <div class="slds-modal__container">
            <lightning-button-icon
                class="slds-button slds-button_icon slds-modal__close rh-new-record-close"
                icon-name="utility:close"
                variant="bare"
                size="large"
                alternative-text="Cancel and close"
                title="Cancel and close"
                onclick={handleCancel}
            ></lightning-button-icon>
            <div class="slds-modal__header">
                <h1 id="heading" class="slds-modal__title slds-hyphenate">{heading}</h1>
                <p class="slds-m-top_x-small rh-new-record-where">{whereText}</p>
            </div>
            <div class="slds-modal__content slds-p-around_medium">
                <!-- Salesforce's own form: the object's page layout, its required fields and its rules. -->
                <lightning-record-form
                    class="rh-new-record-form"
                    object-api-name={objectApiName}
                    layout-type="Full"
                    columns="2"
                    mode="edit"
                    onsuccess={handleSuccess}
                    oncancel={handleCancel}
                ></lightning-record-form>
            </div>
        </div>
        <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
