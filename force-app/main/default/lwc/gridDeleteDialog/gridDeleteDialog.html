<template>
    <section
        role="alertdialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="heading"
        aria-describedby="description"
        class="slds-modal slds-fade-in-open slds-modal_prompt rh-delete-dialog"
        onkeydown={handleKeyDown}
    >
        <div tabindex="0" data-guard="start" onfocus={handleGuardStart}></div>
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close rh-delete-close" title="Cancel and close" onclick={handleCancel}>
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header slds-theme_error">
                <h1 id="heading" class="slds-modal__title slds-hyphenate">{heading}</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="description">
                <ul class="slds-list_dotted slds-m-bottom_small rh-delete-names">
                    <template for:each={shownNames} for:item="n">
                        <li key={n.key}>{n.name}</li>
                    </template>
                </ul>
                <template lwc:if={moreText}>
                    <p class="slds-m-bottom_small rh-delete-more">{moreText}</p>
                </template>
                <template lwc:if={matchingText}>
                    <p class="slds-m-bottom_small rh-delete-matching">{matchingText}</p>
                </template>
                <p class="rh-delete-where">{whereText}</p>
                <template lwc:if={draftsText}>
                    <p class="slds-m-top_small slds-text-color_error rh-delete-drafts">{draftsText}</p>
                </template>
            </div>
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral rh-delete-cancel" onclick={handleCancel}>Cancel</button>
                <button class="slds-button slds-button_destructive rh-delete-confirm" onclick={handleConfirm}>Delete</button>
            </div>
        </div>
        <div tabindex="0" data-guard="end" onfocus={handleGuardEnd}></div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
